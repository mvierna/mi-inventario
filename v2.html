<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario V3 - Modo Datáfono</title>
    
    <!-- Librería ZXing para Cámara -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        :root {
            --primary-blue: #0055A5;
            --header-red: #A30000;
            --bg-light: #f4f6f8;
            --btn-green: #27ae60;
            --btn-red: #e74c3c;
            --btn-orange: #e67e22;
        }
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-light); margin: 0; padding: 0; color: #333; }
        header { background-color: var(--header-red); color: white; padding: 12px 16px; font-weight: bold; font-size: 1.1rem; }
        nav { display: flex; background-color: var(--primary-blue); overflow-x: auto; }
        nav button { flex: 1; padding: 12px 8px; background: none; border: none; color: white; font-weight: bold; font-size: 0.9rem; cursor: pointer; border-bottom: 4px solid transparent; }
        nav button.active { border-bottom-color: white; background-color: rgba(255,255,255,0.15); }
        .container { padding: 15px; max-width: 650px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card-title { color: var(--primary-blue); font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-group input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 0.95rem; }
        .btn-blue { background-color: var(--primary-blue); }
        .btn-green { background-color: var(--btn-green); width: 100%; margin-top: 10px; height: 45px; }
        .btn-red { background-color: var(--btn-red); width: 100%; margin-top: 8px; height: 45px;}
        .tabla-datos { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .tabla-datos th { background-color: #f0f3f6; text-align: left; padding: 8px; border-bottom: 2px solid #ddd; }
        .tabla-datos td { padding: 10px 8px; border-bottom: 1px solid #eee; }
        .badge-precio { color: #27ae60; font-weight: bold; font-size: 1rem; }
        .btn-del { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-weight: bold; }
        .empty-msg { text-align: center; color: #888; padding: 15px; font-style: italic; }
        #scanner-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: none; margin-bottom: 10px; }
        #video-preview { width: 100%; height: 250px; object-fit: cover; display: block; }
        
        /* TPV / TECLADO GIGANTE (NOVEDAD) */
        .t-display { font-size: 38px; font-weight: bold; text-align: right; padding: 15px; background: #222; color: #0f0; border-radius: 8px; margin-bottom: 10px; font-family: monospace;}
        .t-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .t-btn { padding: 20px 10px; font-size: 26px; font-weight: bold; border: none; border-radius: 8px; background: #e2e8f0; color: #1e293b; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer;}
        .t-btn:active { background: #cbd5e1; transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .t-btn-ok { background: var(--btn-green); color: white; }
        .t-btn-ok:active { background: #1e8449; }
        .t-btn-del { background: var(--btn-red); color: white; }
    </style>
</head>
<body>

    <header><span>📌 INVENTARIO V3</span></header>

    <nav>
        <button id="tab-consulta" onclick="cambiarPestana('consulta')">🔍 Consulta</button>
        <button id="tab-reposicion" onclick="cambiarPestana('reposicion')">📦 Reposición</button>
        <button id="tab-chequeo" class="active" onclick="cambiarPestana('chequeo')">📋 Chequeo</button>
    </nav>

    <div class="container">
        
        <!-- PESTAÑA CONSULTA (MINIFICADA) -->
        <div id="sec-consulta" class="tab-content">
            <div class="card">
                <div class="card-title">🔍 Consulta</div>
                <div class="input-group">
                    <input type="text" id="inputConsulta" placeholder="EAN..." onkeyup="if(event.key==='Enter') buscarArticulo()">
                    <button class="btn btn-blue" onclick="buscarArticulo()">Buscar</button>
                </div>
                <div id="detalleConsulta" style="margin-top:10px;"></div>
            </div>
        </div>

        <!-- PESTAÑA REPOSICIÓN (MINIFICADA) -->
        <div id="sec-reposicion" class="tab-content">
            <div class="card">
                <div class="card-title">📦 Añadir a Reposición</div>
                <div class="input-group">
                    <input type="text" id="inputRepoEAN" placeholder="EAN..." onkeyup="if(event.key==='Enter') document.getElementById('inputRepoCant').focus()">
                    <input type="number" id="inputRepoCant" placeholder="Cant." style="max-width: 80px;" value="1" onkeyup="if(event.key==='Enter') agregarReposicion()">
                    <button class="btn btn-blue" onclick="agregarReposicion()">Añadir</button>
                </div>
            </div>
            <div class="card">
                <table class="tabla-datos"><thead><tr><th>EAN</th><th>Desc</th><th>Cant</th><th></th></tr></thead><tbody id="listaReposicion"></tbody></table>
                <div id="msgRepoVacio" class="empty-msg">Vacío.</div>
            </div>
        </div>

        <!-- PESTAÑA CHEQUEO -->
        <div id="sec-chequeo" class="tab-content active">
            
            <!-- TARJETA 1: ESCÁNER / LECTURA -->
            <div class="card" id="card-controles-chequeo">
                <div class="card-title">📋 Chequeo (Modo Datáfono)</div>
                <div class="input-group" style="margin-bottom: 12px;">
                    <input type="text" id="inputManual" placeholder="Escanear EAN o cámara..." onkeyup="if(event.key==='Enter') atraparEanTeclado()">
                    <button class="btn btn-blue" onclick="document.getElementById('inputManual').value=''; document.getElementById('inputManual').focus();">X</button>
                </div>
                <div id="scanner-container"><video id="video-preview" playsinline autoplay muted></video></div>
                <button class="btn btn-blue" id="btn-iniciar-cam" style="width: 100%; height: 50px;" onclick="iniciarCamara()">📷 CÁMARA</button>
                <button class="btn btn-red" id="btn-detener-cam" style="display: none;" onclick="detenerCamara()">Detener Cámara</button>
            </div>

            <!-- TARJETA 2: TECLADO GIGANTE TPV (NOVEDAD ABSOLUTA) -->
            <div class="card" id="modal-precio" style="display:none; background-color: #f1f5f9; border: 2px solid #0055A5;">
                <div style="font-size: 0.9rem; margin-bottom: 10px; color:#555;">
                    <strong style="color:var(--primary-blue);">EAN:</strong> <span id="lbl-ean"></span><br>
                    <strong style="color:var(--primary-blue);">Art:</strong> <span id="lbl-desc"></span>
                </div>
                
                <div class="t-display" id="display-precio">0,00 €</div>
                
                <div class="t-grid">
                    <button class="t-btn" onclick="teclaPulsada('7')">7</button>
                    <button class="t-btn" onclick="teclaPulsada('8')">8</button>
                    <button class="t-btn" onclick="teclaPulsada('9')">9</button>
                    <button class="t-btn" onclick="teclaPulsada('4')">4</button>
                    <button class="t-btn" onclick="teclaPulsada('5')">5</button>
                    <button class="t-btn" onclick="teclaPulsada('6')">6</button>
                    <button class="t-btn" onclick="teclaPulsada('1')">1</button>
                    <button class="t-btn" onclick="teclaPulsada('2')">2</button>
                    <button class="t-btn" onclick="teclaPulsada('3')">3</button>
                    <button class="t-btn t-btn-del" onclick="borrarTecla()">⌫</button>
                    <button class="t-btn" onclick="teclaPulsada('0')">0</button>
                    <button class="t-btn t-btn-ok" onclick="confirmarPrecio()">OK</button>
                </div>
                <button class="btn btn-red" style="width:100%; margin-top:15px;" onclick="cancelarPrecio()">Cancelar Chequeo</button>
            </div>

            <!-- TABLA CHEQUEOS -->
            <div class="card">
                <table class="tabla-datos"><thead><tr><th>EAN</th><th>Desc</th><th>Precio Comp</th><th></th></tr></thead><tbody id="listaChequeados"></tbody></table>
                <div id="msgChequeoVacio" class="empty-msg">Lista vacía.</div>
                <button class="btn btn-green" id="btnEnviarDrive" onclick="enviarADrive()">🟢 Enviar a Drive</button>
            </div>
        </div>
    </div>

    <!-- DB Externa -->
    <script src="articulos.js"></script>

    <script>
        if (typeof baseDeDatos === 'undefined') { var baseDeDatos = { "8433897065104": { descripcion: "FUNDA (Demo)", precio: "2,50" }}; }
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbwyWT6AoIwslK5RR7fmu76wXaeE0bbagn279y1DI32dpZ6Ncs1KxYo0fcY4Z5wuSPiivw/exec";

        let listas = { chequeos: [], reposicion: [] };
        let audioCtx = null;
        let codeReader = null;
        
        // Variables TPV
        let eanPendiente = "";
        let descPendiente = "";
        let precioTeclado = ""; 
        let camaraEstabaActiva = false;

        function cambiarPestana(pestaña) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`sec-${pestaña}`).classList.add('active');
            document.getElementById(`tab-${pestaña}`).classList.add('active');
            if(pestaña !== 'chequeo') detenerCamara();
        }

        function emitirPitido() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function obtenerArticuloDeBD(eanRaw) {
            let eanLimpio = eanRaw.replace(/^0+/, '');
            return baseDeDatos[eanLimpio] || baseDeDatos[eanLimpio.padStart(12, '0')] || baseDeDatos[eanLimpio.padStart(13, '0')];
        }

        /* ----- MODO CÁMARA ZXING ----- */
        async function iniciarCamara() {
            document.getElementById('btn-iniciar-cam').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'block';
            document.getElementById('btn-detener-cam').style.display = 'block';
            if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
            try {
                const devs = await codeReader.listVideoInputDevices();
                const devId = devs.length > 0 ? devs[devs.length - 1].deviceId : undefined;
                codeReader.decodeFromVideoDevice(devId, 'video-preview', (result, err) => {
                    if (result) atraparEAN(result.text.trim(), true);
                });
            } catch (err) { alert("Error cámara"); detenerCamara(); }
        }
        function detenerCamara() {
            if (codeReader) codeReader.reset();
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('btn-detener-cam').style.display = 'none';
            document.getElementById('btn-iniciar-cam').style.display = 'block';
        }

        /* ----- ATRAPAR EAN Y LANZAR TPV ----- */
        function atraparEanTeclado() { atraparEAN(document.getElementById('inputManual').value.trim(), false); }

        function atraparEAN(eanRaw, vieneDeCamara) {
            if(!eanRaw) return;
            emitirPitido();
            let art = obtenerArticuloDeBD(eanRaw);
            eanPendiente = eanRaw;
            descPendiente = art ? art.descripcion : "No registrado";
            
            // Pausar UI y abrir TPV
            camaraEstabaActiva = vieneDeCamara || (document.getElementById('scanner-container').style.display === 'block');
            if (codeReader) codeReader.reset();
            document.getElementById('inputManual').value = '';

            document.getElementById('lbl-ean').textContent = eanPendiente;
            document.getElementById('lbl-desc').textContent = descPendiente;
            
            precioTeclado = ""; 
            actualizarDisplay();

            document.getElementById('card-controles-chequeo').style.display = 'none';
            document.getElementById('modal-precio').style.display = 'block';
        }

        /* ----- MOTOR DEL TECLADO GIGANTE (TPV) ----- */
        function teclaPulsada(num) {
            if (precioTeclado.length < 6) precioTeclado += num;
            actualizarDisplay();
        }
        function borrarTecla() {
            precioTeclado = precioTeclado.slice(0, -1);
            actualizarDisplay();
        }
        function actualizarDisplay() {
            if(precioTeclado === "") {
                document.getElementById('display-precio').textContent = "0,00 €";
                return;
            }
            // Convierte "12990" en "129,90"
            let val = precioTeclado.padStart(3, '0');
            let ent = val.slice(0, -2);
            let dec = val.slice(-2);
            document.getElementById('display-precio').textContent = ent + "," + dec + " €";
        }
        function confirmarPrecio() {
            if(precioTeclado === "") return;
            let precioFinal = document.getElementById('display-precio').textContent;
            listas.chequeos.unshift({ ean: eanPendiente, descripcion: descPendiente, precio: precioFinal, id: Date.now() });
            renderizarTablaChequeos();
            cerrarPeticionPrecio();
        }
        function cancelarPrecio() { cerrarPeticionPrecio(); }
        function cerrarPeticionPrecio() {
            document.getElementById('modal-precio').style.display = 'none';
            document.getElementById('card-controles-chequeo').style.display = 'block';
            if(camaraEstabaActiva) iniciarCamara();
            else document.getElementById('inputManual').focus();
        }

        /* SOPORTE PARA TECLADO FÍSICO DEL DATÁFONO EN EL TPV */
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('modal-precio').style.display === 'block') {
                if (e.key >= '0' && e.key <= '9') teclaPulsada(e.key);
                else if (e.key === 'Backspace') borrarTecla();
                else if (e.key === 'Enter') confirmarPrecio();
            }
        });

        /* ----- TABLAS Y DRIVE ----- */
        function renderizarTablaChequeos() {
            let tbody = document.getElementById('listaChequeados'); tbody.innerHTML = '';
            if (listas.chequeos.length === 0) { document.getElementById('msgChequeoVacio').style.display = 'block'; return; }
            document.getElementById('msgChequeoVacio').style.display = 'none';
            listas.chequeos.forEach(i => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${i.ean}</td><td>${i.descripcion}</td><td><span class="badge-precio">${i.precio}</span></td>
                                <td><button class="btn-del" onclick="listas.chequeos=listas.chequeos.filter(x=>x.id!==${i.id}); renderizarTablaChequeos();">✕</button></td>`;
                tbody.appendChild(tr);
            });
        }

        async function enviarADrive() {
            if (listas.chequeos.length === 0) return alert("Vacío.");
            const btn = document.getElementById('btnEnviarDrive'); btn.disabled = true; btn.textContent = "⏳ Enviando...";
            try {
                await fetch(URL_SCRIPT_GOOGLE, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(listas.chequeos) });
                alert("✅ Guardado"); listas.chequeos = []; renderizarTablaChequeos();
            } catch (e) { alert("❌ Error"); } 
            finally { btn.disabled = false; btn.textContent = "🟢 Enviar a Drive"; }
        }
    </script>
</body>
</html>

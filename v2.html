<!-- PESTAÑA CHEQUEO UNIFICADO -->
        <div id="tab-chequeo" class="tab-content">
            <div class="card">
                <h3>🔍 Chequeo Rápido (EAN Teclado + Foto Precio)</h3>
                <p style="font-size: 12px; color: #666; margin-bottom: 8px;">1. Escanea el EAN con tu teclado. 2. Saca la foto de la etiqueta para extraer el precio automáticamente.</p>
                <div class="input-group">
                    <input type="text" id="input-chequeo" placeholder="EAN (usa tu teclado escáner)..." autocomplete="off" oninput="limpiarEanInput(this)">
                    <label class="btn-camera" style="background-color: #004085; cursor: pointer; padding: 0 16px;" title="Capturar etiqueta y precio">
                        📷 Foto Precio <input type="file" accept="image/*" capture="environment" id="input-foto-etiqueta" style="display: none;" onchange="procesarFotoEtiquetaCompleta(event)">
                    </label>
                </div>

                <h3 style="margin-top: 15px;">Artículos Chequeados</h3>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 100px;">EAN</th>
                            <th>Descripción</th>
                            <th style="width: 75px;">Precio OCR</th>
                            <th style="width: 45px;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-chequeo-body"></tbody>
                </table>
                <br>
                <button class="btn-success" onclick="enviarGoogleDrive('chequeo')">☁️ Enviar Chequeo a Drive</button>
                <br><br>
                <button class="btn-danger" onclick="vaciarListaChequeo()">🗑️ Vaciar Lista</button>
            </div>
        </div>

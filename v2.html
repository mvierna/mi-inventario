<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario V2</title>
    <style>
        :root {
            --primary-blue: #0055A5;
            --header-red: #A30000;
            --bg-light: #f4f6f8;
            --btn-green: #27ae60;
            --btn-red: #e74c3c;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Cabecera y Navegación */
        header {
            background-color: var(--header-red);
            color: white;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav {
            display: flex;
            background-color: var(--primary-blue);
            overflow-x: auto;
        }

        nav button {
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
        }

        nav button.active {
            border-bottom-color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Contenedor Principal */
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        .card-title {
            color: var(--primary-blue);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        /* Área de lectura OCR */
        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.95rem;
        }

        .btn-blue { background-color: var(--primary-blue); }
        .btn-green { background-color: var(--btn-green); width: 100%; margin-top: 10px; }
        .btn-red { background-color: var(--btn-red); }
        .btn-full-red { background-color: var(--btn-red); width: 100%; margin-top: 8px; }

        /* Tabla / Lista de Chequeo */
        .tabla-chequeos {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .tabla-chequeos th {
            background-color: #f0f3f6;
            text-align: left;
            padding: 8px;
            border-bottom: 2px solid #ddd;
        }

        .tabla-chequeos td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .badge-precio {
            color: #d32f2f;
            font-weight: bold;
        }

        .badge-no-precio {
            background-color: #ffebee;
            color: #c62828;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .btn-del {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            padding: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        📌 SISTEMA DE INVENTARIO V2
    </header>

    <nav>
        <button>🔍 Consulta</button>
        <button>📦 Reposición</button>
        <button class="active">📋 Chequeo</button>
        <button>💰 Presupuesto</button>
    </nav>

    <div class="container">
        <!-- Bloque de Entrada OCR -->
        <div class="card">
            <div class="card-title">🔍 Chequeo Masivo con Teclado OCR</div>
            <div class="card-subtitle">
                Usa el modo <b>Text</b> de tu teclado. Filtra estrictamente códigos EAN de 13 dígitos y detecta precios.
            </div>
            
            <div class="input-group">
                <input type="text" id="inputOcr" placeholder="Usa la función Text de tu teclado..." autocomplete="off" autofocus>
                <button class="btn btn-blue" onclick="limpiarInput()">Limpiar</button>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="card">
            <div class="card-title">Artículos Chequeados</div>
            
            <table class="tabla-chequeos">
                <thead>
                    <tr>
                        <th>EAN</th>
                        <th>Descripción</th>
                        <th>Precio OCR</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaChequeados">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
            
            <div id="mensajeVacio" class="empty-msg">No hay artículos chequeados.</div>

            <button class="btn btn-green" onclick="enviarADrive()">🟢 Enviar Chequeo a Drive</button>
            <button class="btn btn-full-red" onclick="vaciarLista()">🗑️ Vaciar Lista</button>
        </div>
    </div>

    <script>
        // Simulador de Base de Datos en Memoria (Sustituir/Conectar con la BDD real)
        const baseDeDatos = {
            "8433897065104": "FUNDA DE ROPA 60*100",
            "8433897065043": "CAJA MULTI C 45X 45X20"
        };

        let chequeos = [];
        let ocrTimer = null;

        const inputOcr = document.getElementById('inputOcr');
        const listaChequeados = document.getElementById('listaChequeados');
        const mensajeVacio = document.getElementById('mensajeVacio');

        // Escuchador de entrada con debounce para frenar el texto en ráfaga del teclado OCR
        inputOcr.addEventListener('input', function(e) {
            clearTimeout(ocrTimer);

            // Esperar 500ms a que el OCR termine de pegar todo el bloque
            ocrTimer = setTimeout(() => {
                procesarEntradaOCR(e.target.value);
            }, 500);
        });

        function procesarEntradaOCR(texto) {
            if (!texto || !texto.trim()) return;

            // 1. Extraer EAN de exactamente 13 dígitos
            const regexEAN = /\b\d{13}\b/;
            // 2. Extraer Precio (ej. 1,95 o 1.95)
            const regexPrecio = /\b\d+[,.]\d{2}\b/;

            const matchEAN = texto.match(regexEAN);
            const matchPrecio = texto.match(regexPrecio);

            if (matchEAN) {
                const ean = matchEAN[0];
                let precio = matchPrecio ? matchPrecio[0].replace('.', ',') + " €" : "No detectado";

                // Buscar en la Base de Datos
                const descripcion = baseDeDatos[ean] || "Artículo no registrado en BDD";

                // Añadir al registro
                agregarChequeo(ean, descripcion, precio);

                // VACIAR SIEMPRE EL INPUT TRAS ÉXITO
                inputOcr.value = '';
            } else {
                // SI NO HABÍA UN EAN VÁLIDO (Solo entraron descripciones/basura)
                // Limpiamos inmediatamente para no dejar restos atascados
                console.warn("Lectura descartada por no contener EAN válido:", texto);
                inputOcr.value = '';
            }
        }

        function agregarChequeo(ean, descripcion, precio) {
            chequeos.unshift({ ean, descripcion, precio, id: Date.now() });
            renderizarTabla();
        }

        function eliminarChequeo(id) {
            chequeos = chequeos.filter(item => item.id !== id);
            renderizarTabla();
        }

        function vaciarLista() {
            if (chequeos.length === 0) return;
            if (confirm("¿Deseas vaciar la lista completa de chequeos?")) {
                chequeos = [];
                renderizarTabla();
            }
        }

        function limpiarInput() {
            inputOcr.value = '';
            inputOcr.focus();
        }

        function renderizarTabla() {
            listaChequeados.innerHTML = '';

            if (chequeos.length === 0) {
                mensajeVacio.style.display = 'block';
                return;
            }

            mensajeVacio.style.display = 'none';

            chequeos.forEach(item => {
                const tr = document.createElement('tr');

                const tdEan = document.createElement('td');
                tdEan.textContent = item.ean;

                const tdDesc = document.createElement('td');
                tdDesc.textContent = item.descripcion;
                if (item.descripcion === "Artículo no registrado en BDD") {
                    tdDesc.style.color = "#777";
                }

                const tdPrecio = document.createElement('td');
                if (item.precio === "No detectado") {
                    tdPrecio.innerHTML = `<span class="badge-no-precio">No detectado</span>`;
                } else {
                    tdPrecio.innerHTML = `<span class="badge-precio">${item.precio}</span>`;
                }

                const tdAccion = document.createElement('td');
                const btnDel = document.createElement('button');
                btnDel.className = 'btn-del';
                btnDel.textContent = '✕';
                btnDel.onclick = () => eliminarChequeo(item.id);
                tdAccion.appendChild(btnDel);

                tr.appendChild(tdEan);
                tr.appendChild(tdDesc);
                tr.appendChild(tdPrecio);
                tr.appendChild(tdAccion);

                listaChequeados.appendChild(tr);
            });
        }

        function enviarADrive() {
            if (chequeos.length === 0) {
                alert("La lista está vacía.");
                return;
            }
            alert(`Enviando ${chequeos.length} registros a Google Drive...`);
            // Aquí iría el fetch/POST a tu Web App Appscript de Google Drive
        }
    </script>
</body>
</html>

            var video = document.getElementById('entrada-video');
            try {
                flujoQR = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            } catch (e) { estado.textContent = '⚠️ No se puede abrir la cámara: ' + (e && e.message ? e.message : e); return; }
            video.srcObject = flujoQR; video.style.display = 'block';
            try { await video.play(); } catch (e) {}
            estado.textContent = 'Apunta al QR de la clave';
            var nativo = null;
            try { if ('BarcodeDetector' in window) nativo = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
            if (!nativo && typeof ZXingWASM === 'undefined') {
                await new Promise(function (ok) { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js'; s.onload = s.onerror = ok; document.head.appendChild(s); });
            }
            var lienzo = document.createElement('canvas'), ctx = lienzo.getContext('2d', { willReadFrequently: true });
            while (flujoQR) {
                var texto = null;
                if (video.videoWidth) {
                    try {
                        if (nativo) { var r = await nativo.detect(video); texto = r.length ? r[0].rawValue : null; }
                        else if (typeof ZXingWASM !== 'undefined') {
                            lienzo.width = video.videoWidth; lienzo.height = video.videoHeight; ctx.drawImage(video, 0, 0);
                            var z = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, lienzo.width, lienzo.height), { formats: ['QRCode'], maxNumberOfSymbols: 1 });
                            texto = z.length ? z[0].text : null;
                        }
                    } catch (e) {}
                }
                var m = texto && texto.trim().match(/^MOVILEC-CLAVE:(.+)$/);
                if (m) { await abrir(m[1], true); return; }
                await new Promise(function (ok) { setTimeout(ok, 250); });
            }
        };

        if (!window.crypto || !crypto.subtle) { pedirClave('⚠️ Abre la app desde su dirección https'); return; }
        var guardada = '';
        try { guardada = localStorage.getItem(CLAVE_GUARDADA) || ''; } catch (e) {}
        if (guardada) abrir(guardada, false); else pedirClave('Escribe la clave o escanea su QR');
    })();
    </script>

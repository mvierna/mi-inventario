        var ITERACIONES = 150000;
        var CLAVE_GUARDADA = 'inventarioClaveDrive';
        var estado = document.getElementById('entrada-estado');
        var flujoQR = null;

        function bytes(base64) { var s = atob(base64), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }

        // Devuelve el HTML de la app, o null si la clave no es la buena (lo dice la firma HMAC antes de descifrar)
        async function descifrar(clave) {
            var b = bytes(DATOS), sal = b.slice(0, 16), iv = b.slice(16, 32), firma = b.slice(b.length - 32), cifrado = b.slice(32, b.length - 32);
            var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
            var k = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: sal, iterations: ITERACIONES, hash: 'SHA-256' }, base, 512));
            var kFirma = await crypto.subtle.importKey('raw', k.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
            if (!await crypto.subtle.verify('HMAC', kFirma, firma, b.slice(16, b.length - 32))) return null;
            var kAes = await crypto.subtle.importKey('raw', k.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
            return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, kAes, cifrado));
        }

        function pedirClave(aviso) {
            estado.textContent = aviso;
            document.getElementById('entrada-form').style.display = 'flex';
        }

        function pararQR() {
            if (flujoQR) { flujoQR.getTracks().forEach(function (t) { t.stop(); }); flujoQR = null; }
            document.getElementById('entrada-video').style.display = 'none';
        }

        async function abrir(clave, guardar) {
            clave = String(clave || '').trim();
            if (!clave) { pedirClave('Escribe la clave o escanea su QR'); return; }
            estado.textContent = 'Abriendo...';
            var html;
            try { html = await descifrar(clave); }
            catch (e) { pedirClave('⚠️ Este navegador no puede abrir la app: ' + (e && e.message ? e.message : e)); return; }
            if (html === null) { pedirClave('🔑 La clave no es correcta'); return; }
            pararQR();
            if (guardar) { try { localStorage.setItem(CLAVE_GUARDADA, clave); } catch (e) {} }
            await ponerApp(html);
        }

        // Cambia esta página por la app y ejecuta sus scripts en orden, esperando a cada librería.
        // (No se usa document.write: con poca cobertura Chrome bloquea las librerías externas escritas así.)
        async function ponerApp(html) {
            var nueva = new DOMParser().parseFromString(html, 'text/html').documentElement;
            document.replaceChild(document.adoptNode(nueva), document.documentElement);
            var scripts = Array.prototype.slice.call(document.querySelectorAll('script'));
            for (var i = 0; i < scripts.length; i++) {
                var viejo = scripts[i], s = document.createElement('script');
                for (var j = 0; j < viejo.attributes.length; j++) s.setAttribute(viejo.attributes[j].name, viejo.attributes[j].value);
                if (viejo.src) {
                    await new Promise(function (ok) { s.onload = s.onerror = ok; viejo.parentNode.replaceChild(s, viejo); });
                } else {
                    s.textContent = viejo.textContent;
                    viejo.parentNode.replaceChild(s, viejo);
                }
            }
            // La página ya estaba cargada: el evento "load" de la app no va a llegar
            if (typeof window.arrancarApp === 'function') window.arrancarApp();
        }

        window.entradaConClave = function () { abrir(document.getElementById('entrada-clave').value, true); };

        // QR "MOVILEC-CLAVE:xxxx" (el mismo que se usa en la app): lector nativo si lo hay (Android) y si no zxing (iPhone)
        window.entradaEscanearQR = async function () {
            if (flujoQR) return;
            var video = document.getElementById('entrada-video');
            try {
                flujoQR = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            } catch (e) { estado.textContent = '⚠️ No se puede abrir la cámara: ' + (e && e.message ? e.message : e); return; }
            video.srcObject = flujoQR; video.style.display = 'block';
            try { await video.play(); } catch (e) {}
            estado.textContent = 'Apunta al QR de la clave';
            var nativo = null;
            try { if ('BarcodeDetector' in window) nativo = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}

            }
            var lienzo = document.createElement('canvas'), ctx = lienzo.getContext('2d', { willReadFrequently: true });

                var texto = null;

                        }
                    } catch (e) {}
                }
                var m = texto && texto.trim().match(/^MOVILEC-CLAVE:(.+)$/);
                if (m) { await abrir(m[1], true); return; }
                await new Promise(function (ok) { setTimeout(ok, 250); });
            }
        };

        if (!window.crypto || !crypto.subtle) { pedirClave('⚠️ Abre la app desde su dirección https'); return; }
        var guardada = '';
        try { guardada = localStorage.getItem(CLAVE_GUARDADA) || ''; } catch (e) {}
        if (guardada) abrir(guardada, false); else pedirClave('Escribe la clave o escanea su QR');

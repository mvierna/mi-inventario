<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 6px; text-align: center; 
            background-color: #f4f6f8; display: flex; flex-direction: column; 
            min-height: 100dvh; overflow-y: auto; 
        }

        /* Bloqueo Vertical (Landscape) */
        #aviso-rotacion {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; color: white; z-index: 99999;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
            font-size: 22px; font-weight: bold; padding: 20px;
        }
        .icono-giro { font-size: 60px; margin-bottom: 20px; }
        @media screen and (orientation: landscape) {
            body > *:not(#aviso-rotacion) { display: none !important; }
            #aviso-rotacion { display: flex !important; }
        }
        
        .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 16px; font-weight: 800; }
        .controles-cabecera { display: flex; gap: 6px; }
        .btn-listas { padding: 6px 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-actualizar { padding: 6px 10px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        #estado { font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 2px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        .resultado { 
            margin-top: auto; margin-bottom: 4px; padding: 10px; border: 2px solid #222222; 
            border-radius: 12px; background-color: #ffffff; display: flex; flex-direction: column; gap: 6px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: auto; 
        }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; }
        .descripcion-producto { font-size: 18px; font-weight: 800; line-height: 1.25; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 16px; font-weight: 800; color: #111111; }

        /* Estilo Stock Original (Verde) */
        .caja-stock { margin-top: 2px; padding: 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; border: none; }
        .etiqueta-stock { font-size: 12px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; color: #ffffff; }

        /* Estilos de Acción (Un solo botón naranja) */
        .panel-acciones { margin-top: 8px; }
        .btn-accion-unica { 
            width: 100%; padding: 14px; background-color: #ff9800; color: white; border: none; 
            border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 0 #e65100; transition: transform 0.1s;
        }
        .btn-accion-unica:active { transform: translateY(4px); box-shadow: none; }
        
        .panel-cantidad { display: none; flex-direction: row; gap: 8px; margin-top: 8px; }
        .input-cantidad { 
            flex: 1; padding: 12px; border: 3px solid #ff9800; border-radius: 8px; 
            font-size: 22px; text-align: center; font-weight: bold; outline: none;
        }
        .btn-confirmar { 
            padding: 12px 24px; background-color: #28a745; color: white; 
            border: none; border-radius: 8px; font-weight: 900; font-size: 18px; cursor: pointer;
        }

        .lista-resultados { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; text-align: left; border: 1px solid #dee2e6; border-radius: 6px; }
        .item-resultado { padding: 10px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 14px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 12px; color: #6c757d; font-weight: bold; }

        /* Cámara */
        #video-container { width: 100%; max-width: 320px; max-height: 250px; background: #000; margin: 4px auto; border-radius: 6px; overflow: hidden; position: relative; display: none; }
        #controles-video { padding: 6px; background: rgba(0,0,0,0.7); text-align: left; display: none; }
        #selector-camara { width: 100%; max-width: 250px; padding: 4px; border-radius: 4px; font-size: 12px; }
        video { width: 100%; height: auto; display: block; object-fit: cover; }

        /* Buscador Inferior */
        .caja-interfaz { padding: 6px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        .grupo-input-camara { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; }
        
        #inputCodigo { flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 16px; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        .btn-camara-cuadrado { flex: 0 0 100px; height: 50px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado { display: none !important; }

        /* Modal Listas */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #f4f6f8; width: 92%; max-height: 85dvh; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111; }
        .btn-cerrar-modal { background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .modal-body { overflow-y: auto; flex: 1; background: white; border-radius: 8px; border: 1px solid #dee2e6; }
        .item-lista-guardada { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #dee2e6; align-items: center; }
        .item-lista-guardada:last-child { border-bottom: none; }
        .item-lista-info { display: flex; flex-direction: column; text-align: left; flex: 1;}
        .item-desc-modal { font-size: 15px; font-weight: bold; color: #111; }
        .item-detalle-modal { font-size: 13px; color: #666; margin-top: 2px; }
        .item-cant-modal { font-size: 20px; font-weight: 900; color: #ff9800; margin-left: 10px; margin-right: 15px; }
        .btn-borrar-item { background: #dc3545; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px;}
        
        .modal-footer { margin-top: 12px; display: flex; gap: 8px; justify-content: space-between; }
        .btn-footer { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 900; font-size: 15px; color: white; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="aviso-rotacion">

                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    reproducirBeep();
                    cerrarCualquierCamara();
                    const input = document.getElementById('input-precio-accion');
                    if (input) { input.value = precio; input.style.backgroundColor = '#f3e5f5'; }
                    return;
                }
                await new Promise(r => setTimeout(r, 100));
            }
        }

        // ===== CHEQUEO RÁPIDO =====
        // Se lee el código, se hace una foto del precio (sola, cuando la imagen está quieta y se ve un precio entero) y se pasa al siguiente.
        // Las fotos se leen después con calma, en segundo plano, y en "Revisar" se comprueban mirando la foto.
        let chequeoRapido = localStorage.getItem('chequeoRapido') === '1';
        let colaChequeo = JSON.parse(localStorage.getItem('colaChequeo') || '[]');
        let fotoActivaC = 0, fotoManualPedida = false, procesandoCola = false, miniaturaToken = 0;
        const esperar = ms => new Promise(r => setTimeout(r, ms));
        function rapidoActivo() { return chequeoRapido && modoActivo === 'chequeo'; }
        function guardarCola() { localStorage.setItem('colaChequeo', JSON.stringify(colaChequeo)); }

        // El botón alterna Manual (precio a mano o leído en directo) ↔ Rápido (foto del precio y revisión después)
        function alternarChequeoRapido() {
            chequeoRapido = !chequeoRapido;
            localStorage.setItem('chequeoRapido', chequeoRapido ? '1' : '0');
            pintarTarjetaChequeo();
        }

        function pintarTarjetaChequeo() {
            resultadoDiv.style.display = 'flex'; resultadoDiv.style.borderColor = "#9c27b0";
            const texto = !chequeoRapido ? 'Escanea el producto para introducir su PVP.'
                : 'Lee el código y apunta al precio: la foto se hace sola. Los precios se revisan después.';
            const boton = !chequeoRapido ? '✋ Manual' : '📸 Rápido: 2 pasos';
            resultadoDiv.innerHTML = `<h3 style='color:#9c27b0; margin:0;'>🕵️ CHEQUEANDO: ${esc(competenciaGuardada)}</h3><p style='font-size:15px; margin-top:4px;'>${texto}</p>
                <div class="botones-rapido"><button style="background:${chequeoRapido ? '#9c27b0' : '#6c757d'};" onclick="alternarChequeoRapido()">${boton}</button><button style="background:#007bff;" onclick="abrirRevision()">🔎 Revisar (${colaChequeo.length})</button></div>`;
        }

        // Fotos en una base de datos propia (no se toca la de la app normal)
        let promesaDBFotos = null;
        function opFotos(modo, accion) {
            if (!promesaDBFotos) promesaDBFotos = new Promise((resolve, reject) => {
                const req = indexedDB.open('MovilecFotos', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('fotos');
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = () => { promesaDBFotos = null; reject(req.error); };
            });
            return promesaDBFotos.then(db => new Promise((resolve, reject) => {
                const tx = db.transaction('fotos', modo), req = accion(tx.objectStore('fotos'));
                tx.oncomplete = () => resolve(req.result);
                tx.onerror = () => reject(tx.error);
            }));
        }
        const guardarFoto = (id, blob) => opFotos('readwrite', s => s.put(blob, id));
        const leerFoto = id => opFotos('readonly', s => s.get(id));
        const borrarFoto = id => opFotos('readwrite', s => s.delete(id));
        // Borra las fotos que ya no usa ningún chequeo (ni de la cola ni de la lista)
        async function limpiarFotos() {
            try {
                const usadas = new Set(colaChequeo.map(c => c.id).concat(listaTrabajo.map(i => i.fotoId).filter(Boolean)));
                for (const id of await opFotos('readonly', s => s.getAllKeys())) if (!usadas.has(id)) await borrarFoto(id);
            } catch (e) {}
        }

        // Prepara el artículo leído; si ya está chequeado avisa y se sigue leyendo códigos
        // Si el código ya trae el precio (etiquetas de papel de Carrefour), va directo a la lista sin foto y se sigue leyendo códigos
        function prepararChequeoRapido(codigo) {
            if (guardarClaveDesdeQR(codigo)) return false;
            const conPrecio = codigoConPrecio(codigo);
            if (conPrecio) codigo = conPrecio.ean;
            const r = buscarArticuloGlobal(codigo.toUpperCase());
            const ean = r ? r.ean : codigo;
            if (listaTrabajo.some(i => i.tipo === 'competencia' && i.ean === ean) || colaChequeo.some(c => c.ean === ean)) {
                document.getElementById('estado-c').textContent = "⚠️ Ya chequeado: " + (r ? r.art.descripcion : ean);
                if (navigator.vibrate) navigator.vibrate(400);
                return false;
            }
            itemActual = { ean: ean, desc: r ? r.art.descripcion : "COMPETENCIA (Sin datos)", pvp_nuestro: r ? r.art.precio : "-", rayon: r ? r.art.rayon : "-" };
            if (conPrecio) {
                listaTrabajo.push({ tipo: 'competencia', ean: ean, descripcion: itemActual.desc, cantidad: 1, fecha: new Date().toLocaleString('es-ES').replace(', ', ' '), competencia: competenciaGuardada, pvp_competencia: conPrecio.precio, pvp_nuestro: itemActual.pvp_nuestro, opus: calcularOpus(itemActual.pvp_nuestro, conPrecio.precio), rayon: itemActual.rayon });
                localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                reproducirBeep(); setTimeout(reproducirBeep, 180);
                document.getElementById('estado-c').textContent = `✅ ${conPrecio.precio.replace('.', ',')} € (del código) a la lista. Siguiente código`;
                return false;
            }
            return true;
        }

        // Nitidez (varianza del laplaciano) y copia pequeña en gris para saber si la imagen está quieta
        const lienzoMedidaFoto = document.createElement('canvas');
        const ctxMedidaFoto = lienzoMedidaFoto.getContext('2d', { willReadFrequently: true });
        function medirFotograma(lienzo) {
            const w = 240, h = Math.max(8, Math.round(lienzo.height * w / lienzo.width));
            lienzoMedidaFoto.width = w; lienzoMedidaFoto.height = h;
            ctxMedidaFoto.drawImage(lienzo, 0, 0, w, h);
            const d = ctxMedidaFoto.getImageData(0, 0, w, h).data, gris = new Float32Array(w * h);
            for (let i = 0; i < w * h; i++) gris[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
            let s = 0, s2 = 0, n = 0;
            for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
                const i = y * w + x, l = 4 * gris[i] - gris[i - 1] - gris[i + 1] - gris[i - w] - gris[i + w];
                s += l; s2 += l * l; n++;
            }
            return { gris: gris, ancho: w, nitidez: n ? s2 / n - (s / n) * (s / n) : 0 };
        }
        // ¿Está quieta la imagen? Se busca el desplazamiento (hasta ±6 px) que mejor encaja las dos copias grises.
        // Con el pulso normal la imagen se mueve 1-3 px entre fotogramas y la foto sale nítida igual: eso cuenta como quieta
        // (compararlas píxel a píxel sin encajarlas daba "movida" siempre que había mucho texto, como una etiqueta entera).
        function imagenQuieta(a, m) {
            const b = m.gris, w = m.ancho;
            if (!a || a.length !== b.length) return false;
            const h = b.length / w, R = 6;
            let mejor = Infinity, mdx = 0, mdy = 0;
            for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
                let s = 0, n = 0;
                for (let y = R; y < h - R; y += 2) for (let x = R; x < w - R; x += 2) { s += Math.abs(a[y * w + x] - b[(y + dy) * w + x + dx]); n++; }
                if (n && s / n < mejor) { mejor = s / n; mdx = dx; mdy = dy; }
            }
            return Math.abs(mdx) <= 3 && Math.abs(mdy) <= 3 && mejor < 12;
        }

        async function bucleFotoPrecioC(miSesion) {
            const miFoto = ++fotoActivaC;
            const video = document.getElementById('video-c'), estadoC = document.getElementById('estado-c');
            document.getElementById('scanner-c').classList.add('modo-precio');
            aplicarAreaGuia();
            document.getElementById('btn-texto-c').style.display = 'none';
            document.getElementById('btn-foto-c').style.display = 'flex';
            document.getElementById('btn-cancelar-foto-c').style.display = 'block';
            document.getElementById('ocr-crudo').textContent = itemActual.desc || '';
            estadoC.textContent = "📸 Apunta al PRECIO: la foto se hace sola";
            actividadC();
            fotoManualPedida = false;
            const inicio = Date.now();
            let anterior = null, quietas = 0, mejorNitidez = 0, avisado = false;
            while (miSesion === sesionC && miFoto === fotoActivaC) {
                if (Date.now() - ultimaActividadC > PAUSA_CAMARA_MS) { pausarCamaraC(); return; }
                const lienzo = (video.readyState >= 2 && video.videoWidth > 0) ? capturarGuiaC() : null;
                if (lienzo && lienzo.width > 0 && lienzo.height > 0) {
                    const m = medirFotograma(lienzo);
                    quietas = imagenQuieta(anterior, m) ? quietas + 1 : 0;
                    anterior = m.gris;
                    // La nitidez se compara solo con la de las imágenes desde que el móvil está quieto en el mismo sitio
                    // (el código de barras de antes es mucho más "nítido" que cualquier etiqueta)
                    mejorNitidez = quietas ? Math.max(mejorNitidez, m.nitidez) : 0;
                    let lista = fotoManualPedida;
                    // Sola: imagen quieta un momento, de las más nítidas, y con un precio entero (euros grandes + céntimos) dentro del recuadro
                    if (!lista && Date.now() - inicio > 600 && quietas >= 2 && m.nitidez >= mejorNitidez * 0.8) lista = !!precioEnteroVisible(lienzo, 0.12);
                    if (lista) { await guardarFotoChequeo(lienzo, miSesion); return; }
                    if (!avisado && Date.now() - inicio > 5000) { avisado = true; estadoC.textContent = "📸 No veo bien el precio: acércate o pulsa 📸"; }
                }
                await esperar(80);
            }
        }

        // Devuelve las partes del precio si se ve uno entero (euros grandes + céntimos, sin cortar) de al menos minAlto del alto de la imagen
        function precioEnteroVisible(lienzo, minAlto) {
            const cortadoAntes = precioCortado;
            precioCortado = false;
            const partes = separarEurosYCents(lienzo, null);
            const ok = !!partes && !precioCortado && partes.euros.y1 - partes.euros.y0 >= lienzo.height * minAlto;
            precioCortado = cortadoAntes;
            return ok ? partes : null;
        }

        // "↩ Otro código": vuelve a leer códigos sin hacer la foto
        function cancelarFotoC() { if (streamC && rapidoActivo()) volverACodigoC(sesionC); }

        function volverACodigoC(miSesion) {
            fotoActivaC++;
            document.getElementById('scanner-c').classList.remove('modo-precio');
            aplicarAreaGuia();
            document.getElementById('btn-texto-c').style.display = '';
            document.getElementById('btn-foto-c').style.display = 'none';
            document.getElementById('btn-cancelar-foto-c').style.display = 'none';
            document.getElementById('ocr-crudo').textContent = '';
            bucleLecturaC(miSesion);
        }

        async function guardarFotoChequeo(lienzo, miSesion) {
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const blob = await new Promise(r => lienzo.toBlob(r, 'image/jpeg', 0.9));
            try { await guardarFoto(id, blob); }
            catch (e) { document.getElementById('estado-c').textContent = "⚠️ No se pudo guardar la foto: " + (e && e.message ? e.message : e); return; }
            colaChequeo.push({ id: id, ean: itemActual.ean, descripcion: itemActual.desc, pvp_nuestro: itemActual.pvp_nuestro, rayon: itemActual.rayon, competencia: competenciaGuardada, fecha: new Date().toLocaleString('es-ES').replace(', ', ' '), estado: 'pendiente', precio: '' });
            guardarCola();
            if (navigator.vibrate) navigator.vibrate(60);
            reproducirBeep(); setTimeout(reproducirBeep, 180);
            actividadC();
            // Miniatura un momento, para ver que la foto ha salido bien
            const mini = document.getElementById('miniatura-c'), token = ++miniaturaToken;
            if (mini.dataset.url) URL.revokeObjectURL(mini.dataset.url);
            mini.dataset.url = URL.createObjectURL(blob); mini.src = mini.dataset.url; mini.style.display = 'block';
            setTimeout(() => { if (token === miniaturaToken) mini.style.display = 'none'; }, 1500);
            procesarColaChequeo();
            if (miSesion !== sesionC) return;
            document.getElementById('estado-c').textContent = `✅ Foto guardada (${colaChequeo.length} por revisar). Siguiente código`;
            volverACodigoC(miSesion);
        }

        // Cola de OCR: lee las fotos pendientes una a una, con las 3 variantes de imagen y, si no hay acuerdo, a otro tamaño.
        // Espera mientras el Chequeo normal está leyendo un precio en directo (usan el mismo OCR).
        function ocrEnVivo() {
            const sc = document.getElementById('scanner-c');
            return sc.style.display === 'flex' && sc.classList.contains('modo-precio') && !rapidoActivo();
        }

        async function procesarColaChequeo() {
            if (procesandoCola) return;
            procesandoCola = true;
            try {
                let item;
                while ((item = colaChequeo.find(c => c.estado === 'pendiente'))) {
                    try { await leerFotoChequeo(item); }
                    catch (e) { item.estado = 'sin_leer'; item.nota = "Error: " + (e && e.message ? e.message : e); }
                    guardarCola();
                    actualizarFilaRevision(item);
                }
            } finally { procesandoCola = false; }
        }

        async function leerFotoChequeo(item) {
            const blob = await leerFoto(item.id);
            if (!blob) { item.estado = 'sin_leer'; item.nota = 'Falta la foto'; return; }
            const bmp = await createImageBitmap(blob);
            let original = document.createElement('canvas');
            original.width = bmp.width; original.height = bmp.height;
            original.getContext('2d').drawImage(bmp, 0, 0);
            const votos = {}, lecturas = [];
            let cortado = false;
            const probar = async lienzo => {
                for (const v of [0, 1, 2]) {
                    while (ocrEnVivo()) await esperar(500);
                    const r = await leerPrecioDeLienzo(lienzo, v);
                    if (r.cortado) cortado = true;
                    if (r.precio) votos[r.precio] = (votos[r.precio] || 0) + 1;
                    lecturas.push(r.precio ? r.precio.replace('.', ',') : '-');
                }
            };
            const ranking = () => Object.entries(votos).sort((a, b) => b[1] - a[1]);
            await probar(original);
            if (!ranking().length || ranking()[0][1] < 3) {
                const otra = document.createElement('canvas');
                otra.width = Math.round(original.width * 0.7); otra.height = Math.round(original.height * 0.7);
                otra.getContext('2d').drawImage(original, 0, 0, otra.width, otra.height);
                await probar(otra);
            }
            const r = ranking();
            item.lecturas = lecturas.join(' ');
            if (!r.length) { item.estado = 'sin_leer'; item.precio = ''; item.nota = cortado ? 'El precio se sale de la foto' : 'No se ha leído ningún precio'; return; }
            const [precio, n] = r[0], segundo = r[1] ? r[1][1] : 0;
            const sospecha = precioSospechoso(item.pvp_nuestro, precio);
            item.precio = precio;
            item.estado = (n >= 3 && n >= segundo * 2 && !sospecha) ? 'seguro' : 'dudoso';
            item.nota = sospecha || (item.estado === 'dudoso' ? 'Lecturas: ' + item.lecturas : '');
        }

        // Un precio "seguro" pero rarísimo frente al nuestro suele ser una mala lectura
        function precioSospechoso(pvpNuestro, precio) {
            const nuestro = parseFloat(String(pvpNuestro).replace(',', '.')), p = parseFloat(precio);
            if (!(nuestro > 0)) return '';
            if (nuestro.toFixed(2) !== precio && nuestro.toFixed(2).endsWith(precio)) return '¿Falta una cifra delante?';
            if (p > nuestro * 2.5 || p < nuestro / 2.5) return 'Muy distinto del nuestro';
            return '';
        }

        // ===== Pantalla de revisión =====
        const ESTADOS_REV = { pendiente: ['⏳ Leyendo...', '#6c757d'], seguro: ['✅ Seguro', '#28a745'], dudoso: ['⚠️ Dudoso', '#ff9800'], sin_leer: ['❓ Sin leer', '#dc3545'] };
        let urlsRevision = [];

        function abrirRevision() {
            const orden = { sin_leer: 0, dudoso: 1, pendiente: 2, seguro: 3 };
            const items = colaChequeo.slice().sort((a, b) => orden[a.estado] - orden[b.estado]);
            const cuerpo = document.getElementById('cuerpo-revision');
            cuerpo.innerHTML = items.length ? items.map(htmlFilaRevision).join('') : '<div style="text-align:center; padding:20px; color:#666;">No hay fotos por revisar</div>';
            items.forEach(item => {
                actualizarFilaRevision(item);
                leerFoto(item.id).then(blob => {
                    const img = document.getElementById('foto-rev-' + item.id);
                    if (blob && img) { const url = URL.createObjectURL(blob); urlsRevision.push(url); img.src = url; }
                }).catch(() => {});
            });
            actualizarResumenRevision();
            document.getElementById('modalRevision').style.display = 'flex';
            if (colaChequeo.some(c => c.estado === 'pendiente')) procesarColaChequeo();
        }

        function cerrarRevision() {
            document.getElementById('modalRevision').style.display = 'none';
            urlsRevision.forEach(u => URL.revokeObjectURL(u)); urlsRevision = [];
            document.getElementById('cuerpo-revision').innerHTML = '';
            if (modoActivo === 'chequeo') pintarTarjetaChequeo();
        }

        function htmlFilaRevision(item) {
            const id = esc(item.id);
            return `<div class="fila-rev" id="rev-${id}">
                <img id="foto-rev-${id}" alt="" onclick="verFoto(${jsArg(item.id)})">
                <div class="desc-rev">${esc(item.descripcion)}</div>
                <div class="datos-rev">EAN ${esc(item.ean)} · Nuestro: <b>${esc(item.pvp_nuestro)}€</b> · <span class="marca-rev" id="marca-rev-${id}"></span></div>
                <div class="datos-rev" id="nota-rev-${id}"></div>
                <div class="precio-rev">
                    <input id="precio-rev-${id}" inputmode="decimal" autocomplete="off" placeholder="PVP €" oninput="this.dataset.editado = '1'">
                    <button style="background:#28a745;" onclick="aceptarRevision(${jsArg(item.id)})">✓</button>
                    <button style="background:#dc3545;" onclick="descartarRevision(${jsArg(item.id)})">✕</button>
                </div>
            </div>`;
        }

        function actualizarFilaRevision(item) {
            const marca = document.getElementById('marca-rev-' + item.id);
            if (!marca) return;
            const [texto, color] = ESTADOS_REV[item.estado] || ['', '#555'];
            marca.textContent = texto; marca.style.color = color;
            document.getElementById('nota-rev-' + item.id).textContent = item.nota || '';
            const input = document.getElementById('precio-rev-' + item.id);
            if (!input.dataset.editado && document.activeElement !== input) input.value = item.precio ? item.precio.replace('.', ',') : '';
            actualizarResumenRevision();
        }

        function actualizarResumenRevision() {
            const cuenta = e => colaChequeo.filter(c => c.estado === e).length;
            document.getElementById('resumen-revision').innerHTML = `<span>⏳ ${cuenta('pendiente')} leyendo</span><span style="color:#dc3545;">❓ ${cuenta('sin_leer')} sin leer</span><span style="color:#ff9800;">⚠️ ${cuenta('dudoso')} dudosos</span><span style="color:#28a745;">✅ ${cuenta('seguro')} seguros</span>`;
        }

        function calcularOpus(pvpNuestroStr, precioCompStr) {
            const comp = parseFloat(precioCompStr), nuestro = parseFloat(String(pvpNuestroStr).replace(',', '.'));
            if (pvpNuestroStr === '-' || pvpNuestroStr === '' || isNaN(nuestro) || isNaN(comp) || comp <= 0) return "FALTA PVP";
            const diff = ((nuestro - comp) / comp) * 100;
            return (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        }

        function precioEscrito(id) {
            const input = document.getElementById('precio-rev-' + id);
            const v = input ? input.value.trim().replace(',', '.') : '';
            return /^\d{1,4}(\.\d{1,2})?$/.test(v) ? parseFloat(v).toFixed(2) : null;
        }

        // Pasa un chequeo revisado a la lista de trabajo (se queda con su foto, que se ve con 📷 en la lista)
        function pasarALista(item, precio) {
            listaTrabajo.push({ tipo: 'competencia', ean: item.ean, descripcion: item.descripcion, cantidad: 1, fecha: item.fecha, competencia: item.competencia, pvp_competencia: precio, pvp_nuestro: item.pvp_nuestro, opus: calcularOpus(item.pvp_nuestro, precio), rayon: item.rayon, fotoId: item.id });
            colaChequeo = colaChequeo.filter(c => c !== item);
            const fila = document.getElementById('rev-' + item.id); if (fila) fila.remove();
        }

        // 📤 Comparte (o descarga) todas las fotos para poder mejorar la lectura. El nombre lleva lo que leyó el OCR
        // y, en las que ya están en la lista, el precio bueno (el aceptado o corregido a mano)
        async function enviarFotos() {
            const limpio = v => String(v || '').replace(/[^\w.,-]/g, '');
            const fotos = colaChequeo.map(c => ({ id: c.id, nombre: `revisar_${limpio(c.ean)}_ocr-${limpio(c.precio) || 'nada'}_${c.estado}.jpg` }))
                .concat(listaTrabajo.filter(i => i.tipo === 'competencia' && i.fotoId).map(i => ({ id: i.fotoId, nombre: `bueno-${limpio(i.pvp_competencia)}_${limpio(i.ean)}.jpg` })));
            const archivos = [];
            for (const f of fotos) { try { const b = await leerFoto(f.id); if (b) archivos.push(new File([b], f.nombre, { type: 'image/jpeg' })); } catch (e) {} }
            if (!archivos.length) { alert("No hay fotos que enviar."); return; }
            try {
                if (navigator.canShare && navigator.canShare({ files: archivos })) { await navigator.share({ files: archivos, title: 'Fotos chequeo' }); return; }
            } catch (e) { if (e && e.name === 'AbortError') return; }
            // Sin "compartir": se descargan una a una
            for (const a of archivos) {
                const enlace = document.createElement('a');
                enlace.href = URL.createObjectURL(a); enlace.download = a.name;
                document.body.appendChild(enlace); enlace.click(); document.body.removeChild(enlace);
                await esperar(300);
            }
        }

        function guardarTrasRevision() {
            guardarCola();
            localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
            actualizarResumenRevision();
        }

        function aceptarRevision(id) {
            const item = colaChequeo.find(c => c.id === id); if (!item) return;
            const precio = precioEscrito(id);
            if (!precio) { alert("Escribe el precio (por ejemplo 1,95)."); return; }
            pasarALista(item, precio); guardarTrasRevision();

        function vigilarImagenNegraC(miSesion, video, soloPrecio) {
            const lienzo = document.createElement('canvas'); lienzo.width = 32; lienzo.height = 24;
            const ctx = lienzo.getContext('2d', { willReadFrequently: true });
            const inicio = Date.now();
            const mirar = async () => {
                if (miSesion !== sesionC || !streamC) return;
                let negra = true;
                if (video.videoWidth) {
                    try {
                        ctx.drawImage(video, 0, 0, 32, 24);
                        const d = ctx.getImageData(0, 0, 32, 24).data;
                        let max = 0;
                        for (let i = 0; i < d.length; i += 4) max = Math.max(max, d[i], d[i + 1], d[i + 2]);
                        negra = max < 10;
                    } catch (e) { return; }
                }
                if (!negra) { reintentoNegroC = false; return; }
                if (Date.now() - inicio < 3000) { setTimeout(mirar, 500); return; }
                const estadoC = document.getElementById('estado-c');

                    return;

        async function descargarDatosGoogle(archivo) {
            if (!claveDriveGuardada) throw new Error("Falta la clave de Drive");
            const response = await fetch(URL_GOOGLE_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "get_csv", clave: claveDriveGuardada, archivo: archivo }) });
            const result = await response.json();
            if (result.status !== "success") throw new Error(result.message || "Error del script");
            const bytes = Uint8Array.from(atob(result.gz), c => c.charCodeAt(0));
            const texto = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
            return { texto: texto, fecha: result.fecha };
        }

        function verPersonaGuardias(n) { gdPersona = gdPersona === n ? null : n; gdPintar(); }

        function gdPintarMeses() {
            document.getElementById('gd-mes').innerHTML = Object.keys(gdMeses).sort().map(k => {
                const m = gdMeses[k];
                return `<option value="${k}" ${k === gdClave ? 'selected' : ''}>${gdNombre(GD_MESES[m.mes - 1])} ${m.anio}</option>`;
            }).join('');
        }
        function gdPintar() {
            const m = gdMeses[gdClave], n = gdNumDias(m), esteMes = gdClave === gdClaveHoy(), hoy = new Date().getDate();
            let h = '';
            for (let d = 1; d <= n; d++) {
                const cerrado = !m.gente.some(p => (p.d[d - 1] || '').trim());
                h += `<button class="gd-dia${cerrado ? ' cerrado' : ''}${esteMes && d === hoy ? ' hoy' : ''}${d === gdDia ? ' sel' : ''}" onclick="elegirDiaGuardias(${d})"><span>${GD_DIAS[new Date(m.anio, m.mes - 1, d).getDay()]}</span><b>${d}</b></button>`;
            }
            const cajaDias = document.getElementById('gd-dias');
            cajaDias.innerHTML = h;
            const sel = cajaDias.querySelector('.sel');
            if (sel) cajaDias.scrollLeft = sel.offsetLeft - cajaDias.offsetLeft - cajaDias.clientWidth / 2 + sel.offsetWidth / 2;
            const fecha = new Date(m.anio, m.mes - 1, gdDia).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('gd-fecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);

            const G = [], M = [], T = [], O = [], X = [];
            const fila = (p, c, txt) => `<div class="gd-per" onclick="tocarPersonaGuardias(${jsArg(p.n)})"><span><b>${esc(gdNombre(p.n))}</b><em>${esc(p.s)}</em></span>${gdHtmlTelefono(p.n)}<span class="${gdClaseCod(c)}">${esc(txt || c)}</span></div>`;
            m.gente.forEach(p => {
                const c = (p.d[gdDia - 1] || '').trim(), r = gdTipo(c);
                if (r.guard) G.push([{ GM: 0, GT: 1 }[c.toUpperCase()] ?? 2, fila(p, c)]);
                if (r.man) M.push(fila(p, c));
                if (r.tar) T.push(fila(p, c));
                if (r.off) O.push(fila(p, c, r.off));
                if (r.otro) X.push(fila(p, c, r.otro));
            });
            // En el recuadro de guardia: primero la de mañana (GM), luego la de tarde (GT) y después mantenimiento (G)
            G.sort((a, b) => a[0] - b[0]);
            for (let i = 0; i < G.length; i++) G[i] = G[i][1];
            const bloque = (t, cls, arr) => `<div class="gd-blk ${cls}"><h3>${t} <small>${arr.length}</small></h3>${arr.length ? arr.join('') : '<div class="gd-vacio">Nadie</div>'}</div>`;
            let cuerpo = gdTablaPersona(m, n);
            if (!G.length && !M.length && !T.length && !X.length) {
                document.getElementById('gd-resumen').textContent = O.length ? O.length + ' fuera' : '';
                cuerpo += '<div class="gd-cerrado">Nadie tiene turno marcado este día: cerrado o festivo.</div>' + (O.length ? bloque('No está', 'gd-off', O) : '');
            } else {
                document.getElementById('gd-resumen').textContent = `${G.length} de guardia · ${M.length} mañana · ${T.length} tarde · ${O.length} fuera`;
                cuerpo += bloque('De guardia', 'gd-guard', G) + bloque('Mañana', 'gd-man', M) + bloque('Tarde', 'gd-tar', T) + (X.length ? bloque('Otros', 'gd-man', X) : '') + bloque('No está', 'gd-off', O);
            }
            // En modo editar: todos (también los que no tienen nada ese día) y los últimos cambios
            if (gdEditando) {
                const sinNada = m.gente.filter(p => !(p.d[gdDia - 1] || '').trim()).map(p => fila(p, '', '—'));
                if (sinNada.length) cuerpo += bloque('Sin nada este día', 'gd-off', sinNada);
                const ult = gdCambios.filter(c => c.mes === gdClave).slice(-10).reverse();
                if (ult.length) cuerpo += `<div class="gd-blk"><h3>Últimos cambios</h3>${ult.map(c => `<div class="gd-cambio">${esc(c.f)} · ${esc(c.quien)}: ${c.txt ? esc(c.txt) : `${esc(gdNombre(c.n))} día ${c.dia} ${esc(c.antes || 'vacío')} → ${esc(c.despues || 'vacío')}`}</div>`).join('')}</div>`;
            }
            const cajaCuerpo = document.getElementById('gd-cuerpo');
            cajaCuerpo.classList.toggle('gd-editando', gdEditando);
            cajaCuerpo.innerHTML = cuerpo;
            gdPintarEstado();
        }
        // Al tocar a una persona se ve su mes entero arriba (tocar otra vez lo quita)
        function gdTablaPersona(m, n) {
            const p = gdPersona && m.gente.find(x => x.n === gdPersona);
            if (!p) return '';
            let h = `<div id="gd-persona"><table><tr><th rowspan="2" onclick="verPersonaGuardias(${jsArg(p.n)})">✕ ${esc(gdNombre(p.n))}</th>`;
            for (let d = 1; d <= n; d++) h += `<th>${GD_DIAS[new Date(m.anio, m.mes - 1, d).getDay()]}${d}</th>`;
            h += '</tr><tr>';
            for (let d = 1; d <= n; d++) { const c = p.d[d - 1] || ''; h += `<td class="${d === gdDia ? 'sel' : ''}">${esc(c)}</td>`; }
            return h + '</tr></table></div>';
        }

        function gdLeerExcel(buf) {
            const wb = XLSX.read(buf, { type: 'array' });
            const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
            let anio = null, mes = null, filaDias = -1;
            for (let i = 0; i < filas.length; i++) {
                const t = filas[i].join(' ');
                const mm = t.match(/CUADRANTE\s+([A-ZÁÉÍÓÚa-záéíóú]+)\s+(\d{4})/i);
                if (mm && mes === null) { mes = GD_MESES.indexOf(mm[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')) + 1; anio = +mm[2]; }
                if (String(filas[i][1]).trim() === '1' && String(filas[i][2]).trim() === '2' && String(filas[i][3]).trim() === '3') { filaDias = i; break; }
            }
            if (!mes || filaDias < 0) throw new Error('No encuentro el título "CUADRANTE MES AÑO" o la fila de los días 1, 2, 3...');
            const n = new Date(anio, mes, 0).getDate(), gente = [];
            let seccion = '';
            for (let i = filaDias + 1; i < filas.length; i++) {
                const nombre = String(filas[i][0] || '').trim();
                if (!nombre) continue;
                if (/^DE (MAÑANA|TARDE|GUARDIA)/i.test(nombre)) break;
                const d = []; let alguno = false;
                for (let c = 1; c <= n; c++) { const v = String(filas[i][c] || '').trim().toUpperCase(); if (v) alguno = true; d.push(v); }
                if (!alguno) { seccion = nombre.toUpperCase(); continue; }
                gente.push({ s: seccion, n: nombre.toUpperCase(), d });
            }
            if (!gente.length) throw new Error('No he encontrado personas debajo de la fila de los días.');
            return { anio, mes, gente };
        }
        function cargarExcelGuardias(input) {
            const f = input.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const m = gdLeerExcel(new Uint8Array(r.result));
                    const k = m.anio + '-' + String(m.mes).padStart(2, '0');
                    try { const g = JSON.parse(localStorage.getItem('guardiasMeses') || '{}'); g[k] = m; localStorage.setItem('guardiasMeses', JSON.stringify(g)); } catch (e) {}
                    gdMeses[k] = m; gdClave = k; gdDia = k === gdClaveHoy() ? new Date().getDate() : 1; gdPersona = null;
                    gdPintarMeses(); gdPintar();
                    const nombreMes = `${GD_MESES[m.mes - 1]} ${m.anio}`;
                    if (gdClaveEditor() && confirm(`Cargado ${nombreMes}: ${m.gente.length} personas.\n\n¿Subirlo a Drive para que lo vean todos? (sustituye al que haya)`)) {
                        gdEstado('Subiendo ' + nombreMes + '...');
                        gdLlamar({ action: 'set_mes', claveEditor: gdClaveEditor(), quien: usuarioGuardado || 'sin nombre', mes: k, datos: m })
                            .then(r => { gdServidorMes(k, r.mes); gdCambios = r.cambios || gdCambios; gdPintar(); gdEstado(nombreMes + ' subido: ya lo ven todos'); })
                            .catch(e => { gdEstado('No se subió: ' + e.message); alert('No se ha subido: ' + e.message); });
                    } else {
                        alert(`Cargado ${nombreMes}: ${m.gente.length} personas (solo en este móvil).`);
                    }
                } catch (e) { alert(e.message); }
                input.value = '';
            };
            r.readAsArrayBuffer(f);
        }

        function arrancarApp() { if (!appArrancada) { appArrancada = true; cargarInventario(); } }
        window.addEventListener('load', arrancarApp);
        document.addEventListener('readystatechange', () => { if (document.readyState === 'complete') arrancarApp(); });

        // Service worker (sw.js junto a este archivo): permite abrir la app sin conexión. Solo funciona en https.
        // Precargar el motor de la Cámara C (descarga ~1 MB la primera vez) para que abra al instante
        setTimeout(() => { if (typeof ZXingWASM !== 'undefined') ZXingWASM.readBarcodes(new ImageData(8, 8), { formats: FORMATOS_C }).catch(() => {}); }, 1500);

        if ('serviceWorker' in navigator) {
            // updateViaCache 'none': el navegador siempre comprueba si hay un sw.js nuevo
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                .then(reg => reg.update())
                .catch(err => console.warn("Service worker no registrado:", err));
            // Cuando entra una versión nueva, recargar una vez para mostrarla
            const habiaControlador = !!navigator.serviceWorker.controller;
            let recargado = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (habiaControlador && !recargado) { recargado = true; location.reload(); }
            });
        }
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVILEC</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MOVILEC">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías: Parseo, Motores de Cámara (A y B), Excel y Generador de Código de Barras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; width: 100%; position: fixed; top: 0; left: 0; margin: 0; padding: 0; overflow: hidden; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 6px; text-align: center; background-color: #f4f6f8; display: flex; flex-direction: column; 
        }
        
        #aviso-rotacion {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f4f6f8; color: #111; z-index: 10000; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        #aviso-rotacion h2 { color: #dc3545; font-size: 22px; margin-bottom: 8px; }
        @media screen and (orientation: landscape) { body > *:not(#aviso-rotacion) { display: none !important; } #aviso-rotacion { display: flex; } }

        .cabecera-top { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 18px; font-weight: 900; color: #111; }
        .btn-actualizar { padding: 8px 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        #estado { flex-shrink: 0; font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 4px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        #espaciador-central { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }

        /* VISOR CÁMARA A (ZXing) */
        #video-container-zxing { width: 100%; max-width: 320px; background: #000; margin: 4px auto; border-radius: 6px; overflow: hidden; position: relative; display: none; }
        #controles-video-zxing { padding: 6px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        #selector-subcamara-zxing { width: 100%; max-width: 200px; padding: 6px; border-radius: 4px; font-size: 12px; background: white; color: black; border: 1px solid #ccc; outline: none; }
        #video-preview { width: 100%; height: auto; max-height: 200px; display: block; object-fit: cover; }

        /* VISOR CÁMARA B (html5-qrcode optimizado) */
        #scanner-container { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; background: #000; z-index: 9999;
            padding-top: max(10px, env(safe-area-inset-top)); flex-direction: column; border-bottom: 4px solid #17a2b8; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #reader { width: 100%; background: #000; }
        #reader video { object-fit: cover; }
        .btn-cerrar-camara-b { margin: 10px auto 15px auto; width: 90%; max-width: 300px; padding: 12px; background: #dc3545; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        .btn-cerrar-camara-b:active { background: #c82333; }

        /* FICHA DE CONSULTA CON CÓDIGO DE BARRAS */
        .resultado { display: none; width: 98%; margin: 0 auto; padding: 10px; border: 2px solid #222222; border-radius: 12px; background-color: #ffffff; flex-direction: column; gap: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-height: 100%; overflow-y: auto; }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; font-weight: 800; }
        
        .contenedor-barcode { background: #ffffff; padding: 4px 8px; border-radius: 6px; margin: 2px auto; display: flex; justify-content: center; width: 100%; max-width: 270px; border: 1px dashed #ccc; }
        #codigo-barras-svg { max-width: 100%; height: 50px; display: block; }

        .descripcion-producto { font-size: 17px; font-weight: 900; line-height: 1.15; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 15px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 8px 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; border: none; }
        .etiqueta-stock { font-size: 11px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; color: #ffffff; }

        .panel-cantidad { display: none; flex-direction: row; gap: 8px; margin-top: 6px; }
        .input-cantidad { flex: 1; padding: 12px; border: 3px solid #ff9800; border-radius: 8px; font-size: 20px; text-align: center; font-weight: bold; outline: none; background-color: white; color: #111; }

        .lista-resultados { list-style: none; padding: 0; margin: 0; text-align: left; border: 1px solid #dee2e6; border-radius: 6px; }
        .item-resultado { padding: 8px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 13px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 11px; color: #6c757d; font-weight: bold; }

        .caja-interfaz { flex-shrink: 0; padding: 6px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        
        .contenedor-modos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; overflow: hidden; }
        .btn-modo { padding: 12px 4px; color: white; border: none; border-radius: 6px; font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-modo:active { transform: translateY(3px); box-shadow: none !important; }
        
        #btn-modo-rapido { background-color: #6c757d; } #btn-modo-rapido.activo { background-color: #ffc107; color: #000; box-shadow: 0 3px 0 #d39e00; }
        #btn-modo-pedidos { background-color: #6c757d; } #btn-modo-pedidos.activo { background-color: #17a2b8; color: #fff; box-shadow: 0 3px 0 #117a8b; }
        #btn-modo-chequeo { background-color: #6c757d; } #btn-modo-chequeo.activo { background-color: #9c27b0; color: #fff; box-shadow: 0 3px 0 #6a1b9a; }
        #btn-modo-lista { background-color: #007bff; }

        .grupo-input-camara { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; }
        .select-selector-cam-engine { flex: 0 0 68px; height: 50px; border-radius: 6px; border: 2px solid #17a2b8; background: #fff; font-weight: 900; font-size: 12px; color: #111; outline: none; text-align: center; }
        #inputCodigo { flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 16px; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        #inputCodigo:disabled { background-color: #e9ecef; border-color: #ced4da; opacity: 0.7; }
        .btn-camara-cuadrado { flex: 0 0 78px; height: 50px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }

        #teclado-virtual { display: none; grid-template-columns: repeat(3, 1fr) 80px; gap: 6px; margin-top: 6px; background: #f8f9fa; padding: 6px; border-radius: 8px; border: 1px solid #dee2e6; }
        .tecla-v { height: 50px; font-size: 28px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #ccc; color: #111; flex-direction: column; line-height: 1; }
        .tecla-v:active { transform: translateY(2px); box-shadow: none; background: #e9ecef; }
        
        .tecla-accion { background: #dc3545; color: white; border-color: #b02a37; box-shadow: 0 2px 0 #b02a37; font-size: 16px; grid-column: 4; grid-row: 1; height: 100% !important; }
        .tecla-accion:active { background: #c82333; }
        .tecla-ok { background: #28a745; color: white; border-color: #198754; box-shadow: 0 2px 0 #198754; font-size: 40px; font-weight: 900; grid-column: 4; grid-row: 2 / span 3; height: 100% !important; }
        .tecla-ok:active { background: #218838; }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado, body.modo-teclado .contenedor-modos { display: none !important; }

        @media (max-height: 780px) {
            .tecla-v { height: 48px; font-size: 26px; } .tecla-accion { font-size: 15px; } .tecla-ok { font-size: 34px; }
            .btn-modo { padding: 10px 4px; font-size: 13px; } 
            .grupo-input-camara #inputCodigo, .grupo-input-camara .btn-camara-cuadrado, .grupo-input-camara .select-selector-cam-engine { height: 46px; }
            .resultado { padding: 8px; margin-bottom: 2px; gap: 3px; margin-top: auto; } .descripcion-producto { font-size: 16px; }
            .numero-stock { font-size: 38px; } .panel-secundario { padding: 4px; margin: 2px 0; }
            #codigo-barras-svg { height: 44px; }
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #f4f6f8; width: 92%; max-height: 85dvh; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111; }
        .btn-cerrar-modal { background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .input-email-config { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 6px; margin-bottom: 8px; font-size: 16px; font-weight: bold; outline: none; text-align: center; }
        .input-competencia { border-color: #9c27b0; color: #9c27b0; margin-bottom: 8px; }
        
        .modal-body { overflow-y: auto; flex: 1; background: white; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 10px; }
        .item-lista-guardada { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #dee2e6; align-items: center; }
        .item-lista-guardada:last-child { border-bottom: none; }
        .item-lista-info { display: flex; flex-direction: column; text-align: left; flex: 1;}
        .item-desc-modal { font-size: 15px; font-weight: bold; color: #111; }
        .item-detalle-modal { font-size: 13px; color: #666; margin-top: 2px; }
        
        .etiqueta-tipo-lista { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; color: white; margin-bottom: 4px; display: inline-block; text-transform: uppercase; }
        .bg-inventario { background-color: #6c757d; } .bg-competencia { background-color: #9c27b0; } .bg-pedido { background-color: #17a2b8; }

        .item-cant-modal { font-size: 20px; font-weight: 900; color: #111; margin-right: 8px; }
        .btn-editar-item { background: #ffc107; color: #000; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-right: 4px; }
        .btn-borrar-item { background: #dc3545; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer;}
        
        .modal-footer { display: flex; gap: 6px; justify-content: space-between; }
        .btn-footer { flex: 1; padding: 14px 6px; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; color: white; cursor: pointer; text-transform: uppercase; }
        .btn-sync-drive { background: #007bff; transition: background 0.3s; }
        .btn-sync-drive.loading { background: #6c757d; pointer-events: none; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="aviso-rotacion">
        <h2>⚠️ Gira el dispositivo</h2>
        <p>El escáner de códigos y la interfaz funcionan correctamente en modo vertical.</p>
    </div>

    <!-- CÁMARA B: Contenedor Html5Qrcode exacto de beta -->
    <div id="scanner-container">
        <div id="reader"></div>
        <button class="btn-cerrar-camara-b" onclick="cerrarCualquierCamara()">✕ Cerrar Cámara</button>
    </div>

    <div class="cabecera-top">
        <h1>MOVILEC</h1>
        <div style="display: flex; gap: 4px;">
            <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sync</button>
        </div>
    </div>

    <div id="estado">Iniciando BBDD Local...</div>

    <div id="espaciador-central">
        <!-- CÁMARA A: Contenedor ZXing exacto de index -->
        <div id="video-container-zxing">
            <div id="controles-video-zxing">
                <select id="selector-subcamara-zxing" onchange="cambiarSubCamaraZXing()">
                    <option value="">Detectando...</option>
                </select>
                <button onclick="cerrarCualquierCamara()" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✕</button>
            </div>
            <video id="video-preview" playsinline autoplay muted></video>
        </div>

        <div id="resultado" class="resultado"></div>
    </div>

    <div class="caja-interfaz">
        <div class="contenedor-modos">
            <button id="btn-modo-rapido" class="btn-modo" onclick="activarModo('rapido')">⚡ MODO 1</button>
            <button id="btn-modo-pedidos" class="btn-modo" onclick="activarModo('pedidos')">🛒 PEDIDOS</button>
            <button id="btn-modo-chequeo" class="btn-modo" onclick="activarModo('chequeo')">🕵️ CHEQUEO</button>
            <button id="btn-modo-lista" class="btn-modo" onclick="verListas()">📋 LISTA</button>
        </div>
        
        <div class="grupo-input-camara">
            <select id="selector-motor-camara" class="select-selector-cam-engine" onchange="seleccionarMotorCamara(this.value)">
                <option value="A">CÁM A</option>
                <option value="B">CÁM B</option>
            </select>
            <input type="text" id="inputCodigo" placeholder="Escribe, escanea o EAN..." autocomplete="off">
            <button class="btn-camara-cuadrado" onclick="abrirCamaraSegunPreferencia()">📷 VER</button>
        </div>
        
        <div id="teclado-virtual">
            <button class="tecla-v" onclick="pulsarTecla('7')">7</button>
            <button class="tecla-v" onclick="pulsarTecla('8')">8</button>
            <button class="tecla-v" onclick="pulsarTecla('9')">9</button>
            <button class="tecla-v tecla-accion" onclick="pulsarTecla('DEL')">⌫<br>DEL</button>
            
            <button class="tecla-v" onclick="pulsarTecla('4')">4</button>
            <button class="tecla-v" onclick="pulsarTecla('5')">5</button>
            <button class="tecla-v" onclick="pulsarTecla('6')">6</button>

            <button class="tecla-v" onclick="pulsarTecla('1')">1</button>
            <button class="tecla-v" onclick="pulsarTecla('2')">2</button>
            <button class="tecla-v" onclick="pulsarTecla('3')">3</button>

            <button class="tecla-v" style="grid-column: 1 / span 2;" onclick="pulsarTecla('0')">0</button>
            <button class="tecla-v" onclick="pulsarTecla('.')">.</button>
            
            <button id="btn-teclado-ok" class="tecla-v tecla-ok" onclick="pulsarTecla('ENTER')">↵</button>
        </div>
    </div>

    <div id="modalListas" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajustes y Lista</h2>
                <button class="btn-cerrar-modal" onclick="cerrarModalListas()">✕</button>
            </div>
            
            <input type="text" id="nombre-usuario-input" class="input-email-config" placeholder="👤 Tu nombre o Nº Terminal..." onchange="guardarConfiguracion()">
            <input type="text" id="nombre-competencia-input" class="input-email-config input-competencia" placeholder="🏪 Nombre Competencia (Ej: Mercadona)..." onchange="guardarConfiguracion()">
            <input type="email" id="email-destino-input" class="input-email-config" style="border-color: #28a745;" placeholder="📧 Email Destino (Ej: jefe@tienda.com)..." onchange="guardarConfiguracion()">
            
            <div id="modal-body-listas" class="modal-body"></div>
            
            <div class="modal-footer">
                <button class="btn-footer" style="background: #dc3545; flex: 0.3;" onclick="borrarListaActual()">🗑</button>
                <button id="btn-drive" class="btn-footer btn-sync-drive" onclick="enviarADrive()">☁️ Guardar en Drive</button>
                <button class="btn-footer" style="background: #28a745; flex: 0.8;" onclick="exportarListaExcel()">📥 EXCEL Y CORREO</button>
            </div>
        </div>
    </div>

    <script>
        const URL_GOOGLE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxwJsbKTzkblne6DLMDirHYNTQU8kQUcQ-29Kd79_pdT78tXZUWk5wqDH44d6HIX6qV/exec";

        let dbLocal;
        function initDB() {
            return new Promise((resolve) => {
                let req = indexedDB.open("HiperDB_Files", 1);
                req.onupgradeneeded = e => {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains("archivos")) db.createObjectStore("archivos", { keyPath: "id" });
                };
                req.onsuccess = e => { dbLocal = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        }
        
        async function guardarArchivoLocal(id, data) {
            if (!dbLocal) return;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readwrite");
                tx.objectStore("archivos").put({ id: id, data: data });
                tx.oncomplete = resolve;
            });
        }
        
        async function leerArchivoLocal(id) {
            if (!dbLocal) return null;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readonly");
                let req = tx.objectStore("archivos").get(id);
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        }

        let audioCtx = null;
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
        function reproducirBeep() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.15); 
            } catch(e) { console.log("Audio no soportado"); }
        }

        let inventario = {}; 
        let inventarioSinStock = {}; 
        let ultimoModo = 'teclado'; 
        let modoActivo = 'normal';
        let listaTrabajo = JSON.parse(localStorage.getItem('inventarioListaTrabajo')) || [];
        let usuarioGuardado = localStorage.getItem('inventarioUsuario') || '';
        let competenciaGuardada = localStorage.getItem('inventarioCompetencia') || '';
        let emailGuardado = localStorage.getItem('inventarioEmail') || '';
        
        // CÁMARA A (ZXing) / CÁMARA B (Html5Qrcode)
        let motorCamaraPreferido = localStorage.getItem('movilec_camara_tipo') || 'B';
        let codeReader = null; 
        let html5QrcodeScanner = null;
        let camaraManualIdZXing = localStorage.getItem('camaraPreferidaZXing') || null; 

        let inputActivoId = 'inputCodigo';
        let itemActual = { ean: null, desc: null, rayon: null, stock: null, pvp_nuestro: null };

        const inputCodigo = document.getElementById('inputCodigo'); 
        const resultadoDiv = document.getElementById('resultado'); 
        const estadoDiv = document.getElementById('estado'); 
        const tecladoVirtual = document.getElementById('teclado-virtual');

        document.getElementById('nombre-usuario-input').value = usuarioGuardado; 
        document.getElementById('nombre-competencia-input').value = competenciaGuardada; 
        document.getElementById('email-destino-input').value = emailGuardado;
        document.getElementById('selector-motor-camara').value = motorCamaraPreferido;

        function guardarConfiguracion() {
            usuarioGuardado = document.getElementById('nombre-usuario-input').value.trim(); 
            competenciaGuardada = document.getElementById('nombre-competencia-input').value.trim(); 
            emailGuardado = document.getElementById('email-destino-input').value.trim();
            localStorage.setItem('inventarioUsuario', usuarioGuardado); 
            localStorage.setItem('inventarioCompetencia', competenciaGuardada); 
            localStorage.setItem('inventarioEmail', emailGuardado);
        }

        document.getElementById('espaciador-central').addEventListener('click', function(e) {
            if (tecladoVirtual.style.display === 'grid') {
                tecladoVirtual.style.display = 'none';
                document.body.classList.remove('modo-teclado');
                inputActivoId = 'inputCodigo';

        function buscarArticuloGlobal(termino) {
            let termLimpio = termino.replace(/^0+/, ''); let ean12 = termLimpio.padStart(12, '0');
            if (inventario.hasOwnProperty(termino)) return { ean: termino, art: inventario[termino], esSinStock: false };
            if (inventario.hasOwnProperty(termLimpio)) return { ean: termLimpio, art: inventario[termLimpio], esSinStock: false };
            if (inventario.hasOwnProperty(ean12)) return { ean: ean12, art: inventario[ean12], esSinStock: false };
            if (inventarioSinStock.hasOwnProperty(termino)) return { ean: termino, art: inventarioSinStock[termino], esSinStock: true };
            if (inventarioSinStock.hasOwnProperty(termLimpio)) return { ean: termLimpio, art: inventarioSinStock[termLimpio], esSinStock: true };
            if (inventarioSinStock.hasOwnProperty(ean12)) return { ean: ean12, art: inventarioSinStock[ean12], esSinStock: true };
            return null;
        }

            if (precioCompStr !== "") {

        async function enviarADrive() {
            if (listaTrabajo.length === 0) { alert("La lista está vacía."); return; }
            const btnDrive = document.getElementById('btn-drive');
            btnDrive.classList.add('loading'); btnDrive.innerText = "⏳ Guardando...";
            const datosAEnviar = listaTrabajo.map(item => { return { tipo: item.tipo || 'inventario', ean: item.ean, cantidad: item.cantidad, stock: item.stock || "", descripcion: item.descripcion, fecha: item.fecha, usuario: usuarioGuardado, competencia: item.competencia || "", pvp_competencia: item.pvp_competencia || "", pvp_nuestro: item.pvp_nuestro || "", opus: item.opus || "", rayon: item.rayon || "" }; });
            try {
                const payload = { action: "sync", data: datosAEnviar };
                const response = await fetch(URL_GOOGLE_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "success") { alert("¡Guardado en Google Drive correctamente!"); if(confirm("¿Quieres vaciar la lista de trabajo?")) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } } 
                else alert("Error Drive: " + result.message);
            } catch (error) { alert("Error conexión: " + error); } 
            finally { btnDrive.classList.remove('loading'); btnDrive.innerText = "☁️ Guardar en Drive"; }
        }

        function procesarBusqueda(terminoBusqueda, fromCam = false) {
            if (fromCam) ultimoModo = 'camara';
            if (inputActivoId !== 'inputCodigo') { inputCodigo.value = ""; return; }
            let termino = terminoBusqueda.trim().toUpperCase(); inputCodigo.value = ""; if (!termino) return;
            if (modoActivo === 'rapido') { procesarEscaneoRapido(termino); return; }
            if (modoActivo === 'chequeo') { procesarEscaneoChequeo(termino); return; }
            if (modoActivo === 'pedidos') { procesarEscaneoPedido(termino); return; }

            let result = buscarArticuloGlobal(termino);
            if (result) { mostrarArticuloCompleto(result.ean, result.esSinStock); } 
            else {
                let palabras = termino.split(" ").filter(t => t.length > 0); let coincidencias = [];
                for (const [ean, articulo] of Object.entries(inventario)) { if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) { coincidencias.push({ ean: ean, articulo: articulo, esSinStock: false }); } }
                if (coincidencias.length < 50) { for (const [ean, articulo] of Object.entries(inventarioSinStock)) { if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) { coincidencias.push({ ean: ean, articulo: articulo, esSinStock: true }); if (coincidencias.length >= 50) break; } } }
                if (coincidencias.length === 0) { mostrarArticuloDesconocido(termino); } 
                else if (coincidencias.length === 1) { mostrarArticuloCompleto(coincidencias[0].ean, coincidencias[0].esSinStock); } 
                else {
                    let htmlLista = `<h3 style="margin: 0 0 8px 0; font-size: 14px; color: #007bff;">${coincidencias.length} encontrados:</h3><ul class="lista-resultados">`;
                    coincidencias.slice(0, 50).forEach(c => { let etiquetaExtra = c.esSinStock ? `<span style="color:#ff9800; font-size:10px; font-weight:bold;">(SIN STOCK)</span>` : ""; htmlLista += `<li class="item-resultado" onclick="mostrarArticuloCompleto('${c.ean}', ${c.esSinStock})"><span class="item-desc">${c.articulo.descripcion}</span><span class="item-ean">EAN: ${c.ean} ${etiquetaExtra}</span></li>`; });
                    if (coincidencias.length >= 50) { htmlLista += `<li class="item-resultado" style="text-align:center; color:#666; font-size:12px;">...limitado a 50. Añade más palabras para filtrar.</li>`; }
                    htmlLista += `</ul>`; resultadoDiv.style.display = 'flex'; resultadoDiv.style.borderColor = "#007bff"; resultadoDiv.innerHTML = htmlLista;
                }
            }
            setTimeout(() => inputCodigo.blur(), 100);
        }

        // GENERACIÓN GRÁFICA DEL CÓDIGO DE BARRAS EN PANTALLA
        function dibujarCodigoBarras(codigo) {
            if (!codigo || codigo === "-") return;
            try {
                let formato = (/^\d{13}$/.test(codigo)) ? "EAN13" : "CODE128";
                JsBarcode("#codigo-barras-svg", codigo, {
                    format: formato,
                    lineColor: "#000000",
                    width: 2,
                    height: 50,
                    displayValue: false,
                    margin: 0
                });
            } catch (e) {
                try {
                    JsBarcode("#codigo-barras-svg", codigo, {
                        format: "CODE128",
                        width: 2,
                        height: 50,
                        displayValue: false,
                        margin: 0
                    });
                } catch (err) {
                    console.warn("No fue posible generar el código de barras gráfico:", err);
                }
            }
        }

        // FICHA DE CONSULTA PURA (CON BARRAS VISUALES)

        function mostrarArticuloDesconocido(termino) {
            resultadoDiv.style.display = 'flex';

            resultadoDiv.innerHTML = `
                <h3 style="color: #dc3545; margin: 0 0 4px 0; font-size: 18px;">No encontrado en BD</h3>

        function pulsarTecla(valor) {
            const inputDestino = document.getElementById(inputActivoId);
            if (!inputDestino) return;
            
            if (valor === 'DEL') { inputDestino.value = inputDestino.value.slice(0, -1);
            } else if (valor === 'ENTER') {
                if (inputActivoId === 'inputCodigo') { ultimoModo = 'teclado'; procesarBusqueda(inputDestino.value.trim()); tecladoVirtual.style.display = 'none'; document.body.classList.remove('modo-teclado'); } 
                else if (inputActivoId === 'input-precio-accion') guardarPrecioCompetencia();
                else if (inputActivoId === 'input-pedido-accion') guardarCantidadPedido();

        // SELECTOR DE MOTOR: CÁMARA A vs B
        function seleccionarMotorCamara(nuevoMotor) {

        function abrirCamaraSegunPreferencia() {
            ultimoModo = 'camara';

                iniciarCamaraA();

        // MOTOR A (ZXing)
        async function iniciarCamaraA() {
            cerrarCualquierCamara();
            const container = document.getElementById('video-container-zxing');
            container.style.display = 'block';
            tecladoVirtual.style.display = 'none';
            if (!codeReader) { codeReader = new ZXing.BrowserBarcodeReader(new Map().set(ZXing.DecodeHintType.TRY_HARDER, true)); }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const devices = await codeReader.listVideoInputDevices();
                const select = document.getElementById('selector-subcamara-zxing');
                select.innerHTML = '';
                let idCamaraTrasera = null;
                devices.forEach((device, idx) => {
                    const opt = document.createElement('option'); opt.value = device.deviceId; opt.text = device.label || 'Cámara ' + (idx + 1); select.appendChild(opt);
                    const label = device.label.toLowerCase(); if (label.includes('back') || label.includes('trasera') || label.includes('environment')) { idCamaraTrasera = device.deviceId; }
                });
                stream.getTracks().forEach(track => track.stop());
                let selected = camaraManualIdZXing || idCamaraTrasera || (devices.length > 0 ? devices[0].deviceId : null);
                if (selected) {
                    select.value = selected;
                    codeReader.decodeFromVideoDevice(selected, 'video-preview', (result) => {
                        if (result) {
                            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                            reproducirBeep();
                            cerrarCualquierCamara();
                            procesarBusqueda(result.text.trim(), true);
                        }
                    });
                }
            } catch (err) { alert("Error Cámara A: " + err.message); container.style.display = 'none'; }
        }

        function cambiarSubCamaraZXing() {
            camaraManualIdZXing = document.getElementById('selector-subcamara-zxing').value;
            localStorage.setItem('camaraPreferidaZXing', camaraManualIdZXing);
            cerrarCualquierCamara();
            setTimeout(iniciarCamaraA, 300);
        }

        // MOTOR B (Html5Qrcode exacto de beta)
        function iniciarCamaraB() {
            cerrarCualquierCamara();
            const container = document.getElementById('scanner-container');
            container.style.display = 'flex';
            document.getElementById('resultado').style.display = 'none';
            if (tecladoVirtual.style.display === 'grid') { 
                tecladoVirtual.style.display = 'none'; 
                document.body.classList.remove('modo-teclado'); 
                inputCodigo.readOnly = false;
            }

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.333334, showTorchButtonIfSupported: true },
                    false
                );
                
                html5QrcodeScanner.render((decodedText) => {
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    reproducirBeep();
                    cerrarCualquierCamara();
                    procesarBusqueda(decodedText.trim(), true); 
                }, (errorMessage) => {});
            }
        }

        function cerrarCualquierCamara() {
            if (codeReader) {
                try { codeReader.reset(); } catch(e){}
            }
            document.getElementById('video-container-zxing').style.display = 'none';

            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    html5QrcodeScanner = null;
                    document.getElementById('scanner-container').style.display = 'none';
                }).catch(() => {
                    html5QrcodeScanner = null;
                    document.getElementById('scanner-container').style.display = 'none';
                });
            } else {
                document.getElementById('scanner-container').style.display = 'none';
            }
        }

        function parsearCSV(texto, options) { return new Promise(resolve => { Papa.parse(texto, { ...options, complete: resolve }); }); }

        async function cargarInventario() {
            estadoDiv.innerHTML = "Iniciando BBDD Local..."; estadoDiv.style.color = "blue"; await initDB(); let contadorTienda = 0; let fechaFmt = "-";
            try {
                estadoDiv.innerHTML = "Sincronizando Tienda (1/2)..."; let urlTienda = 'TIENDA.csv?' + new Date().getTime(); let response = await fetch(urlTienda);
                if (!response.ok) { urlTienda = 'tienda.csv?' + new Date().getTime(); response = await fetch(urlTienda); }
                if (response.ok) {
                    const lastModifiedHeader = response.headers.get('Last-Modified'); const d = lastModifiedHeader ? new Date(lastModifiedHeader) : new Date();
                    fechaFmt = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    let textoTienda = await response.text(); let results = await parsearCSV(textoTienda, { header: false, delimiter: ";", skipEmptyLines: true }); inventario = {};
                    results.data.forEach(fila => {
                        if(fila.length >= 7) { let ean = fila[0] ? fila[0].trim() : ""; let desc = fila[1] ? fila[1].trim() : ""; let stock = fila[2] ? fila[2].trim() : "0"; let rayon = fila[3] ? fila[3].trim() : "-"; let precio = fila[4] ? fila[4].trim() : "-"; let fecha = fila[5] ? fila[5].trim() : "-"; let ventas = (fila.length > 6 && fila[6]) ? fila[6].trim() : "0"; if(ean) { inventario[ean] = { descripcion: desc, stock, precio, rayon, fecha, ventas }; contadorTienda++; } }
                    });
                }
            } catch (error) { console.error("Error cargando TIENDA.csv:", error); }

            try {
                estadoDiv.innerHTML = "Sincronizando Sin Stock (2/2)..."; let urlMaestro = 'SIN_STOCK_FILTRADO.csv?' + new Date().getTime(); let responseM = await fetch(urlMaestro);
                if (responseM.ok) { let textoMaestro = await responseM.text(); await guardarArchivoLocal('sin_stock_csv', textoMaestro); await procesarTextoSinStock(textoMaestro); } else { throw new Error("No red"); }
            } catch (e) { let textoLocal = await leerArchivoLocal('sin_stock_csv'); if (textoLocal) { await procesarTextoSinStock(textoLocal); } }
            
            estadoDiv.innerHTML = `Stock: ${contadorTienda} | Sin Stock: ${Object.keys(inventarioSinStock).length} <span class="texto-fecha">Últ. Sinc: ${fechaFmt}</span>`; estadoDiv.style.color = "#28a745";
        }

        async function procesarTextoSinStock(texto) {
            let results = await parsearCSV(texto, { header: true, delimiter: ";", skipEmptyLines: true }); inventarioSinStock = {};
            results.data.forEach(fila => { let ean = fila['EAN'] ? fila['EAN'].trim() : ""; if (ean) { inventarioSinStock[ean] = { descripcion: fila['DESCRIPCION'] || "", precio: fila['PVC'] || "-", fecha: fila['FECHA'] || "-", stock: fila['STOCK'] || "0", rayon: fila['RAYON'] || "-", ventas: fila['VENTAS'] || "0" }; } });
        }

        function verListas() { document.getElementById('modalListas').style.display = 'flex'; renderizarLista(); }
        function cerrarModalListas() { document.getElementById('modalListas').style.display = 'none'; if (ultimoModo === 'teclado') inputCodigo.focus(); }

function renderizarLista() {
    const contenedor = document.getElementById('modal-body-listas');
    if (listaTrabajo.length === 0) { 
        contenedor.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Lista vacía</div>'; 
        return; 
    }

    let html = '';
    const listaInvertida = [...listaTrabajo].reverse();

    listaInvertida.forEach((item, idx) => {
        let badge = ""; 
        let detalleEx = "";
        let barcodeContenedor = "";

        if (item.tipo === 'competencia') { 
            badge = `<span class="etiqueta-tipo-lista bg-competencia">Chequeo</span>`; 
            detalleEx = `<br><span style="color:#9c27b0; font-weight:bold;">${item.competencia}: ${item.pvp_competencia}€ (Dif: ${item.opus})</span>`; 
        } else if (item.tipo === 'pedido') { 
            badge = `<span class="etiqueta-tipo-lista bg-pedido">Pedido</span>`; 
            detalleEx = `<br><span style="color:#17a2b8; font-weight:bold;">Stock actual: ${item.stock}</span>`; 
            
            // Contenedor visual del código de barras
            barcodeContenedor = `
                <div style="background: #ffffff; padding: 4px; border: 1px dashed #ccc; border-radius: 6px; margin-top: 6px; width: fit-content;">
                    <svg id="barcode-pedido-${idx}" style="display: block; max-width: 100%; height: 38px;"></svg>
                </div>
            `;
        } else { 
            badge = `<span class="etiqueta-tipo-lista bg-inventario">Inventario</span>`; 
        }

        html += `
            <div class="item-lista-guardada">
                <div class="item-lista-info">
                    ${badge}
                    <span class="item-desc-modal">${item.descripcion}</span>
                    <span class="item-detalle-modal">EAN: ${item.ean}${detalleEx}</span>
                    ${barcodeContenedor}
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="item-cant-modal">x${item.cantidad}</span>
                    <button class="btn-editar-item" onclick="editarItemLista(${listaTrabajo.length - 1 - idx})">✏️</button>
                    <button class="btn-borrar-item" onclick="eliminarItemLista(${listaTrabajo.length - 1 - idx})">✕</button>
                </div>
            </div>
        `;
    });

    contenedor.innerHTML = html;

    // Dibujado vectorial inmediato de las barras para cada pedido
    listaInvertida.forEach((item, idx) => {
        if (item.tipo === 'pedido' && item.ean && item.ean !== "-") {
            try {
                const formato = (/^\d{13}$/.test(item.ean)) ? "EAN13" : "CODE128";
                JsBarcode(`#barcode-pedido-${idx}`, item.ean, {
                    format: formato,
                    lineColor: "#000000",
                    width: 1.5,
                    height: 38,
                    displayValue: false,
                    margin: 0
                });
            } catch (e) {
                try {
                    JsBarcode(`#barcode-pedido-${idx}`, item.ean, {
                        format: "CODE128",
                        width: 1.5,
                        height: 38,
                        displayValue: false,
                        margin: 0
                    });
                } catch (err) {
                    console.warn(`No se pudo generar código para: ${item.ean}`, err);
                }
            }
        }
    });
}

        function editarItemLista(index) {
            let item = listaTrabajo[index];
            if (item.tipo === 'competencia') {
                let nuevo = prompt(`Editar precio de la competencia para:\n${item.descripcion}`, item.pvp_competencia);
                if (nuevo !== null && nuevo.trim() !== "") {
                    let precioCompStr = nuevo.trim().replace(/,/g, '.'); item.pvp_competencia = precioCompStr; let opusFinal = "FALTA PVP"; let pvpCompNum = parseFloat(precioCompStr); let pvpNuestroStr = item.pvp_nuestro;
                    if (pvpNuestroStr !== "-" && pvpNuestroStr !== "") { let pvpNuesNum = parseFloat(pvpNuestroStr.replace(',', '.')); if (!isNaN(pvpNuesNum) && !isNaN(pvpCompNum) && pvpCompNum > 0) { let diff = ((pvpNuesNum - pvpCompNum) / pvpCompNum) * 100; opusFinal = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%"; } }
                    item.opus = opusFinal; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista();
                }
            } else {
                let nuevo = prompt(`Editar cantidad para:\n${item.descripcion}`, item.cantidad);
                if (nuevo !== null && nuevo.trim() !== "") { let cantNum = parseFloat(nuevo.trim().replace(',', '.')); if (!isNaN(cantNum) && cantNum > 0) { item.cantidad = cantNum; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } }
            }
        }

        function eliminarItemLista(index) { listaTrabajo.splice(index, 1); localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); }
        function borrarListaActual() { if(confirm('¿VACIAR toda la lista?')) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } }
        
        async function exportarListaExcel() {
            if(listaTrabajo.length === 0) return;
            let listaInvertida = [...listaTrabajo].reverse(); let dataInventario = []; let dataCompetencia = []; let dataPedidos = [];

            listaInvertida.forEach(item => {
                let descLimpia = item.descripcion || ""; let eanLimpio = item.ean ? String(item.ean) : ""; 
                if (item.tipo === 'competencia') { dataCompetencia.push({"RAYON": item.rayon || "", "EAN": eanLimpio, "PVP COMPETENCIA": item.pvp_competencia || "", "PVP LECLERC": item.pvp_nuestro || "", "OPUS": item.opus || "", "DESCRIPCION": descLimpia, "COMPETENCIA": item.competencia || "", "USUARIO / TERMINAL": usuarioGuardado }); } 
                else if (item.tipo === 'pedido') { dataPedidos.push({"RAYON": item.rayon || "", "EAN": eanLimpio, "CANTIDAD": item.cantidad || "", "STOCK": item.stock || "", "DESCRIPCION": descLimpia, "FECHA": item.fecha || "", "USUARIO / TERMINAL": usuarioGuardado }); } 
                else { dataInventario.push({"EAN": eanLimpio, "CANTIDAD": item.cantidad || "", "DESCRIPCION": descLimpia, "FECHA": item.fecha || "", "USUARIO / TERMINAL": usuarioGuardado }); }
            });

            if(dataInventario.length === 0) dataInventario.push({"EAN":"-", "CANTIDAD":"-", "DESCRIPCION":"Sin datos", "FECHA":"-", "USUARIO / TERMINAL":"-"});
            if(dataCompetencia.length === 0) dataCompetencia.push({"RAYON":"-", "EAN":"-", "PVP COMPETENCIA":"-", "PVP LECLERC":"-", "OPUS":"-", "DESCRIPCION":"Sin datos", "COMPETENCIA":"-", "USUARIO / TERMINAL":"-"});
            if(dataPedidos.length === 0) dataPedidos.push({"RAYON":"-", "EAN":"-", "STOCK":"-", "CANTIDAD":"-", "DESCRIPCION":"Sin datos", "FECHA":"-", "USUARIO / TERMINAL":"-"});

            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataInventario), "LISTADO");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataCompetencia), "SEGUIMIENTO PRECIOS");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataPedidos), "PEDIDOS");

            let emailDestino = document.getElementById('email-destino-input').value.trim();
            if (emailDestino !== "") {
                if (confirm(`¿Quieres enviar también una copia de este Excel por correo a ${emailDestino}?`)) {
                    const btnExcel = document.querySelector('.btn-footer[onclick="exportarListaExcel()"]');
                    let textoOriginal = btnExcel.innerText;
                    btnExcel.innerText = "⏳ ENVIANDO..."; btnExcel.style.opacity = "0.7";
                    
                    try {
                        var wboutBase64 = XLSX.write(wb, {bookType:'xlsx', type:'base64'});
                        const payload = { action: "send_excel", email: emailDestino, excelBase64: wboutBase64 };
                        const response = await fetch(URL_GOOGLE_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                        const result = await response.json();
                        if (result.status === "success") alert("Excel enviado por correo con éxito.");
                        else alert("Error al enviar el correo: " + result.message);
                    } catch (e) { alert("Error de conexión al enviar correo: " + e); } 
                    finally { btnExcel.innerText = textoOriginal; btnExcel.style.opacity = "1"; }
                }
            }

            var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
            var blob = new Blob([wbout], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
            var file = new File([blob], 'Trabajo.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ title: 'Exportación de Inventario', files: [file] }); return; } catch (err) { console.log('Compartir cancelado o no disponible.', err); }
            }
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.setAttribute("download", `Trabajo.xlsx`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.onload = () => cargarInventario();
    </script>

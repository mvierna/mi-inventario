<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOVILEC</title>

    <link rel="manifest" href="manifest-android.json">
    <meta name="theme-color" content="#28a745">
    <link rel="icon" href="icono.png">

    <!-- Librerías: Parseo, Motores de Cámara (A y B), Excel y Código de Barras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Motor Cámara C: zxing-cpp (WebAssembly), el que mejor lee EAN en iPhone -->
    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; width: 100%; position: fixed; top: 0; left: 0; margin: 0; padding: 0; overflow: hidden; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 6px; text-align: center; background-color: #f4f6f8; display: flex; flex-direction: column; 
        }
        
        #aviso-rotacion {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f4f6f8; color: #111; z-index: 10000; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        #aviso-rotacion h2 { color: #dc3545; font-size: 22px; margin-bottom: 8px; }
        @media screen and (orientation: landscape) { body > *:not(#aviso-rotacion) { display: none !important; } #aviso-rotacion { display: flex; } }

        .cabecera-top { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 18px; font-weight: 900; color: #111; }
        .btn-actualizar { padding: 8px 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        #estado { flex-shrink: 0; font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 4px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        #espaciador-central { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }

        /* CÁMARA A (ZXing) */
        #video-container-zxing { width: 100%; max-width: 320px; background: #000; margin: 4px auto; border-radius: 6px; overflow: hidden; position: relative; display: none; }
        #controles-video-zxing { padding: 6px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        #selector-subcamara-zxing { width: 100%; max-width: 200px; padding: 6px; border-radius: 4px; font-size: 12px; background: white; color: black; border: 1px solid #ccc; outline: none; }
        #video-preview { width: 100%; height: auto; max-height: 200px; display: block; object-fit: cover; }

        /* CÁMARA B (Html5Qrcode) */
        #scanner-container { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; background: #000; z-index: 9999;
            padding-top: max(10px, env(safe-area-inset-top)); flex-direction: column; border-bottom: 4px solid #17a2b8; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #reader { width: 100%; background: #000; }
        #reader video { object-fit: cover; }
        .btn-cerrar-camara-b { margin: 10px auto 15px auto; width: 90%; max-width: 300px; padding: 12px; background: #dc3545; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        .btn-cerrar-camara-b:active { background: #c82333; }
        .fila-botones-camara-b { display: flex; gap: 8px; justify-content: center; width: 90%; max-width: 360px; margin: 0 auto; }
        .fila-botones-camara-b .btn-cerrar-camara-b { flex: 1; width: auto; margin: 10px 0 15px 0; }
        .btn-deshacer { background: #ffc107; color: #000; }
        .btn-deshacer:active { background: #d39e00; }
        #btn-linterna-zxing { display: none; background: #ffc107; color: #000; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        #btn-linterna-zxing.encendida { background: #fff3cd; box-shadow: 0 0 8px #ffc107; }

        .resumen-lista { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; padding: 8px; font-size: 12px; font-weight: bold; color: #444; border-bottom: 1px solid #dee2e6; background: #f8f9fa; }
        /* CÁMARA C (zxing-cpp) */
        #scanner-c { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9999; flex-direction: column; padding-top: max(10px, env(safe-area-inset-top)); }
        #scanner-c-video { position: relative; flex: 1; min-height: 0; overflow: hidden; }
        #video-c { width: 100%; height: 100%; object-fit: cover; display: block; }
        #guia-c { position: absolute; left: 12.5%; right: 12.5%; top: 41%; height: 18%; border: 3px solid #28a745; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); pointer-events: none; }
        #guia-c::after { content: ''; position: absolute; left: 4%; right: 4%; top: 50%; height: 2px; background: #dc3545; box-shadow: 0 0 6px #dc3545; }
        #estado-c { position: absolute; top: 10px; left: 0; right: 0; color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px #000; }
        #selector-subcamara-c { display: none; width: 90%; max-width: 380px; margin: 8px auto 0 auto; padding: 8px; border-radius: 8px; font-size: 16px; background: #fff; color: #111; border: none; }
        .btn-flotante-c { position: absolute; bottom: 12px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; font-weight: 900; display: none; align-items: center; justify-content: center; cursor: pointer; }
        #btn-linterna-c { right: 12px; }
        /* Barras deslizantes: zoom (vertical, en el lateral) y área del recuadro (horizontal, sobre los botones) */
        input[type=range].barra-c { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.45); outline: none; touch-action: none; margin: 0; }
        input[type=range].barra-c::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid #28a745; }
        input[type=range].barra-c::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid #28a745; }
        #zoom-lateral { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 240px; display: none; }
        #zoom-lateral input { position: absolute; width: 200px; left: -78px; top: 116px; transform: rotate(-90deg); }
        #etq-zoom-c { position: absolute; top: -26px; left: 0; width: 44px; text-align: center; color: #fff; font-weight: 900; font-size: 14px; text-shadow: 0 1px 3px #000; }
        #fila-area-c { display: flex; align-items: center; gap: 10px; width: 90%; max-width: 380px; margin: 10px auto 0 auto; color: #fff; font-weight: bold; font-size: 14px; }
        #fila-area-c input { flex: 1; }
        #btn-linterna-c.encendida { background: #ffc107; color: #000; box-shadow: 0 0 10px #ffc107; }
        .btn-texto-c { background: #007bff; }
        .btn-texto-c:disabled { opacity: 0.6; }
        .editor-ocr { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
        .chips-ocr { display: flex; flex-wrap: wrap; gap: 5px; max-height: 120px; overflow-y: auto; }
        .chip-ocr { background: #007bff; color: #fff; border-radius: 14px; padding: 5px 10px; font-size: 14px; cursor: pointer; user-select: none; }
        .chip-ocr.quitada { background: #e9ecef; color: #999; text-decoration: line-through; }
        .input-ocr { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 2px solid #007bff; border-radius: 8px; }
        .btn-limpiar-ocr { background: #6c757d; color: #fff; border: none; border-radius: 8px; padding: 0 12px; font-size: 16px; }
        #lectura-c { position: absolute; left: 0; right: 0; bottom: 100px; color: #fff; font-size: 30px; font-weight: 900; text-shadow: 0 1px 4px #000; pointer-events: none; }
        #ocr-crudo { position: absolute; left: 76px; right: 76px; bottom: 72px; color: #ddd; font-size: 12px; font-family: monospace; text-shadow: 0 1px 2px #000; pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        #btn-guardar-c { right: 12px; top: 40px; bottom: auto; font-size: 20px; }
        /* Modo precio (Chequeo): recuadro más alto para la etiqueta del precio */
        #scanner-c.modo-precio #guia-c { left: 12%; right: 12%; top: 22%; height: 46%; border-color: #9c27b0; }
        #scanner-c.modo-precio #guia-c::after { display: none; }
        .etiqueta-enviado { font-size: 10px; font-weight: 900; color: #28a745; margin-left: 4px; }

        /* FICHAS DE ARTÍCULO Y PEDIDO */
        .resultado { display: none; width: 98%; margin: 0 auto; padding: 10px; border: 2px solid #222222; border-radius: 12px; background-color: #ffffff; flex-direction: column; gap: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-height: 100%; overflow-y: auto; }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; font-weight: 800; }
        
        .contenedor-barcode { background: #ffffff; padding: 4px 8px; border-radius: 6px; margin: 2px auto; display: flex; justify-content: center; width: 100%; max-width: 270px; border: 1px dashed #ccc; }
        #codigo-barras-svg { max-width: 100%; height: 50px; display: block; }

        .descripcion-producto { font-size: 17px; font-weight: 900; line-height: 1.15; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 15px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 8px 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; border: none; }
        .etiqueta-stock { font-size: 11px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; color: #ffffff; }

        .panel-cantidad { display: none; flex-direction: row; gap: 8px; margin-top: 6px; }
        .input-cantidad { flex: 1; padding: 12px; border: 3px solid #ff9800; border-radius: 8px; font-size: 20px; text-align: center; font-weight: bold; outline: none; background-color: white; color: #111; }
        #cursor-tecla { position: absolute; width: 2px; background: #9c27b0; pointer-events: none; animation: parpadeo-cursor 1s steps(1) infinite; }
        @keyframes parpadeo-cursor { 50% { opacity: 0; } }

        .lista-resultados { list-style: none; padding: 0; margin: 0; text-align: left; border: 1px solid #dee2e6; border-radius: 6px; }
        .item-resultado { padding: 8px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 13px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 11px; color: #6c757d; font-weight: bold; }

        .caja-interfaz { flex-shrink: 0; padding: 6px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        
        .contenedor-modos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; overflow: hidden; }
        .btn-modo { padding: 12px 4px; color: white; border: none; border-radius: 6px; font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-modo:active { transform: translateY(3px); box-shadow: none !important; }
        
        #btn-modo-rapido { background-color: #6c757d; } #btn-modo-rapido.activo { background-color: #ffc107; color: #000; box-shadow: 0 3px 0 #d39e00; }
        #btn-modo-pedidos { background-color: #6c757d; } #btn-modo-pedidos.activo { background-color: #17a2b8; color: #fff; box-shadow: 0 3px 0 #117a8b; }
        #btn-modo-chequeo { background-color: #6c757d; } #btn-modo-chequeo.activo { background-color: #9c27b0; color: #fff; box-shadow: 0 3px 0 #6a1b9a; }
        #btn-modo-lista { background-color: #007bff; }

        .grupo-input-camara { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; }
        .select-selector-cam-engine { flex: 0 0 68px; height: 50px; border-radius: 6px; border: 2px solid #17a2b8; background: #fff; font-weight: 900; font-size: 12px; color: #111; outline: none; text-align: center; }
        #inputCodigo { flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 16px; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        #inputCodigo:disabled { background-color: #e9ecef; border-color: #ced4da; opacity: 0.7; }
        .btn-camara-cuadrado { flex: 0 0 78px; height: 50px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }

        #teclado-virtual { display: none; grid-template-columns: repeat(3, 1fr) 80px; gap: 6px; margin-top: 6px; background: #f8f9fa; padding: 6px; border-radius: 8px; border: 1px solid #dee2e6; }
        .tecla-v { height: 50px; font-size: 28px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #ccc; color: #111; flex-direction: column; line-height: 1; }
        .tecla-v:active { transform: translateY(2px); box-shadow: none; background: #e9ecef; }
        
        .tecla-accion { background: #dc3545; color: white; border-color: #b02a37; box-shadow: 0 2px 0 #b02a37; font-size: 16px; grid-column: 4; grid-row: 1; height: 100% !important; }
        .tecla-accion:active { background: #c82333; }
        .tecla-ok { background: #28a745; color: white; border-color: #198754; box-shadow: 0 2px 0 #198754; font-size: 40px; font-weight: 900; grid-column: 4; grid-row: 2 / span 3; height: 100% !important; }
        .tecla-ok:active { background: #218838; }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado, body.modo-teclado .contenedor-modos { display: none !important; }

        /* MODAL LISTA */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #f4f6f8; width: 92%; max-height: 85dvh; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111; }
        .btn-cerrar-modal { background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .input-email-config { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 6px; margin-bottom: 8px; font-size: 16px; font-weight: bold; outline: none; text-align: center; }
        .input-competencia { border-color: #9c27b0; color: #9c27b0; margin-bottom: 8px; }
        
        .modal-body { overflow-y: auto; flex: 1; background: white; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 10px; }
        .item-lista-guardada { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #dee2e6; align-items: center; }
        .item-lista-guardada:last-child { border-bottom: none; }
        .item-lista-info { display: flex; flex-direction: column; text-align: left; flex: 1;}
        .item-desc-modal { font-size: 15px; font-weight: bold; color: #111; }
        .item-detalle-modal { font-size: 13px; color: #666; margin-top: 2px; }
        
        .etiqueta-tipo-lista { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; color: white; margin-bottom: 4px; display: inline-block; text-transform: uppercase; }
        .bg-inventario { background-color: #6c757d; } .bg-competencia { background-color: #9c27b0; } .bg-pedido { background-color: #17a2b8; }

        .item-cant-modal { font-size: 20px; font-weight: 900; color: #111; margin-right: 8px; }
        .btn-editar-item { background: #ffc107; color: #000; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-right: 4px; }
        .btn-borrar-item { background: #dc3545; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer;}
        
        .modal-footer { display: flex; gap: 6px; justify-content: space-between; }
        .btn-footer { flex: 1; padding: 14px 6px; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; color: white; cursor: pointer; text-transform: uppercase; }
        .btn-sync-drive { background: #007bff; transition: background 0.3s; }
        .btn-sync-drive.loading { background: #6c757d; pointer-events: none; opacity: 0.8; }
        /* LISTA COMPACTA: ajustes plegables en una línea y botones de cada artículo en columna */
        .modal-content { width: 96%; max-height: 94dvh; padding: 10px; }
        .modal-header { margin-bottom: 6px; gap: 8px; }
        .modal-header h2 { flex-shrink: 0; }
        .btn-ajustes { flex: 1; min-width: 0; text-align: left; background: #e2e8f0; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        #panel-ajustes { display: none; }
        #panel-ajustes.abierto { display: block; }
        .item-lista-guardada { padding: 8px 10px; gap: 8px; }
        .item-lista-info { min-width: 0; overflow-wrap: anywhere; }
        .acciones-item { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .botones-item { display: flex; flex-direction: column; gap: 6px; }
        .botones-item .btn-editar-item, .botones-item .btn-borrar-item { margin: 0; padding: 8px 12px; }
        .acciones-item .item-cant-modal { margin-right: 0; }
        /* CHEQUEO RÁPIDO: foto del precio y revisión después */
        #btn-foto-c { right: 12px; bottom: 80px; width: 64px; height: 64px; font-size: 28px; background: rgba(156,39,176,0.85); }
        #miniatura-c { display: none; position: absolute; top: 40px; left: 60px; width: 45%; border: 3px solid #28a745; border-radius: 8px; pointer-events: none; }
        .btn-cancelar-c { background: #6c757d; display: none; }
        .botones-rapido { display: flex; gap: 6px; margin-top: 8px; }
        .botones-rapido button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; color: #fff; }
        .fila-rev { background: #fff; border-bottom: 1px solid #dee2e6; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .fila-rev img { width: 100%; height: 110px; object-fit: contain; background: #222; border-radius: 6px; }
        .desc-rev { font-size: 13px; font-weight: 900; overflow-wrap: anywhere; }
        .datos-rev { font-size: 12px; color: #555; overflow-wrap: anywhere; }
        .marca-rev { font-weight: 900; }
        .precio-rev { display: flex; gap: 6px; align-items: center; }
        .precio-rev input { flex: 1; min-width: 0; font-size: 22px; font-weight: 900; padding: 6px; border: 2px solid #9c27b0; border-radius: 6px; text-align: center; }
        .precio-rev button { padding: 10px 16px; border: none; border-radius: 6px; font-size: 18px; font-weight: 900; color: #fff; }
        #visor-foto { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 20000; align-items: center; justify-content: center; }
        #visor-foto img { max-width: 100%; max-height: 100%; }
        /* GUARDIAS: quién está cada día del cuadrante */
        .cabecera-botones { display: flex; gap: 6px; }
        .btn-guardias { padding: 8px 12px; background-color: #b8630a; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #gd-mes { flex: 1; min-width: 0; padding: 7px; border-radius: 8px; border: 1px solid #ccd3da; font-size: 14px; font-weight: bold; background: #fff; }
        .gd-nav { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; }
        .gd-flecha { flex-shrink: 0; padding: 8px 10px; border: none; border-radius: 6px; background: #e2e8f0; font-weight: 900; font-size: 16px; }

        // Escapa texto antes de insertarlo en HTML (evita que un código escaneado o una descripción inyecten HTML/JS)
        function esc(v) { return (v == null ? '' : String(v)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
        // Convierte un valor en argumento seguro para un onclick="funcion(...)"
        function jsArg(v) { return esc(JSON.stringify(v == null ? '' : String(v))); }

        let dbLocal;
        function initDB() {
            return new Promise((resolve) => {
                let req = indexedDB.open("HiperDB_Files", 1);
                req.onupgradeneeded = e => {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains("archivos")) db.createObjectStore("archivos", { keyPath: "id" });
                };
                req.onsuccess = e => { dbLocal = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        }
        
        async function guardarArchivoLocal(id, data) {
            if (!dbLocal) return;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readwrite");
                tx.objectStore("archivos").put({ id: id, data: data });
                tx.oncomplete = resolve;
            });
        }
        
        async function leerArchivoLocal(id) {
            if (!dbLocal) return null;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readonly");
                let req = tx.objectStore("archivos").get(id);
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        }

        let audioCtx = null;
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
        function reproducirBeep() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.15); 
            } catch(e) { console.log("Audio no soportado"); }
        }

        // Comprueba el dígito de control de EAN-8 / EAN-13 / UPC-A. Otros códigos (QR, Code128...) se aceptan tal cual.
        function digitoControlValido(codigo) {
            if (!/^(\d{8}|\d{12}|\d{13})$/.test(codigo)) return true;
            const digitos = codigo.split('').map(Number);
            const control = digitos.pop();
            let suma = 0;
            digitos.reverse().forEach((d, i) => { suma += d * (i % 2 === 0 ? 3 : 1); });
            return (10 - (suma % 10)) % 10 === control;
        }

        // Etiquetas de papel de Carrefour: su código de barras es el EAN-13 del artículo seguido del precio en céntimos con 6 cifras
        // ("8410721110506" + "000169" = 1,69 €). Devuelve { ean, precio } o null si no es un código así.
        // QR de las etiquetas de DIA: "EAN_código interno_precio_..." ("8421860121322_228160_1,25_1,27_1,25_1,27_0,00" = 1,25 €)
        let precioDelCodigo = null;
        function codigoConPrecio(codigo) {
            const d = String(codigo).trim().match(/^(\d{8}|\d{12,13})_\d*_(\d+)[,.](\d{2})(_|$)/);
            if (d && digitoControlValido(d[1]) && parseFloat(d[2] + '.' + d[3]) > 0) return { ean: d[1], precio: (parseInt(d[2], 10) + '.' + d[3]) };
            const m = String(codigo).trim().match(/^(\d{13})(\d{6})$/);
            if (!m || !digitoControlValido(m[1]) || parseInt(m[2], 10) <= 0) return null;
            return { ean: m[1], precio: (parseInt(m[2], 10) / 100).toFixed(2) };
        }

        // Decide si una lectura de cámara se acepta: descarta EAN mal leídos y el mismo código repetido en menos de 2,5 s

            if (!codigo || !digitoControlValido(codigo)) return false;
            const ahora = Date.now();
            if (codigo === ultimaLecturaCamara.codigo && ahora - ultimaLecturaCamara.hora < 2500) return false;
            ultimaLecturaCamara = { codigo: codigo, hora: ahora };
            return true;
        }

        async function enviarADrive() {
            if (listaTrabajo.length === 0) { alert("La lista está vacía."); return; }
            // Solo se envían los registros que aún no se han guardado en Drive, para no duplicar filas en la hoja
            const pendientes = listaTrabajo.filter(item => !item.enviadoDrive);
            if (pendientes.length === 0) {
                if (confirm("Todo ya está guardado en Drive.\n¿Quieres vaciar la lista de trabajo?")) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); }
                return;
            }
            if (!claveDriveGuardada && !pedirClaveDrive()) return;
            const btnDrive = document.getElementById('btn-drive');
            btnDrive.classList.add('loading'); btnDrive.innerText = "⏳ Guardando...";
            const datosAEnviar = pendientes.map(item => { return { tipo: item.tipo || 'inventario', ean: item.ean, cantidad: item.cantidad, stock: item.stock || "", descripcion: item.descripcion, fecha: item.fecha, usuario: usuarioGuardado, competencia: item.competencia || "", pvp_competencia: item.pvp_competencia || "", pvp_nuestro: item.pvp_nuestro || "", opus: item.opus || "", rayon: item.rayon || "" }; });
            try {
                const payload = { action: "sync", clave: claveDriveGuardada, data: datosAEnviar };
                const response = await fetch(URL_GOOGLE_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "success") {
                    pendientes.forEach(item => { item.enviadoDrive = true; });
                    localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista();
                    alert(`¡Guardados ${pendientes.length} registros en Google Drive correctamente!`); if(confirm("¿Quieres vaciar la lista de trabajo?")) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } } 
                else if (!claveRechazada(result)) alert("Error Drive: " + result.message);
            } catch (error) { alert("Error conexión: " + error); } 
            finally { btnDrive.classList.remove('loading'); btnDrive.innerText = "☁️ Guardar en Drive"; }
        }

        function procesarBusqueda(terminoBusqueda, fromCam = false) {
            if (fromCam) ultimoModo = 'camara';
            if (guardarClaveDesdeQR(terminoBusqueda)) { inputCodigo.value = ""; return; }
            if (inputActivoId !== 'inputCodigo') { inputCodigo.value = ""; return; }
            let termino = terminoBusqueda.trim().toUpperCase(); inputCodigo.value = ""; if (!termino) return;
            const conPrecio = codigoConPrecio(termino);
            precioDelCodigo = conPrecio ? conPrecio.precio : null;
            if (conPrecio) termino = conPrecio.ean;

            let result = buscarArticuloGlobal(termino);
            if (result) { 
                seleccionarArticulo(result.ean, result.esSinStock); 
                return;
            } 
            
            // Solo unas cifras tecleadas (parte del código): buscar los EAN que las contienen
            let coincidencias = (!fromCam && /^\d{4,12}$/.test(termino)) ? buscarPorParteDeCodigo(termino) : [];
            if (coincidencias.length === 0) {
                let palabras = termino.split(" ").filter(t => t.length > 0);
                for (const [ean, articulo] of Object.entries(inventario)) { if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) { coincidencias.push({ ean: ean, articulo: articulo, esSinStock: false }); } }
                if (coincidencias.length < 50) { for (const [ean, articulo] of Object.entries(inventarioSinStock)) { if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) { coincidencias.push({ ean: ean, articulo: articulo, esSinStock: true }); if (coincidencias.length >= 50) break; } } }
            }

            if (coincidencias.length === 0) {
                if (modoActivo === 'rapido') { procesarEscaneoRapido(termino); return; }
                if (modoActivo === 'chequeo') { procesarEscaneoChequeo(termino); return; }
                if (modoActivo === 'pedidos') { procesarEscaneoPedido(termino); return; }
                mostrarArticuloDesconocido(termino);
            }
            else if (coincidencias.length === 1) { seleccionarArticulo(coincidencias[0].ean, coincidencias[0].esSinStock); }
            else { mostrarListaCoincidencias(coincidencias, `${coincidencias.length} encontrados:`); }
            setTimeout(() => inputCodigo.blur(), 100);
        }

        function htmlListaCoincidencias(coincidencias, titulo) {
            let htmlLista = `<h3 style="margin: 0 0 8px 0; font-size: 14px; color: #007bff;">${titulo}</h3><ul class="lista-resultados">`;
            coincidencias.slice(0, 50).forEach(c => { let etiquetaExtra = c.esSinStock ? `<span style="color:#ff9800; font-size:10px; font-weight:bold;">(SIN STOCK)</span>` : ""; htmlLista += `<li class="item-resultado" onclick="seleccionarArticulo(${jsArg(c.ean)}, ${c.esSinStock})"><span class="item-desc">${esc(c.articulo.descripcion)}</span><span class="item-ean">EAN: ${esc(c.ean)} ${etiquetaExtra}</span></li>`; });
            if (coincidencias.length >= 50) { htmlLista += `<li class="item-resultado" style="text-align:center; color:#666; font-size:12px;">...limitado a 50. Añade más palabras para filtrar.</li>`; }
            return htmlLista + `</ul>`;
        }

        function mostrarListaCoincidencias(coincidencias, titulo) {
            resultadoDiv.style.display = 'flex'; resultadoDiv.style.borderColor = "#007bff"; resultadoDiv.innerHTML = htmlListaCoincidencias(coincidencias, titulo);
        }

        // EAN que contienen esas cifras; primero los que terminan en ellas
        function buscarPorParteDeCodigo(cifras) {
            let alFinal = [], enMedio = [];
            [[inventario, false], [inventarioSinStock, true]].forEach(([fuente, esSinStock]) => {
                for (const [ean, articulo] of Object.entries(fuente)) {
                    if (ean.endsWith(cifras)) alFinal.push({ ean, articulo, esSinStock });
                    else if (ean.includes(cifras)) enMedio.push({ ean, articulo, esSinStock });
                }
            });
            return alFinal.concat(enMedio).slice(0, 50);
        }

        const PALABRAS_VACIAS = new Set(['DEL', 'LAS', 'LOS', 'CON', 'SIN', 'PARA', 'POR', 'UNA', 'UNO', 'THE', 'AND']);
        function normalizarTexto(s) { return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
        function palabrasDeArticulo(articulo) {
            if (!articulo._palabras) articulo._palabras = normalizarTexto(articulo.descripcion).split(/[^A-Z0-9]+/).filter(p => p.length >= 3);
            return articulo._palabras;
        }

        // Texto leído con la cámara (OCR): primero busca un código completo; si no, puntúa los artículos por las palabras y cifras que coinciden.
        // Si no hay código, enseña lo leído para quitar palabras (tocándolas) o corregirlo, y vuelve a buscar al momento
        let palabrasOCR = [], esperaOCR = null;
        function buscarPorTextoOCR(textoLeido) {
            const r = candidatosPorTexto(textoLeido);
            if (r.codigo) { seleccionarArticulo(r.codigo.ean, r.codigo.esSinStock); return; }
            const vistos = new Set();
            palabrasOCR = textoLeido.split(/\s+/).map(p => p.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ''))
                .filter(p => p.length >= 2 && !vistos.has(p.toUpperCase()) && vistos.add(p.toUpperCase()))
                .slice(0, 40).map(p => ({ p, activa: true }));
            resultadoDiv.style.display = 'flex'; resultadoDiv.style.borderColor = "#007bff";
            resultadoDiv.innerHTML = `<div class="editor-ocr"><div style="font-size:12px; color:#666;">🔤 Toca las palabras que sobran o corrige el texto:</div>
                <div id="chips-ocr" class="chips-ocr"></div>
                <div style="display:flex; gap:6px;"><input id="texto-ocr" class="input-ocr" type="search" autocomplete="off" oninput="textoOCREditado()"><button class="btn-limpiar-ocr" onclick="limpiarTextoOCR()">✕</button></div></div>
                <div id="lista-ocr"></div>`;
            pintarChipsOCR(); textoDesdeChipsOCR();
        }

        function pintarChipsOCR() {
            document.getElementById('chips-ocr').innerHTML = palabrasOCR.map((w, i) => `<span class="chip-ocr${w.activa ? '' : ' quitada'}" onclick="alternarPalabraOCR(${i})">${esc(w.p)}</span>`).join('');
        }
        function alternarPalabraOCR(i) { palabrasOCR[i].activa = !palabrasOCR[i].activa; pintarChipsOCR(); textoDesdeChipsOCR(); }
        function textoDesdeChipsOCR() {
            document.getElementById('texto-ocr').value = palabrasOCR.filter(w => w.activa).map(w => w.p).join(' ');
            actualizarListaOCR();
        }
        function limpiarTextoOCR() {
            palabrasOCR.forEach(w => w.activa = false); pintarChipsOCR();
            const input = document.getElementById('texto-ocr'); input.value = ''; input.focus(); actualizarListaOCR();
        }
        function textoOCREditado() { clearTimeout(esperaOCR); esperaOCR = setTimeout(actualizarListaOCR, 300); }

        function actualizarListaOCR() {
            const input = document.getElementById('texto-ocr'), lista = document.getElementById('lista-ocr');
            if (!input || !lista) return;
            const texto = input.value.trim();
            if (!texto) { lista.innerHTML = `<p style="font-size:13px; color:#666; margin:6px 0 0;">Escribe o activa alguna palabra.</p>`; return; }
            const r = candidatosPorTexto(texto);
            const candidatos = r.codigo ? [r.codigo] : r.candidatos;
            lista.innerHTML = candidatos.length === 0
                ? `<h3 style="color:#dc3545; margin:6px 0 4px 0; font-size:16px;">Sin coincidencias</h3><p style="font-size:12px; color:#666; margin:0;">Quita palabras mal leídas o deja solo las más claras (marca, tipo...).</p>`
                : htmlListaCoincidencias(candidatos, `${candidatos.length} posibles:`);
        }

        function candidatosPorTexto(textoLeido) {
            const texto = normalizarTexto(textoLeido);
            const sueltos = texto.match(/\d{5,14}/g) || [];
            const unidos = texto.replace(/(\d)[ .-](?=\d)/g, '$1').match(/\d{5,14}/g) || []; // "8 410000 123456" -> un solo número
            const numeros = [...new Set(unidos.concat(sueltos))];
            for (const n of numeros) {
                const r = buscarArticuloGlobal(n);
                if (r) return { codigo: { ean: r.ean, articulo: r.art, esSinStock: r.esSinStock }, candidatos: [] };
            }
            const palabras = [...new Set((texto.match(/[A-Z0-9]{3,}/g) || []).filter(p => !/^\d+$/.test(p) && !PALABRAS_VACIAS.has(p)))];
            const minimo = palabras.length >= 2 ? 2 : 1;
            let candidatos = [];
            [[inventario, false], [inventarioSinStock, true]].forEach(([fuente, esSinStock]) => {
                for (const [ean, articulo] of Object.entries(fuente)) {
                    const pd = palabrasDeArticulo(articulo);
                    let puntos = palabras.filter(p => pd.some(d => d.startsWith(p) || p.startsWith(d))).length;
                    if (numeros.some(n => ean.includes(n))) puntos += 3;
                    if (puntos >= minimo) candidatos.push({ ean, articulo, esSinStock, puntos });
                }
            });
            candidatos.sort((a, b) => b.puntos - a.puntos);
            return { codigo: null, candidatos: candidatos.slice(0, 30) };
        }

        function dibujarCodigoBarras(codigo) {
            if (!codigo || codigo === "-") return;
            try {
                let formato = (/^\d{13}$/.test(codigo)) ? "EAN13" : "CODE128";
                JsBarcode("#codigo-barras-svg", codigo, {
                    format: formato,
                    lineColor: "#000000",
                    width: 2,
                    height: 50,
                    displayValue: false,
                    margin: 0
                });
            } catch (e) {
                try {
                    JsBarcode("#codigo-barras-svg", codigo, {
                        format: "CODE128",
                        width: 2,
                        height: 50,
                        displayValue: false,
                        margin: 0
                    });
                } catch (err) {
                    console.warn("No fue posible generar el código de barras gráfico:", err);
                }
            }
        }

        function mostrarArticuloDesconocido(termino) {
            resultadoDiv.style.display = 'flex'; 
            resultadoDiv.style.borderColor = "#dc3545";
            resultadoDiv.innerHTML = `
                <h3 style="color: #dc3545; margin: 0 0 4px 0; font-size: 18px;">No encontrado en BD</h3>
                <p style="font-size: 14px;">Lectura: <strong>${esc(termino)}</strong></p>
                <div class="contenedor-barcode">

        // Cursor en las casillas de precio y cantidad: al tocar el número, el cursor se pone donde se toca
        // para corregir una cifra (p. ej. poner el "1" delante de 9,90) sin borrarlo todo
        let cursorTecla = { input: null, pos: 0 };
        const ctxMedida = document.createElement('canvas').getContext('2d');
        function anchoTexto(input, texto) {
            const estilo = getComputedStyle(input);
            ctxMedida.font = `${estilo.fontWeight} ${estilo.fontSize} ${estilo.fontFamily}`;
            return ctxMedida.measureText(texto).width;
        }
        function colocarCursor(e, input) {
            if (!e || !input || !input.value) { cursorTecla.input = null; mostrarCursor(); return; }
            const r = input.getBoundingClientRect(), inicio = r.left + (r.width - anchoTexto(input, input.value)) / 2;
            let pos = input.value.length, mejor = Infinity;
            for (let i = 0; i <= input.value.length; i++) {
                const d = Math.abs(inicio + anchoTexto(input, input.value.slice(0, i)) - e.clientX);
                if (d < mejor) { mejor = d; pos = i; }
            }
            cursorTecla = { input: input, pos: pos };
            mostrarCursor();
        }
        function mostrarCursor() {
            let raya = document.getElementById('cursor-tecla');
            const input = cursorTecla.input;
            if (!input || !input.isConnected) { if (raya) raya.remove(); return; }
            if (!raya) { raya = document.createElement('div'); raya.id = 'cursor-tecla'; }
            const panel = input.parentElement;
            panel.style.position = 'relative';
            if (raya.parentElement !== panel) panel.appendChild(raya);
            const x = input.offsetLeft + (input.offsetWidth - anchoTexto(input, input.value)) / 2 + anchoTexto(input, input.value.slice(0, cursorTecla.pos));
            raya.style.left = (x - 1) + 'px';
            raya.style.top = (input.offsetTop + input.offsetHeight * 0.2) + 'px';
            raya.style.height = (input.offsetHeight * 0.6) + 'px';
        }

        function pulsarTecla(valor) {
            const inputDestino = document.getElementById(inputActivoId);
            if (!inputDestino) return;
            const conCursor = cursorTecla.input === inputDestino;
            const v = inputDestino.value, pos = conCursor ? Math.min(cursorTecla.pos, v.length) : v.length;

            if (valor === 'DEL') {
                if (pos > 0) { inputDestino.value = v.slice(0, pos - 1) + v.slice(pos); if (conCursor) cursorTecla.pos = pos - 1; }
            } else if (valor === 'ENTER') {
                if (inputActivoId === 'inputCodigo') { ultimoModo = 'teclado'; procesarBusqueda(inputDestino.value.trim()); tecladoVirtual.style.display = 'none'; document.body.classList.remove('modo-teclado'); } 
                else if (inputActivoId === 'input-precio-accion') guardarPrecioCompetencia();
                else if (inputActivoId === 'input-pedido-accion') guardarCantidadPedido();
            } else { inputDestino.value = v.slice(0, pos) + valor + v.slice(pos); if (conCursor) cursorTecla.pos = pos + 1; }
            if (conCursor) mostrarCursor();
        }

        inputCodigo.addEventListener('focus', (e) => { if (inputActivoId !== 'inputCodigo') { e.preventDefault(); inputCodigo.blur(); return; } document.body.classList.add('modo-teclado'); tecladoVirtual.style.display = 'none'; cerrarCualquierCamara(); });
        inputCodigo.addEventListener('blur', () => { if (tecladoVirtual.style.display !== 'grid') document.body.classList.remove('modo-teclado'); });
        inputCodigo.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); ultimoModo = 'teclado'; procesarBusqueda(inputCodigo.value.trim()); } });

        function seleccionarMotorCamara(nuevoMotor) {

        async function iniciarCamaraA() {
            cerrarCualquierCamara();
            await cierreCamaraB; // si la Cámara B estaba abierta, esperar a que libere la cámara
            const container = document.getElementById('video-container-zxing');
            container.style.display = 'block';
            tecladoVirtual.style.display = 'none';
            if (!codeReader) { const pistas = new Map();
                pistas.set(ZXing.DecodeHintType.TRY_HARDER, true);
                pistas.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
                codeReader = new ZXing.BrowserBarcodeReader(pistas); }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const devices = await codeReader.listVideoInputDevices();
                const select = document.getElementById('selector-subcamara-zxing');
                select.innerHTML = '';
                let idCamaraTrasera = null;
                devices.forEach((device, idx) => {
                    const opt = document.createElement('option'); opt.value = device.deviceId; opt.text = device.label || 'Cámara ' + (idx + 1); select.appendChild(opt);
                    const label = device.label.toLowerCase(); if (label.includes('back') || label.includes('trasera') || label.includes('environment')) { idCamaraTrasera = device.deviceId; }
                });
                stream.getTracks().forEach(track => track.stop());
                await new Promise(r => setTimeout(r, 300)); // dar tiempo al móvil a soltar la cámara antes de reabrirla
                let selected = camaraManualIdZXing || idCamaraTrasera || (devices.length > 0 ? devices[0].deviceId : null);
                if (selected) {
                    select.value = selected;
                    codeReader.decodeFromVideoDevice(selected, 'video-preview', (result) => {
                        if (result && aceptarLecturaCamara(result.text)) {
                            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                            reproducirBeep();
                            cerrarCualquierCamara();
                            procesarBusqueda(result.text.trim(), true);
                        }
                    });
                }
            } catch (err) { alert("Error Cámara A: " + err.message); container.style.display = 'none'; }
        }

        function pistaVideoZXing() {

        // Al arrancar el vídeo de la Cámara A, mostrar el botón de linterna solo si la cámara la soporta
        renovarVideo('video-preview').addEventListener('loadedmetadata', () => {

        async function alternarLinternaZXing() {
            const pista = pistaVideoZXing();

                await pista.applyConstraints({ advanced: [{ torch: !linternaEncendidaZXing }] });
                linternaEncendidaZXing = !linternaEncendidaZXing;

            } catch (e) { alert("No se pudo cambiar la linterna: " + e.message); }

        // ===== CÁMARA C: zxing-cpp (WebAssembly) con vídeo en alta resolución =====
        const FORMATOS_C = ['EAN13', 'EAN8', 'UPCA', 'UPCE', 'Code128', 'QRCode']; // QR: para el código de la clave de Drive
        const canvasC = document.createElement('canvas');
        const ctxC = canvasC.getContext('2d', { willReadFrequently: true });

        // Ahorro de batería: si pasan 45 s sin leer nada ni tocar la pantalla, la cámara se apaga y queda en pausa (tocar la imagen la vuelve a encender)
        const PAUSA_CAMARA_MS = 45000;
        let ultimaActividadC = 0, codigoVistoC = 0, camaraPausadaC = null;
        function actividadC() { ultimaActividadC = Date.now(); }

        function pausarCamaraC() {
            camaraPausadaC = document.getElementById('scanner-c').classList.contains('modo-precio') ? 'precio' : 'codigo';

        // Al bloquear la pantalla o cambiar de app, la cámara se apaga
        document.addEventListener('visibilitychange', () => {

        // soloPrecio: al volver de la pausa en Chequeo, se sigue leyendo el precio del artículo que ya estaba leído
        async function iniciarCamaraC(soloPrecio = false) {
            cerrarCualquierCamara();
            actividadC();
            await cierreCamaraB;
            if (typeof ZXingWASM === 'undefined') { alert("No se pudo cargar el lector de la Cámara C (¿sin conexión?). Usa la Cámara A o B."); return; }
            const container = document.getElementById('scanner-c');
            const video = videoCamaraC();
            const estadoC = document.getElementById('estado-c');
            container.style.display = 'flex';
            if (!soloPrecio) resultadoDiv.style.display = 'none';
            if (tecladoVirtual.style.display === 'grid') { tecladoVirtual.style.display = 'none'; document.body.classList.remove('modo-teclado'); }
            actualizarBotonDeshacer();
            estadoC.textContent = "Abriendo cámara...";
            const miSesion = ++sesionC;
            const resolucion = { width: { ideal: 1920 }, height: { ideal: 1080 } };
            try {
                let stream;
                try {
                    const video1 = camaraManualIdC ? { ...resolucion, deviceId: { exact: camaraManualIdC } } : { ...resolucion, facingMode: { ideal: 'environment' } };

                }
                if (miSesion !== sesionC) { stream.getTracks().forEach(t => t.stop()); return; }
                streamC = stream;
                const pista = stream.getVideoTracks()[0];
                const capacidades = pista.getCapabilities ? pista.getCapabilities() : {};
                if (capacidades.focusMode && capacidades.focusMode.includes('continuous')) {
                    try { await pista.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
                }
                document.getElementById('btn-linterna-c').style.display = capacidades.torch ? 'flex' : 'none';
                configurarZoomC(capacidades.zoom);
                aplicarAreaGuia();
                video.srcObject = stream;
                try { await video.play(); } catch (e) {}
                vigilarImagenNegraC(miSesion, video, soloPrecio);
                rellenarSelectorCamarasC(pista);
                estadoC.textContent = "Cargando lector...";
                if (soloPrecio && rapidoActivo()) bucleFotoPrecioC(miSesion);
                else if (soloPrecio) buclePrecioC(miSesion);
                else bucleLecturaC(miSesion);

                if (err && err.name === 'NotAllowedError') alert("Permite el acceso a la cámara en los ajustes del navegador.");

        // Lector nativo del sistema (Chrome en Android usa el motor de Google, muy rápido). En iPhone no existe y se usa solo zxing-cpp.
        let detectorNativo = null;
        if ('BarcodeDetector' in window) {
            BarcodeDetector.getSupportedFormats().then(soportados => {
                const formatos = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code'].filter(f => soportados.includes(f));
                if (formatos.length) detectorNativo = new BarcodeDetector({ formats: formatos });
            }).catch(() => {});
        }

        // Lee con el lector nativo todo el fotograma, pero solo acepta códigos que están dentro del recuadro verde (los QR, en cualquier sitio)
        async function detectarNativoC(video) {
            if (!detectorNativo) return null;
            try {
                const codigos = await detectorNativo.detect(video);
                if (codigos.length) codigoVistoC = Date.now();
                // El código tiene que estar entero dentro del recuadro a lo ancho (con un poco de tolerancia) y con el centro dentro a lo alto
                const g = rectGuiaEnVideo(), tol = g.w * 0.04;
                const codigo = codigos.find(c => {
                    if (!c.rawValue) return false;
                    if (c.format === 'qr_code') return true;
                    const b = c.boundingBox, cy = b.y + b.height / 2;
                    return b.x >= g.x - tol && b.x + b.width <= g.x + g.w + tol && cy > g.y && cy < g.y + g.h;
                });
                return codigo ? codigo.rawValue : null;
            } catch (e) { return null; }
        }

        async function bucleLecturaC(miSesion) {
            const video = document.getElementById('video-c');
            const estadoC = document.getElementById('estado-c');
            let primera = true, vuelta = 0, vueltaZ = 0, lecturaPendiente = { codigo: null, hora: 0 };
            while (miSesion === sesionC) {
                if (Date.now() - ultimaActividadC > PAUSA_CAMARA_MS) { pausarCamaraC(); return; }
                if (video.readyState >= 2 && video.videoWidth > 0) {
                    let texto = await detectarNativoC(video);
                    if (miSesion !== sesionC) return;

                    if (!texto && (!detectorNativo || ++vueltaZ % 3 === 0 || Date.now() - codigoVistoC < 1000)) {
                        // Se analiza solo la zona del recuadro verde, a resolución completa. De vez en cuando, el fotograma entero pero solo para QR (clave de Drive)
                        // (a los lados, un poco de margen para que zxing vea el borde blanco del código)
                        const g = rectGuiaEnVideo(), tol = g.w * 0.04;
                        const soloQR = ++vuelta % 8 === 0;
                        const x0 = soloQR ? 0 : Math.max(0, Math.round(g.x - tol)), y0 = soloQR ? 0 : Math.round(g.y);
                        const ancho = soloQR ? video.videoWidth : Math.min(video.videoWidth - x0, Math.round(g.w + tol * 2));
                        const alto = soloQR ? video.videoHeight : Math.round(g.h);
                        if (canvasC.width !== ancho || canvasC.height !== alto) { canvasC.width = ancho; canvasC.height = alto; }
                        ctxC.drawImage(video, x0, y0, ancho, alto, 0, 0, ancho, alto);
                        let resultados = [];
                        try {
                            resultados = await ZXingWASM.readBarcodes(ctxC.getImageData(0, 0, ancho, alto), { formats: soloQR ? ['QRCode'] : FORMATOS_C, tryHarder: true, tryInvert: false, maxNumberOfSymbols: 1 });
                        } catch (e) {
                            estadoC.textContent = "⚠️ No se pudo cargar el lector: " + (e && e.message ? e.message : e);
                            await new Promise(r => setTimeout(r, 1000));
                            continue;
                        }
                        if (miSesion !== sesionC) return;
                        if (primera) { primera = false; if (!estadoC.textContent.startsWith('✅')) estadoC.textContent = "Apunta al código de barras"; }
                        if (resultados.length) codigoVistoC = Date.now();
                        const lectura = resultados.find(r => r.isValid && r.text);
                        texto = lectura ? lectura.text : null;
                    }
                    // Los EAN/UPC hay que leerlos dos veces seguidas: a veces sale una lectura mala que aun así cuadra con el dígito
                    // de control (8413423030233 leído 9414023030233), sobre todo al seguir apuntando a un código ya chequeado.
                    // Los cortos (EAN-8, UPC-E) además salen de leer un trozo de un EAN-13. Un error así casi nunca se repite igual.
                    if (texto && /^(\d{8}|\d{12}|\d{13})$/.test(texto.trim())) {
                        const ahora = Date.now();
                        if (texto !== lecturaPendiente.codigo || ahora - lecturaPendiente.hora > 1500) { lecturaPendiente = { codigo: texto, hora: ahora }; texto = null; }
                    }
                    // En Chequeo solo valen códigos de envase (EAN/UPC) o los de Carrefour con el precio dentro: el código de barras de
                    // las etiquetas de la competencia (Mercadona "391306", Code128) es interno y no sirve para comparar
                    if (texto && modoActivo === 'chequeo' && !/^MOVILEC-(CLAVE|EDITOR):/i.test(texto.trim()) && !/^(\d{8}|\d{12}|\d{13})$/.test(texto.trim()) && !codigoConPrecio(texto.trim())) {
                        estadoC.textContent = "⚠️ Ese código es de la etiqueta, no del producto: escanea el del ENVASE";
                        texto = null;
                    }

                    if (texto && aceptarLecturaCamara(texto)) {
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                        reproducirBeep();
                        actividadC();
                        if (rapidoActivo()) {
                            // Chequeo rápido: tras el código se hace una foto del precio y se sigue con el siguiente artículo
                            if (prepararChequeoRapido(texto.trim())) { bucleFotoPrecioC(miSesion); return; }
                        } else if (modoActivo === 'chequeo') {
                            // Chequeo manual: se cierra la cámara y queda el teclado abierto para escribir el precio
                            // (la lectura del precio con la cámara es el modo Rápido)
                            procesarBusqueda(texto.trim(), true);
                            cerrarCualquierCamara();
                            return;
                        } else {
                            cerrarCualquierCamara();
                            procesarBusqueda(texto.trim(), true);
                            return;
                        }
                    }
                }
                // Sin ningún código a la vista se mira más despacio, para gastar menos batería
                const prisa = Date.now() - codigoVistoC < 2000 || Date.now() - ultimaActividadC < 3000;
                await new Promise(r => setTimeout(r, prisa ? 30 : 100));
            }
        }

        // ===== ZOOM, ÁREA Y ENFOQUE (Cámara C) =====
        // Las dos barras guardan su posición y se mantiene hasta que se vuelvan a mover
        let zoomC = parseFloat(localStorage.getItem('zoomC')) || 1;
        let aplicandoZoom = false;

        // Barra de zoom: solo aparece si la cámara permite zoom
        function configurarZoomC(rango) {
            const caja = document.getElementById('zoom-lateral');
            if (!rango || !(rango.max > rango.min)) { caja.style.display = 'none'; return; }
            const barra = document.getElementById('zoom-c');
            const max = Math.min(rango.max, 8); // más allá la imagen pierde demasiada calidad
            barra.min = rango.min; barra.max = max; barra.step = rango.step || 0.1;
            zoomC = Math.min(Math.max(zoomC, rango.min), max);
            barra.value = zoomC;
            caja.style.display = 'block';
            aplicarZoomC();
        }

        // Mientras se arrastra la barra llegan muchos valores: se aplica uno cada vez y al final el último
        async function aplicarZoomC() {
            document.getElementById('etq-zoom-c').textContent = zoomC.toFixed(1) + 'x';
            if (aplicandoZoom) return;
            aplicandoZoom = true;
            let aplicado = null;
            while (aplicado !== zoomC) {
                const pista = streamC ? streamC.getVideoTracks()[0] : null;
                if (!pista) break;
                aplicado = zoomC;
                try { await pista.applyConstraints({ advanced: [{ zoom: aplicado }] }); } catch (e) {}
            }
            aplicandoZoom = false;
        }

        function cambiarZoomC(valor) {
            actividadC();
            zoomC = parseFloat(valor);
            localStorage.setItem('zoomC', zoomC);
            aplicarZoomC();
        }

        // Barra de área: tamaño del recuadro (en % del máximo). Lo que queda dentro es lo que leen el OCR de texto y el de precios.
        let areaGuia = parseInt(localStorage.getItem('areaGuia'), 10) || 100;
        function aplicarAreaGuia() {
            const precio = document.getElementById('scanner-c').classList.contains('modo-precio');
            const a = areaGuia / 100, ancho = (precio ? 76 : 75) * a, alto = (precio ? 46 : 18) * a;
            const g = document.getElementById('guia-c').style;
            g.left = g.right = ((100 - ancho) / 2) + '%';
            g.top = ((100 - alto) / 2) + '%';
            g.height = alto + '%';
            document.getElementById('area-c').value = areaGuia;
        }

        function cambiarAreaC(valor) {
            actividadC();
            areaGuia = parseInt(valor, 10);
            localStorage.setItem('areaGuia', areaGuia);
            aplicarAreaGuia();
        }

        // Tocar la imagen fuerza un nuevo enfoque (si la cámara lo permite) y luego vuelve al enfoque continuo
        async function enfocarC() {
            if (camaraPausadaC) { const modo = camaraPausadaC; camaraPausadaC = null; iniciarCamaraC(modo === 'precio'); return; }
            actividadC();
            const pista = streamC ? streamC.getVideoTracks()[0] : null;
            const modos = (pista && pista.getCapabilities) ? (pista.getCapabilities().focusMode || []) : [];
            if (!modos.includes('single-shot')) return;
            try {
                await pista.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                if (modos.includes('continuous')) setTimeout(() => { if (pista.readyState === 'live') pista.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); }, 1500);
            } catch (e) {}
        }

        // ===== OCR (Tesseract.js): leer texto y precios con la Cámara C =====
        // Se descarga solo al usarlo por primera vez (unos MB); luego queda guardado en el móvil.
        const URL_TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        let promesaOCR = null;
        let avisoProgresoOCR = null;
        let colaOCR = Promise.resolve();

        function cargarOCR() {
            if (!promesaOCR) {
                promesaOCR = new Promise((resolve, reject) => {
                    if (window.Tesseract) return resolve();
                    const s = document.createElement('script');
                    s.src = URL_TESSERACT; s.onload = resolve;
                    s.onerror = () => reject(new Error("No se pudo descargar el OCR (¿sin conexión?)"));
                    document.head.appendChild(s);
                }).then(() => Tesseract.createWorker('spa', 1, {
                    logger: m => { if (avisoProgresoOCR && m.status && m.status.indexOf('loading') === 0) avisoProgresoOCR(m); }
                })).catch(e => { promesaOCR = null; throw e; });
            }
            return promesaOCR;
        }

        // Copia a un lienzo la zona del vídeo que queda dentro del recuadro de la pantalla (el vídeo usa object-fit: cover)
        function rectGuiaEnVideo() {
            const video = document.getElementById('video-c');
            const vr = video.getBoundingClientRect(), gr = document.getElementById('guia-c').getBoundingClientRect();
            if (!vr.width || !gr.width) return { x: 0, y: video.videoHeight * 0.25, w: video.videoWidth, h: video.videoHeight * 0.5 };
            const escala = Math.max(vr.width / video.videoWidth, vr.height / video.videoHeight);
            const offX = (vr.width - video.videoWidth * escala) / 2, offY = (vr.height - video.videoHeight * escala) / 2;
            const x = Math.max(0, (gr.left - vr.left - offX) / escala), y = Math.max(0, (gr.top - vr.top - offY) / escala);
            return { x: x, y: y, w: Math.min(video.videoWidth - x, gr.width / escala), h: Math.min(video.videoHeight - y, gr.height / escala) };
        }

        function capturarGuiaC() {
            const video = document.getElementById('video-c');
            const { x: sx, y: sy, w: sw, h: sh } = rectGuiaEnVideo();
            // Se reduce si es muy grande y se amplía (hasta 2x) si el recuadro es pequeño, para que el OCR vea letras de buen tamaño
            const factor = Math.min(2, 1600 / sw);
            const lienzo = document.createElement('canvas');
            lienzo.width = Math.round(sw * factor); lienzo.height = Math.round(sh * factor);
            lienzo.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, lienzo.width, lienzo.height);
            return lienzo;
        }

        // Pasa la imagen a blanco y negro puro (umbral de Otsu). Si el fondo es oscuro (precio blanco sobre rojo...), invierte los colores.
        // invertirAlReves=true da la versión contraria: sirve para el recuadro rojo con números blancos dentro de una etiqueta blanca.
        function binarizar(origen, invertirAlReves) {
            const lienzo = document.createElement('canvas');
            lienzo.width = origen.width; lienzo.height = origen.height;
            const ctx = lienzo.getContext('2d');
            ctx.drawImage(origen, 0, 0);
            const img = ctx.getImageData(0, 0, lienzo.width, lienzo.height), d = img.data, total = lienzo.width * lienzo.height;
            const gris = grisConContraste(d, total);
            const umbral = umbralOtsu(gris);
            let oscuros = 0; for (let i = 0; i < total; i++) if (gris[i] <= umbral) oscuros++;
            const invertir = (oscuros > total / 2) !== !!invertirAlReves;
            const negro = new Uint8Array(total);
            for (let i = 0; i < total; i++) negro[i] = ((gris[i] <= umbral) !== invertir) ? 1 : 0;
            lienzo.manchasBorradas = borrarManchasDelBorde(negro, lienzo.width, lienzo.height);
            for (let i = 0; i < total; i++) { const v = negro[i] ? 0 : 255; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
            ctx.putImageData(img, 0, 0);
            return lienzo;
        }

        // Pone en blanco todo lo negro que toca el borde del recuadro (marco de la etiqueta, estantería, recuadro de color...):
        // si se deja, Tesseract lo toma por una imagen y no lee los números que hay dentro.
        // Devuelve la caja de cada mancha borrada (sirve para saber si se ha cortado una cifra del precio).
        function borrarManchasDelBorde(negro, w, h) {
            const pila = new Int32Array(w * h), borradas = [];
            const semillas = [];
            for (let x = 0; x < w; x++) semillas.push(x, (h - 1) * w + x);
            for (let y = 0; y < h; y++) semillas.push(y * w, y * w + w - 1);
            for (const s of semillas) {
                if (!negro[s]) continue;
                let n = 0, x0 = w, y0 = h, x1 = 0, y1 = 0;
                const meter = i => { if (negro[i]) { negro[i] = 0; pila[n++] = i; } };
                meter(s);
                while (n > 0) {
                    const i = pila[--n], x = i % w, y = (i - x) / w;
                    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
                    if (x > 0) meter(i - 1);
                    if (x < w - 1) meter(i + 1);
                    if (i >= w) meter(i - w);
                    if (i < w * (h - 1)) meter(i + w);
                }
                borradas.push({ x0, y0, x1, y1 });
            }
            return borradas;
        }

        // 💾 Guarda en el móvil la última imagen que ha analizado el OCR de precios (para revisar por qué no lee una etiqueta)
        let ultimaImagenPrecio = null;
        function guardarImagenPrecio() {
            const lienzo = ultimaImagenPrecio || (streamC ? capturarGuiaC() : null);
            if (!lienzo) return;
            lienzo.toBlob(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'etiqueta-' + new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-') + '.png';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                document.getElementById('estado-c').textContent = "💾 Imagen guardada en Descargas";
            }, 'image/png');
        }

        // Las lecturas van en cola para que no se mezclen los ajustes de una con otra
        function reconocerOCR(lienzo, caracteres, modoPagina) {
            const tarea = colaOCR.then(async () => {
                const worker = await cargarOCR();
                await worker.setParameters({ tessedit_char_whitelist: caracteres, tessedit_pageseg_mode: modoPagina });
                return (await worker.recognize(lienzo)).data;
            });
            colaOCR = tarea.catch(() => {});
            return tarea;
        }

        // Copia un trozo del lienzo escalado a la altura indicada y con margen blanco (Tesseract lee mejor letras de ~50 px)
        function recortar(lienzo, x, y, w, h, altoFinal) {
            const f = altoFinal / h, margen = Math.round(altoFinal * 0.2);
            const c = document.createElement('canvas');
            c.width = Math.round(w * f) + margen * 2; c.height = Math.round(h * f) + margen * 2;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(lienzo, x, y, w, h, margen, margen, Math.round(w * f), Math.round(h * f));
            return c;
        }

        // Se ignora lo que toca el borde del recuadro o casi lo ocupa entero de alto: suelen ser bordes de la etiqueta,
        // rayas o números cortados. (La "confianza" de Tesseract no sirve aquí: con solo cifras permitidas da 0 a lecturas buenas.)
        function palabrasFiables(palabras, lienzo) {
            const margen = 3;
            return (palabras || []).filter(w => {
                const b = w.bbox;
                return b.x0 > margen && b.y0 > margen && b.x1 < lienzo.width - margen && b.y1 < lienzo.height - margen && (b.y1 - b.y0) < lienzo.height * 0.85;
            });
        }

        function palabraMasAlta(palabras, lienzo) {
            return palabrasFiables(palabras, lienzo).filter(w => /\d/.test(w.text)).sort((a, b) => (b.bbox.y1 - b.bbox.y0) - (a.bbox.y1 - a.bbox.y0))[0] || null;
        }

        // variante 0: imagen tal cual; 1: blanco y negro; 2: blanco y negro invertido.
        // Devuelve { precio, texto } (texto: lo que ha leído el OCR, para mostrarlo en pantalla)
        async function leerPrecioC(variante) {
            const original = capturarGuiaC();
            ultimaImagenPrecio = original;
            return leerPrecioDeLienzo(original, variante);
        }

        // Lo mismo sobre una imagen ya hecha (las fotos del Chequeo rápido)
        async function leerPrecioDeLienzo(original, variante) {
            const lienzo = variante ? binarizar(original, variante === 2) : original;
            const data = await reconocerOCR(lienzo, '0123456789,.€', '11');
            const texto = (data.words || []).map(w => w.text).join(' ') || '(nada)';
            precioCortado = false;
            const precio = await precioDeLectura(lienzo, data);
            return { precio, texto, cortado: precioCortado };
        }

        async function precioDeLectura(lienzo, data) {
            // Precio con los céntimos pequeños al lado (arriba como "2⁴⁹" o abajo junto al €, como "74 €/95"): Tesseract no los separa bien.
            // Se separan por tamaño las cifras grandes (euros) de las pequeñas (céntimos) y se lee cada parte por separado.
            // Primero en todo el recuadro; si no sale, alrededor del número más alto que haya visto Tesseract.
            let partes = separarEurosYCents(lienzo, null);
            // Si se distinguen euros y céntimos, manda la lectura por partes: leyendo la etiqueta entera Tesseract confunde cifras
            // ("2'39€" → "739€"). La lectura entera queda para cuando no hay partes o no se leen
            // (nunca en un precio sin céntimos: tomaría "185€" por 1,85).
            if (partes) {
                const porPartes = await leerPorPartes(lienzo, data, partes);
                if (porPartes || partes.entero) return porPartes;
            }
            // Las cifras de los euros marcan el tamaño del precio: si Tesseract no ha visto el número grande, lo que lea mucho más pequeño es el precio por kilo
            const precio = extraerPrecio(data, lienzo, partes ? partes.euros.y1 - partes.euros.y0 : 0);
            if (precio) { precioCortado = false; return precio; }
            if (partes || precioCortado) return null;
            const grande = palabraMasAlta(data.words, lienzo);
            if (grande && grande.bbox.y1 - grande.bbox.y0 >= 20) partes = separarEurosYCents(lienzo, grande.bbox);
            return partes ? leerPorPartes(lienzo, data, partes) : null;
        }

        async function leerPorPartes(lienzo, data, partes) {
            let euros = await leerCifras(lienzo, partes.euros, partes.cifrasEuros, 0.1, 60);
            if (partes.entero) return /^\d{1,4}$/.test(euros) && parseInt(euros, 10) > 0 ? parseInt(euros, 10) + '.00' : null;
            let cents = await leerCifras(lienzo, partes.cents, partes.cifrasCents, 0.15, 50);
            if (!(/^\d{1,3}$/.test(euros) && /^\d{2}$/.test(cents))) {
                // Si una parte no sale, vale el precio leído entero de corrido ("175" = 1,75): primero la palabra que ya ha visto
                // Tesseract y, si no, una lectura solo de la zona del precio (el "1" ancho de algunas etiquetas solo lo reconoce así).
                // Tiene que tener tantas cifras como los euros más dos y no contradecir la parte que sí se ha leído.

        let precioCortado = false; // lo pone separarEurosYCents cuando el precio se sale del recuadro (para avisar en pantalla)

            const base = altas.map(m => m.y1).sort((a, c) => a - c)[Math.floor(altas.length / 2)];
            const coma = altas.length >= 3 && manchas.find(m => m.alto >= H * 0.12 && m.alto < H * 0.45 && m.ancho <= m.alto * 0.9 && m.y1 >= base + H * 0.05 && m.y0 >= base - H * 0.35 &&
                altas.some(a => a.x1 <= m.x0 + H * 0.05 && m.x0 - a.x1 < H * 0.4) && altas.some(a => a.x0 >= m.x1 - H * 0.05 && a.x0 - m.x1 < H * 0.4));

        // Pasa la imagen a gris de la forma que más separa la tinta del fondo. El gris normal (luminancia) deja muy parecidos

        // Qué parte de la variación de tonos explica el corte de Otsu (1 = solo hay dos tonos)

        // Elige el precio de la etiqueta: el número con forma de precio y letra más grande (descarta el precio por kilo, que es pequeño)
        function extraerPrecio(data, lienzo, altoCifrasGrandes = 0) {
            const palabras = palabrasFiables(data.words, lienzo).map(w => ({ t: w.text.replace(/[€\s]/g, ''), euro: /\d€$/.test(w.text.trim()), h: w.bbox.y1 - w.bbox.y0, x0: w.bbox.x0, x1: w.bbox.x1, y0: w.bbox.y0 })).filter(w => w.t);

        // Chequeo: tras leer el código, lee el precio una y otra vez (rotando imagen normal, blanco y negro e invertida);

        async function buclePrecioC(miSesion) {
            const estadoC = document.getElementById('estado-c');

                if (Date.now() - ultimaActividadC > PAUSA_CAMARA_MS) { pausarCamaraC(); return; }

                try { lectura = await leerPrecioC(vuelta++ % 3); }
                catch (e) { if (miSesion === sesionC) estadoC.textContent = "⚠️ " + e.message + " — pulsa Teclear"; return; }

                let precio = lectura.precio;
                if (!estadoC.textContent.startsWith('💾')) estadoC.textContent = avisoCifra || (lectura.cortado ? "⚠️ El precio se sale del recuadro: amplía el Área o aléjate" : "💶 Enfoca el PRECIO");
                lecturaC.textContent = precio ? precio.replace('.', ',') + ' €' : '';

                    const largo = historial.find(p => p && p !== precio && p.endsWith(precio));
                    if (largo) precio = largo;

                    if (nuestro > 0 && nuestro.toFixed(2) !== precio && nuestro.toFixed(2).endsWith(precio)) {

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: Arial, sans-serif; padding: 6px; text-align: center; 
            background-color: #f4f6f8; display: flex; flex-direction: column; min-height: 100vh; 
        }
        .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 16px; }
        .btn-actualizar { padding: 4px 8px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        #estado { font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 2px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        .resultado { 
            margin-top: auto; margin-bottom: 4px; padding: 8px 10px; border: 2px solid #222222; 
            border-radius: 12px; background-color: #ffffff; display: flex; flex-direction: column; gap: 6px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); height: auto; 
        }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; }
        .descripcion-producto { font-size: 18px; font-weight: 800; line-height: 1.25; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 16px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; }
        .etiqueta-stock { font-size: 12px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; }

        /* ESTILOS PARA LA LISTA DE BÚSQUEDA */
        .lista-resultados { 
            list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; text-align: left; 
            border: 1px solid #dee2e6; border-radius: 6px;
        }
        .item-resultado { 
            padding: 10px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; 
        }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 14px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 12px; color: #6c757d; font-weight: bold; }

        #video-container {
            width: 100%;
            max-width: 320px;
            max-height: 250px;
            background: #000;
            margin: 4px auto;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: none;
        }
        
        #controles-video {
            padding: 6px;
            background: rgba(0,0,0,0.7);
            text-align: left;
            display: none;
        }
        
        #selector-camara { width: 100%; max-width: 250px; padding: 4px; border-radius: 4px; font-size: 12px; }

        video { width: 100%; height: auto; display: block; object-fit: cover; }

        .caja-interfaz { padding: 4px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; }
        
        .grupo-input-camara { 
            display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; 
        }
        
        .btn-ajustes { 
            flex: 0 0 50px; height: 50px; background-color: #6c757d; color: white; border: none; 
            border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; padding: 2px;
        }
        .icono-ajustes { font-size: 18px; line-height: 1; }
        .texto-ajustes { font-size: 10px; font-weight: bold; margin-top: 2px; }

        #inputCodigo { 
            flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 14px; text-align: center; 
            border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; 
        }
        
        .btn-camara-cuadrado { 
            flex: 1; min-width: 0; height: 50px; background-color: #17a2b8; color: white; border: none; 
            border-radius: 6px; font-size: 15px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; gap: 4px;
        }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado { display: none !important; }
    </style>
</head>
<body>

    <div class="cabecera-top">
        <h1>Inventario</h1>
        <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sincronizar</button>
    </div>

    <div id="estado">Conectando...</div>

    <div id="video-container">
        <div id="controles-video">
            <select id="selector-camara" onchange="cambiarCamaraManual()">
                <option value="">Cámara Automática</option>
            </select>
        </div>
        
        <video id="video-preview" playsinline autoplay muted></video>
        <button onclick="cerrarCamara()" style="position: absolute; bottom: 5px; right: 5px; background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✕ Cerrar</button>
    </div>

    <div id="resultado" class="resultado">
        Esperando código o descripción...
    </div>

    <input type="file" id="captura-foto" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoDeCamara(event)">

    <div class="caja-interfaz">
        <div class="grupo-input-camara">
            <button id="btn-ajustes" class="btn-ajustes" onclick="abrirConfiguracionCamara()" title="Configuración de cámara">
                <span class="icono-ajustes">⚙️</span>
                <span id="texto-so" class="texto-ajustes">OS</span>
            </button>
            
            <input type="text" id="inputCodigo" placeholder="EAN o descripción..." autocomplete="off">
            
            <button class="btn-camara-cuadrado" onclick="iniciarEscanerSegunOS()" title="Escanear con Cámara">📷 CÁMARA</button>
        </div>
    </div>

    <script>
        let inventario = {};
        let codeReader = null;
        let camaraManualId = null; 

        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');
        const fileInput = document.getElementById('captura-foto');

        const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);

        inputCodigo.addEventListener('focus', () => document.body.classList.add('modo-teclado'));
        inputCodigo.addEventListener('blur', () => document.body.classList.remove('modo-teclado'));

        function confirmarEscaneo() {
            try {
                if (navigator.vibrate) navigator.vibrate(100);
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                }
            } catch (e) {}
        }

        function formatearFechaPersonalizada(objetoFecha) {
            const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            const diaNombre = diasSemana[objetoFecha.getDay()];
            const dia = String(objetoFecha.getDate()).padStart(2, '0');
            const mes = String(objetoFecha.getMonth() + 1).padStart(2, '0');
            const horas = String(objetoFecha.getHours()).padStart(2, '0');
            const minutos = String(objetoFecha.getMinutes()).padStart(2, '0');
            
            return `${diaNombre} ${dia}/${mes} ${horas}:${minutos}`;
        }

        function cargarInventario() {
            estadoDiv.innerHTML = "Sincronizando...";
            estadoDiv.style.color = "blue";

            const url = 'TIENDA.csv?' + new Date().getTime();

            fetch(url)
                .then(response => {
                    const lastModifiedHeader = response.headers.get('Last-Modified');
                    const fechaRealArchivo = lastModifiedHeader ? new Date(lastModifiedHeader) : new Date();
                    return response.text().then(textoCsv => ({ textoCsv, fechaRealArchivo }));
                })
                .then(({ textoCsv, fechaRealArchivo }) => {
                    Papa.parse(textoCsv, {
                        header: false,
                        delimiter: ";",
                        skipEmptyLines: true,
                        complete: function(results) {
                            inventario = {};
                            let contador = 0;
                            
                            results.data.forEach(fila => {
                                if(fila.length >= 3) {
                                    let ean = fila[0] ? fila[0].trim() : "";
                                    let desc = fila[1] ? fila[1].trim() : "";
                                    let stock = fila[2] ? fila[2].trim() : "";
                                    
                                    let val3 = fila[3] ? fila[3].trim() : "-";
                                    let val4 = fila[4] ? fila[4].trim() : "-";
                                    let precio = "-";
                                    let rayon = "-";

                                    if (/[a-zA-Z]/.test(val3) || val3.includes(" ")) {
                                        rayon = val3;
                                        precio = val4;
                                    } else {
                                        precio = val3;
                                        rayon = val4;
                                    }
                                    
                                    let fecha = fila[5] ? fila[5].trim() : "-";
                                    let ventas = (fila.length > 6 && fila[6]) ? fila[6].trim() : "0";
                                    
                                    if(ean) {
                                        inventario[ean] = { descripcion: desc, stock, precio, rayon, fecha, ventas };
                                        contador++;
                                    }
                                }
                            });
                            
                            const fechaFormateada = formatearFechaPersonalizada(fechaRealArchivo);
                            estadoDiv.innerHTML = `
                                ¡Base de datos lista: ${contador} artículos!
                                <span class="texto-fecha">${fechaFormateada}</span>
                            `;
                            estadoDiv.style.color = "#28a745";

                            procesarUrlConCodigo();
                        }
                    });
                })
                .catch(err => {
                    estadoDiv.innerText = "Error al cargar datos.";
                    estadoDiv.style.color = "red";
                });
        }

        // LÓGICA DEFINITIVA PARA 11, 12 y 13 DÍGITOS
        function procesarBusqueda(terminoBusqueda) {
            let termino = terminoBusqueda.trim().toUpperCase();
            if (!termino) return;

            let eanDetectado = null;
            
            // 1. Comprobamos todas las combinaciones posibles de ceros a la izquierda
            if (inventario.hasOwnProperty(termino)) {
                eanDetectado = termino;
            } else if (/^\d+$/.test(termino)) {
                // Eliminamos todos los ceros de la izquierda como "denominador común"
                let termLimpio = termino.replace(/^0+/, '');
                
                if (inventario.hasOwnProperty(termLimpio)) {
                    eanDetectado = termLimpio; // Encontrado como 11 dígitos
                } else if (inventario.hasOwnProperty(termLimpio.padStart(12, '0'))) {
                    eanDetectado = termLimpio.padStart(12, '0'); // Encontrado como 12 dígitos
                } else if (inventario.hasOwnProperty(termLimpio.padStart(13, '0'))) {
                    eanDetectado = termLimpio.padStart(13, '0'); // Encontrado como 13 dígitos
                }
            }

            if (eanDetectado) {
                mostrarArticuloCompleto(eanDetectado);
                return;
            }

            // 2. Si no es EAN, buscar en la descripción
            let palabras = termino.split(" ").filter(t => t.length > 0);
            let coincidencias = [];

            for (const [ean, articulo] of Object.entries(inventario)) {
                let descUpper = articulo.descripcion.toUpperCase();
                let coincideTodo = palabras.every(palabra => descUpper.includes(palabra));
                if (coincideTodo) {
                    coincidencias.push({ ean: ean, articulo: articulo });
                }
            }

            // 3. Resultados de texto y VACIADO DEL CAMPO (SOLUCIÓN A TU ERROR)
            if (coincidencias.length === 0) {
                resultadoDiv.innerHTML = `
                    <h3 style="color: #dc3545; margin: 0 0 4px 0; font-size: 16px;">No encontrado</h3>
                    <p style="font-size: 15px;">No hay coincidencias para <strong>${termino}</strong>.</p>
                `;
                inputCodigo.value = ""; // VACIADO SI FALLA
            } else if (coincidencias.length === 1) {
                mostrarArticuloCompleto(coincidencias[0].ean);
            } else {
                let htmlLista = `<h3 style="margin: 0 0 8px 0; font-size: 14px; color: #007bff;">${coincidencias.length} artículos encontrados:</h3>`;
                htmlLista += `<ul class="lista-resultados">`;
                
                coincidencias.forEach(c => {
                    htmlLista += `
                        <li class="item-resultado" onclick="mostrarArticuloCompleto('${c.ean}')">
                            <span class="item-desc">${c.articulo.descripcion}</span>
                            <span class="item-ean">EAN: ${c.ean}</span>
                        </li>
                    `;
                });
                
                htmlLista += `</ul>`;
                resultadoDiv.innerHTML = htmlLista;
                inputCodigo.value = ""; // VACIADO SI HAY MÚLTIPLES
            }
            
            inputCodigo.blur();
        }

        // PINTAR FICHA DEL PRODUCTO SELECCIONADO
        function mostrarArticuloCompleto(ean) {
            let articulo = inventario[ean];
            resultadoDiv.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 2px;">
                    <p class="titulo-encontrado">¡Artículo encontrado!</p>
                    <p class="texto-ean"><strong>EAN:</strong> ${ean}</p>
                    <div class="descripcion-producto">${articulo.descripcion}</div>
                </div>
                <div class="panel-secundario">
                    <div class="item-secundario"><span class="etiqueta-secundaria">Rayón</span><span class="valor-secundario">${articulo.rayon}</span></div>
                    <div class="item-secundario"><span class="etiqueta-secundaria">P.V.P.</span><span class="valor-secundario">${articulo.precio}</span></div>
                    <div class="item-secundario"><span class="etiqueta-secundaria">Últ. Recep.</span><span class="valor-secundario">${articulo.fecha}</span></div>
                    <div class="item-secundario"><span class="etiqueta-secundaria">Ventas</span><span class="valor-secundario">${articulo.ventas}</span></div>
                </div>
                <div class="caja-stock">
                    <p class="etiqueta-stock">STOCK DISPONIBLE</p>
                    <p class="numero-stock">${articulo.stock}</p>
                </div>
            `;
            inputCodigo.value = ""; // VACIADO SI TIENE ÉXITO
        }

        function procesarUrlConCodigo() {
            const parametros = new URLSearchParams(window.location.search);
            const codigoDesdeApp = parametros.get('codigo');
            if (codigoDesdeApp) {
                confirmarEscaneo();
                procesarBusqueda(codigoDesdeApp.trim());
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function procesarFotoDeCamara(event) {
            const file = event.target.files[0];
            if (!file) return;

            resultadoDiv.innerHTML = "<p>Analizando foto...</p>";
            if (!codeReader) codeReader = new ZXing.BrowserBarcodeReader();
            
            const imageURL = URL.createObjectURL(file);
            const imgElement = document.createElement('img');
            imgElement.src = imageURL;
            
            imgElement.onload = () => {
                codeReader.decodeFromImageElement(imgElement)
                    .then(result => {
                        confirmarEscaneo();
                        procesarBusqueda(result.text.trim());
                    })
                    .catch(err => {
                        resultadoDiv.innerHTML = `<h3 style="color: #dc3545;">No se detectó código</h3><p>Intenta enfocar mejor o acércate.</p>`;
                        inputCodigo.value = "";
                    });
            };
        }

        function iniciarEscanerSegunOS() {
            if (esIOS && !camaraManualId) {
                fileInput.click();
            } else {
                iniciarCamaraVideo();
            }
        }

        function procesarResultadoZXing(result, err) {
            if (result) {
                confirmarEscaneo();
                procesarBusqueda(result.text.trim());
                cerrarCamara();
            }
        }

        async function iniciarCamaraVideo() {
            const container = document.getElementById('video-container');
            container.style.display = 'block';

            if (!codeReader) codeReader = new ZXing.BrowserBarcodeReader();

            try {
                if (camaraManualId) {
                    codeReader.decodeFromVideoDevice(camaraManualId, 'video-preview', procesarResultadoZXing);
                    return; 
                }

                const videoInputDevices = await codeReader.listVideoInputDevices();
                const selectedDeviceId = videoInputDevices.length > 0 ? videoInputDevices[videoInputDevices.length - 1].deviceId : undefined;
                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video-preview', procesarResultadoZXing);
                
            } catch (err) {
                alert("Error al iniciar la cámara: " + err);
                container.style.display = 'none';
            }
        }

        async function abrirConfiguracionCamara() {
            if (!codeReader) codeReader = new ZXing.BrowserBarcodeReader();
            
            try {
                const dispositivos = await codeReader.listVideoInputDevices();
                const selector = document.getElementById('selector-camara');
                
                selector.innerHTML = '<option value="">Cámara Automática</option>';
                dispositivos.forEach((disp, index) => {
                    const option = document.createElement('option');
                    option.value = disp.deviceId;
                    option.text = disp.label || `Cámara ${index + 1}`;
                    if (disp.deviceId === camaraManualId) option.selected = true;
                    selector.appendChild(option);
                });

                document.getElementById('controles-video').style.display = 'block';
                iniciarCamaraVideo();
            } catch (error) {
                alert("No se pudo acceder al listado de cámaras.");
            }
        }

        function cambiarCamaraManual() {
            const selector = document.getElementById('selector-camara');
            camaraManualId = selector.value === "" ? null : selector.value;
            if (codeReader) codeReader.reset();
            iniciarCamaraVideo();
        }

        function cerrarCamara() {
            if (codeReader) codeReader.reset();
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('controles-video').style.display = 'none';
        }

        inputCodigo.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                procesarBusqueda(inputCodigo.value.trim());
            }
        });

        window.onload = () => {
            const textoSO = document.getElementById('texto-so');
            if (esIOS) {
                textoSO.innerText = "iPhone";
            } else {
                textoSO.innerText = "Android";
            }
            cargarInventario();
        };
    </script>
</body>
</html>

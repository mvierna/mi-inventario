<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: Arial, sans-serif; padding: 6px; text-align: center; 
            background-color: #f4f6f8; display: flex; flex-direction: column; min-height: 100vh; 
        }
        .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 16px; }
        .btn-actualizar { padding: 4px 8px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        #estado { font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 2px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        /* Resultados a mayor tamaño */
        .resultado { 
            margin-top: auto; margin-bottom: 4px; padding: 8px 10px; border: 2px solid #222222; 
            border-radius: 12px; background-color: #ffffff; display: flex; flex-direction: column; gap: 6px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); height: auto; 
        }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; }
        .descripcion-producto { font-size: 18px; font-weight: 800; line-height: 1.25; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .etiqueta-secundaria { font-size: 11px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 18px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; }
        .etiqueta-stock { font-size: 12px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; }

        /* Visor de cámara */
        #video-container {
            width: 100%;
            max-width: 320px;
            max-height: 200px;
            background: #000;
            margin: 4px auto;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: none;
        }
        video { width: 100%; height: auto; display: block; }

        /* Interfaz inferior adaptada */
        .caja-interfaz { padding: 4px; background-color: #ffffff; border-top: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .grupo-input-camara { display: flex; gap: 6px; width: 100%; max-width: 350px; justify-content: center; align-items: center; }
        
        #inputCodigo { padding: 10px; font-size: 16px; flex: 1; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        
        /* Botón de cámara cuadrado a la derecha */
        .btn-camara-cuadrado { 
            width: 46px; height: 46px; background-color: #17a2b8; color: white; border: none; 
            border-radius: 6px; font-size: 20px; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; flex-shrink: 0; font-weight: bold; 
        }

        .texto-instruccion { font-weight: bold; font-size: 10px; margin: 0; color: #495057; }
        p { margin: 2px 0; }
        
        body.modo-teclado .cabecera-top, body.modo-teclado #estado { display: none !important; }
    </style>
</head>
<body>

    <div class="cabecera-top">
        <h1>Inventario</h1>
        <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sincronizar</button>
    </div>

    <div id="estado">Conectando...</div>

    <div id="resultado" class="resultado">
        Esperando código...
    </div>

    <!-- Contenedor de video -->
    <div id="video-container">
        <video id="video-preview"></video>
        <button onclick="cerrarCamara()" style="position: absolute; top: 5px; right: 5px; background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✕ Cerrar</button>
    </div>

    <!-- Interfaz inferior: Input a la izquierda y botón cuadrado a la derecha -->
    <div class="caja-interfaz">
        <div class="grupo-input-camara">
            <input type="text" id="inputCodigo" placeholder="Escanea o escribe aquí..." autocomplete="off">
            <button class="btn-camara-cuadrado" onclick="iniciarCamaraZXing()" title="Escanear con Cámara">📷</button>
        </div>
    </div>

    <script>
        let inventario = {};
        let codeReader = null;

        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');

        inputCodigo.addEventListener('focus', () => document.body.classList.add('modo-teclado'));
        inputCodigo.addEventListener('blur', () => document.body.classList.remove('modo-teclado'));

        function confirmarEscaneo() {
            try {
                if (navigator.vibrate) navigator.vibrate(100);
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                }
            } catch (e) {}
        }

        function formatearFechaPersonalizada(objetoFecha) {
            const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            const diaNombre = diasSemana[objetoFecha.getDay()];
            const dia = String(objetoFecha.getDate()).padStart(2, '0');
            const mes = String(objetoFecha.getMonth() + 1).padStart(2, '0');
            const horas = String(objetoFecha.getHours()).padStart(2, '0');
            const minutos = String(objetoFecha.getMinutes()).padStart(2, '0');
            
            return `${diaNombre} ${dia}/${mes} ${horas}:${minutos}`;
        }

        function cargarInventario() {
            estadoDiv.innerHTML = "Sincronizando...";
            estadoDiv.style.color = "blue";

            const url = 'TIENDA.csv?' + new Date().getTime();

            fetch(url)
                .then(response => {
                    const lastModifiedHeader = response.headers.get('Last-Modified');
                    const fechaRealArchivo = lastModifiedHeader ? new Date(lastModifiedHeader) : new Date();
                    return response.text().then(textoCsv => ({ textoCsv, fechaRealArchivo }));
                })
                .then(({ textoCsv, fechaRealArchivo }) => {
                    Papa.parse(textoCsv, {
                        header: false,
                        delimiter: ";",
                        skipEmptyLines: true,
                        complete: function(results) {
                            inventario = {};
                            let contador = 0;
                            
                            results.data.forEach(fila => {
                                if(fila.length >= 3) {
                                    let ean = fila[0] ? fila[0].trim() : "";
                                    let desc = fila[1] ? fila[1].trim() : "";
                                    let stock = fila[2] ? fila[2].trim() : "";
                                    let precio = fila[3] ? fila[3].trim() : "-";
                                    let fecha = fila[4] ? fila[4].trim() : "-";
                                    let ventas = fila[5] ? fila[5].trim() : "0";
                                    
                                    if(ean) {
                                        inventario[ean] = { descripcion: desc, stock, precio, fecha, ventas };
                                        contador++;
                                    }
                                }
                            });
                            
                            const fechaFormateada = formatearFechaPersonalizada(fechaRealArchivo);
                            estadoDiv.innerHTML = `
                                ¡Base de datos lista: ${contador} artículos!
                                <span class="texto-fecha">${fechaFormateada}</span>
                            `;
                            estadoDiv.style.color = "#28a745";
                        }
                    });
                })
                .catch(err => {
                    estadoDiv.innerText = "Error al cargar datos.";
                    estadoDiv.style.color = "red";
                });
        }

        function buscarCodigo(codigoEscaneado) {
            if (!codigoEscaneado) return;

            if (inventario.hasOwnProperty(codigoEscaneado)) {
                let articulo = inventario[codigoEscaneado];
                resultadoDiv.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 2px;">
                        <p class="titulo-encontrado">¡Artículo encontrado!</p>
                        <p class="texto-ean"><strong>EAN:</strong> ${codigoEscaneado}</p>
                        <div class="descripcion-producto">${articulo.descripcion}</div>
                    </div>
                    <div class="panel-secundario">
                        <div class="item-secundario"><span class="etiqueta-secundaria">P.V.P.</span><span class="valor-secundario">${articulo.precio}</span></div>
                        <div class="item-secundario"><span class="etiqueta-secundaria">Últ. Recep.</span><span class="valor-secundario">${articulo.fecha}</span></div>
                        <div class="item-secundario"><span class="etiqueta-secundaria">Ventas Recep.</span><span class="valor-secundario">${articulo.ventas} u.</span></div>
                    </div>
                    <div class="caja-stock">
                        <p class="etiqueta-stock">STOCK DISPONIBLE</p>
                        <p class="numero-stock">${articulo.stock}</p>
                    </div>
                `;
            } else {
                resultadoDiv.innerHTML = `
                    <h3 style="color: #dc3545; margin: 0 0 4px 0; font-size: 16px;">No encontrado</h3>
                    <p style="font-size: 15px;">El código <strong>${codigoEscaneado}</strong> no está en la base de datos.</p>
                `;
            }
            inputCodigo.value = "";
            inputCodigo.focus();
        }

        async function iniciarCamaraZXing() {
            const container = document.getElementById('video-container');
            container.style.display = 'block';

            if (!codeReader) {
                codeReader = new ZXing.BrowserBarcodeReader();
            }

            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                const selectedDeviceId = videoInputDevices.length > 0 ? videoInputDevices[videoInputDevices.length - 1].deviceId : undefined;

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video-preview', (result, err) => {
                    if (result) {
                        confirmarEscaneo();
                        buscarCodigo(result.text.trim());
                        cerrarCamara();
                    }
                });
            } catch (err) {
                alert("Error al iniciar la cámara: " + err);
                container.style.display = 'none';
            }
        }

        function cerrarCamara() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('video-container').style.display = 'none';
        }

        inputCodigo.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarCodigo(inputCodigo.value.trim());
            }
        });

        window.onload = cargarInventario;
    </script>
</body>
</html>

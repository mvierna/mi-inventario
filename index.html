<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías: Lector CSV, Lector Códigos y MOTOR OCR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 6px; text-align: center; 
            background-color: #f4f6f8; display: flex; flex-direction: column; 
            min-height: 100dvh; overflow-y: auto; 
        }
        
        #aviso-rotacion {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            background: #f4f6f8; color: #111; z-index: 9999; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        #aviso-rotacion h2 { color: #dc3545; font-size: 22px; margin-bottom: 8px; }
        
        @media screen and (orientation: landscape) {
            body > *:not(#aviso-rotacion) { display: none !important; }
            #aviso-rotacion { display: flex; }
        }

        .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 16px; font-weight: 800; }
        .controles-cabecera { display: flex; gap: 6px; }
        .btn-listas { padding: 6px 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-actualizar { padding: 6px 10px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        #estado { font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 2px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        .resultado { 
            margin-top: auto; margin-bottom: 4px; padding: 10px; border: 2px solid #222222; 
            border-radius: 12px; background-color: #ffffff; display: flex; flex-direction: column; gap: 6px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: auto; 
        }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; }
        .descripcion-producto { font-size: 18px; font-weight: 800; line-height: 1.25; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 16px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; border: none; }
        .etiqueta-stock { font-size: 12px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 46px; font-weight: 900; margin: 0; line-height: 1; color: #ffffff; }

        .panel-acciones { margin-top: 8px; }
        .btn-accion-unica { 
            width: 100%; padding: 14px; background-color: #ff9800; color: white; border: none; 
            border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 0 #e65100; transition: transform 0.1s;
        }
        .btn-accion-unica:active { transform: translateY(4px); box-shadow: none; }
        
        .panel-cantidad { display: none; flex-direction: row; gap: 8px; margin-top: 8px; }
        .input-cantidad { 
            flex: 1; padding: 12px; border: 3px solid #ff9800; border-radius: 8px; 
            font-size: 22px; text-align: center; font-weight: bold; outline: none; background-color: white; color: #111;
        }
        .btn-confirmar { 
            padding: 12px 24px; background-color: #28a745; color: white; 
            border: none; border-radius: 8px; font-weight: 900; font-size: 18px; cursor: pointer;
        }

        .lista-resultados { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; text-align: left; border: 1px solid #dee2e6; border-radius: 6px; }
        .item-resultado { padding: 10px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 14px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 12px; color: #6c757d; font-weight: bold; }

        #video-container { width: 100%; max-width: 320px; max-height: 250px; background: #000; margin: 4px auto; border-radius: 6px; overflow: hidden; position: relative; display: none; }
        #controles-video { padding: 6px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; }
        #selector-camara { width: 100%; max-width: 200px; padding: 6px; border-radius: 4px; font-size: 12px; background: white; color: black; border: 1px solid #ccc; }
        video { width: 100%; height: auto; display: block; object-fit: cover; }

        .caja-interfaz { padding: 6px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        
        /* BOTONES DE MODOS */
        .contenedor-modos { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-modo {
            flex: 1; padding: 12px 6px; color: white; border: none; border-radius: 6px; 
            font-weight: 900; font-size: 12px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: all 0.2s;
        }
        .btn-modo:active { transform: translateY(3px); box-shadow: none !important; }
        
        #btn-modo-rapido { background-color: #6c757d; }
        #btn-modo-rapido.activo { background-color: #ffc107; color: #000; box-shadow: 0 3px 0 #d39e00; }
        
        #btn-modo-chequeo { background-color: #6c757d; }
        #btn-modo-chequeo.activo { background-color: #9c27b0; color: #fff; box-shadow: 0 3px 0 #6a1b9a; }

        .grupo-input-camara { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; }
        .btn-teclado { flex: 0 0 50px; height: 50px; background-color: #6c757d; color: white; border: none; border-radius: 6px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #inputCodigo { flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 16px; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        .btn-camara-cuadrado { flex: 0 0 90px; height: 50px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }

        /* TECLADO VIRTUAL CON NUEVO LAYOUT 75/25 PARA EL BOTÓN BUSCAR */
        #teclado-virtual { display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; background: #f8f9fa; padding: 8px; border-radius: 8px; border: 1px solid #dee2e6; }
        .tecla-v { height: 55px; font-size: 24px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #ccc; color: #111; flex-direction: column; line-height: 1; }
        .tecla-v:active { transform: translateY(2px); box-shadow: none; background: #e9ecef; }
        .tecla-accion { background: #dc3545; color: white; border-color: #b02a37; box-shadow: 0 2px 0 #b02a37; font-size: 18px; grid-column: 4; grid-row: 1 / span 2; height: 100%; }
        .tecla-accion:active { background: #c82333; }
        .tecla-ok { background: #28a745; color: white; border-color: #198754; box-shadow: 0 2px 0 #198754; font-size: 20px; font-weight: 900; grid-column: 2 / span 3; grid-row: 4; height: 100%; letter-spacing: 1px; }
        .tecla-ok:active { background: #218838; }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado { display: none !important; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #f4f6f8; width: 92%; max-height: 85dvh; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111; }
        .btn-cerrar-modal { background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .input-email-config { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 6px; margin-bottom: 12px; font-size: 16px; font-weight: bold; outline: none; text-align: center; }
        .modal-body { overflow-y: auto; flex: 1; background: white; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 10px; }
        .item-lista-guardada { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #dee2e6; align-items: center; }
        .item-lista-guardada:last-child { border-bottom: none; }
        .item-lista-info { display: flex; flex-direction: column; text-align: left; flex: 1;}
        .item-desc-modal { font-size: 15px; font-weight: bold; color: #111; }
        .item-detalle-modal { font-size: 13px; color: #666; margin-top: 2px; }
        .item-cant-modal { font-size: 20px; font-weight: 900; color: #ff9800; margin-left: 10px; margin-right: 15px; }
        .btn-borrar-item { background: #dc3545; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px;}
        
        .modal-footer { display: flex; gap: 6px; justify-content: space-between; }
        .btn-footer { flex: 1; padding: 14px 6px; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; color: white; cursor: pointer; text-transform: uppercase; }
        
        .btn-sync-drive { background: #007bff; transition: background 0.3s; }
        .btn-sync-drive.loading { background: #6c757d; pointer-events: none; opacity: 0.8; }
        
        /* OVERLAY CARGA OCR */
        #ocr-loading {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; color: white;
        }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #9c27b0; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="aviso-rotacion">
        <h2>⚠️ Gira el dispositivo</h2>
        <p>El escáner de códigos y la interfaz solo funcionan correctamente en modo vertical.</p>
    </div>

    <div id="ocr-loading">
        <div class="spinner"></div>
        <h3 style="margin:0;">Analizando etiqueta...</h3>
        <p style="font-size: 14px; color: #ccc;">La IA está buscando el precio</p>
    </div>

    <div class="cabecera-top">
        <h1>Inventario</h1>
        <div class="controles-cabecera">
            <button class="btn-listas" onclick="verListas()">📋 Lista</button>
            <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sinc</button>
        </div>
    </div>

    <div id="estado">Conectando...</div>

    <div id="video-container">
        <div id="controles-video">
            <select id="selector-camara" onchange="cambiarCamaraManual()">
                <option value="">Detectando cámaras...</option>
            </select>
            <button onclick="cerrarCamara()" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✕ Cerrar</button>
        </div>
        <video id="video-preview" playsinline autoplay muted></video>
    </div>

    <div id="resultado" class="resultado">
        Esperando código...
    </div>

    <!-- Inputs de cámara ocultos -->
    <input type="file" id="captura-foto" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoDeCamara(event)">
    <input type="file" id="captura-precio-ocr" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoOCR(event)">

    <div class="caja-interfaz">
        <div class="contenedor-modos">
            <button id="btn-modo-rapido" class="btn-modo" onclick="activarModo('rapido')">⚡ MODO 1</button>
            <button id="btn-modo-chequeo" class="btn-modo" onclick="activarModo('chequeo')">🕵️ CHEQUEO PVP</button>
        </div>
        
        <div class="grupo-input-camara">
            <button class="btn-teclado" onclick="toggleTecladoVirtual()">🔢</button>
            <input type="text" id="inputCodigo" placeholder="Escribe, escanea o EAN..." autocomplete="off">
            <button class="btn-camara-cuadrado" onclick="iniciarEscanerSegunOS()">📷 CÁMARA</button>
        </div>
        
        <!-- TECLADO VIRTUAL DE 4 COLUMNAS CON LAYOUT 75/25 -->
        <div id="teclado-virtual">
            <button class="tecla-v" onclick="pulsarTecla('7')">7</button>
            <button class="tecla-v" onclick="pulsarTecla('8')">8</button>
            <button class="tecla-v" onclick="pulsarTecla('9')">9</button>
            <button class="tecla-v tecla-accion" onclick="pulsarTecla('DEL')">⌫<br>DEL</button>
            
            <button class="tecla-v" onclick="pulsarTecla('4')">4</button>
            <button class="tecla-v" onclick="pulsarTecla('5')">5</button>
            <button class="tecla-v" onclick="pulsarTecla('6')">6</button>

            <button class="tecla-v" onclick="pulsarTecla('1')">1</button>
            <button class="tecla-v" onclick="pulsarTecla('2')">2</button>
            <button class="tecla-v" onclick="pulsarTecla('3')">3</button>
            <button class="tecla-v" style="grid-column: 4; grid-row: 3;" onclick="pulsarTecla('.')">.</button>

            <button class="tecla-v" style="grid-column: 1; grid-row: 4;" onclick="pulsarTecla('0')">0</button>
            <button id="btn-teclado-ok" class="tecla-v tecla-ok" onclick="pulsarTecla('ENTER')">BUSCAR</button>
        </div>
    </div>

    <div id="modalListas" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lista de Trabajo</h2>
                <button class="btn-cerrar-modal" onclick="cerrarModalListas()">✕</button>
            </div>
            
            <input type="text" id="nombre-usuario-input" class="input-email-config" placeholder="👤 Tu nombre o Nº Terminal..." onchange="guardarUsuario()">
            
            <div id="modal-body-listas" class="modal-body"></div>
            
            <div class="modal-footer">
                <button class="btn-footer" style="background: #dc3545; flex: 0.3;" onclick="borrarListaActual()">🗑</button>
                <button id="btn-drive" class="btn-footer btn-sync-drive" onclick="enviarADrive()">☁️ A Drive</button>
                <button class="btn-footer" style="background: #28a745; flex: 0.8;" onclick="exportarListaCSV()">📥 CSV</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ PEGA AQUÍ LA URL DE TU APPS SCRIPT
        // ==========================================
        const URL_GOOGLE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwa09QI3B2Vb0qd3lCRtkTe0Lcq1VNOaz6zhkuber3fMhnuMPHhYs1QfsdM_6m6sNwV/exec";

        let inventario = {};
        let codeReader = null;
        let camaraManualId = localStorage.getItem('camaraPreferida') || null; 
        
        let ultimoModo = 'teclado'; 
        let modoActivo = 'normal'; // 'normal', 'rapido', 'chequeo'
        let eanChequeoPendiente = null;

        let listaTrabajo = JSON.parse(localStorage.getItem('inventarioListaTrabajo')) || [];
        let usuarioGuardado = localStorage.getItem('inventarioUsuario') || '';
        let inputActivoId = 'inputCodigo';
        let itemActual = { ean: null, esDesconocido: false };

        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');
        const tecladoVirtual = document.getElementById('teclado-virtual');
        const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);

        document.getElementById('nombre-usuario-input').value = usuarioGuardado;

        function guardarUsuario() {
            usuarioGuardado = document.getElementById('nombre-usuario-input').value.trim();
            localStorage.setItem('inventarioUsuario', usuarioGuardado);
        }

        // --- SISTEMA DE MODOS ---
        function activarModo(modo) {
            const btnRapido = document.getElementById('btn-modo-rapido');
            const btnChequeo = document.getElementById('btn-modo-chequeo');
            
            if (modoActivo === modo) {
                // Desactivar el modo actual
                modoActivo = 'normal';
                btnRapido.classList.remove('activo');
                btnChequeo.classList.remove('activo');
                resultadoDiv.innerHTML = "Esperando código...";
            } else {
                // Activar nuevo modo
                if (!usuarioGuardado) {
                    alert("¡Atención! Para usar modos especiales debes ir a 📋 Lista y guardar tu Nombre/Terminal.");
                    return;
                }
                modoActivo = modo;
                if (modo === 'rapido') {
                    btnRapido.classList.add('activo');
                    btnChequeo.classList.remove('activo');
                    resultadoDiv.innerHTML = "<h3 style='color:#ffc107; margin:0;'>⚡ MODO RÁPIDO ACTIVO</h3><p style='font-size:14px; margin-top:4px;'>Se guardarán a tu Lista con cantidad 1 automáticamente.</p>";
                } else if (modo === 'chequeo') {
                    btnChequeo.classList.add('activo');
                    btnRapido.classList.remove('activo');
                    resultadoDiv.innerHTML = "<h3 style='color:#9c27b0; margin:0;'>🕵️ CHEQUEO PRECIOS ACTIVO</h3><p style='font-size:14px; margin-top:4px;'>Paso 1: Escanea el EAN del producto de la competencia.</p>";
                }
            }
            inputCodigo.focus();
        }

        // --- LÓGICA MODO CHEQUEO PRECIOS (OCR) ---
        function procesarEscaneoChequeo(termino) {
            eanChequeoPendiente = termino;
            resultadoDiv.innerHTML = `
                <h3 style='color:#9c27b0; margin:0;'>Paso 2: Foto al precio</h3>
                <p style='font-size:14px;'>EAN Capturado: <b>${termino}</b></p>
                <p style='font-size:12px; color:#555;'>Se abrirá la cámara. Haz una foto de cerca al precio de la etiqueta.</p>
            `;
            // Disparamos la cámara automáticamente
            document.getElementById('captura-precio-ocr').click();
        }

        async function procesarFotoOCR(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('ocr-loading').style.display = 'flex';

            try {
                // Reconocimiento de texto con IA
                const result = await Tesseract.recognize(file, 'spa', {
                    logger: m => console.log(m)
                });
                
                document.getElementById('ocr-loading').style.display = 'none';
                
                // Buscamos números con decimales en el texto extraído
                const textoPlano = result.data.text;
                let precioSugerido = "";
                const numerosEncontrados = textoPlano.match(/\d+[.,]?\d*/g);
                
                if (numerosEncontrados && numerosEncontrados.length > 0) {
                    // Coge el primer número que parezca un precio (o el más grande)
                    precioSugerido = numerosEncontrados.find(n => n.includes(',') || n.includes('.')) || numerosEncontrados[0];
                }

                // Pedimos confirmación manual porque el OCR no es 100% perfecto
                const precioFinal = prompt(`🤖 La IA ha leído la etiqueta.\n\nTexto detectado: ${textoPlano.substring(0, 50)}...\n\nConfirma o corrige el PVP (€):`, precioSugerido);

                if (precioFinal !== null && precioFinal.trim() !== "") {
                    // Lo guardamos en la lista de trabajo
                    listaTrabajo.push({
                        ean: eanChequeoPendiente,
                        descripcion: `COMPETENCIA - PVP: ${precioFinal}€`,
                        cantidad: 1, // Se envía 1 por defecto, el precio va en la descripción
                        fecha: new Date().toLocaleString('es-ES').replace(', ', ' ')
                    });
                    
                    localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                    
                    resultadoDiv.innerHTML = `
                        <p style="margin:0; font-size:14px; color:#666;">Precio guardado:</p>
                        <h3 style="margin:2px 0; color:#9c27b0;">${precioFinal} €</h3>
                        <p style="margin:0; font-weight:bold;">EAN: ${eanChequeoPendiente}</p>
                        <p style='font-size:12px; margin-top:8px;'>Escanea el siguiente EAN...</p>
                    `;
                } else {
                    resultadoDiv.innerHTML = "<p style='color:red;'>Captura cancelada.</p><p style='font-size:12px;'>Escanea otro EAN.</p>";
                }
            } catch (error) {
                document.getElementById('ocr-loading').style.display = 'none';
                alert("Error procesando la imagen OCR: " + error.message);
                resultadoDiv.innerHTML = "<p style='color:red;'>Error al leer la foto. Escanea el EAN de nuevo.</p>";
            }

            eanChequeoPendiente = null;
            event.target.value = ""; // Resetear input
            inputCodigo.value = "";
            
            if (ultimoModo === 'camara') setTimeout(iniciarEscanerSegunOS, 800);
            else inputCodigo.focus();
        }

        // --- LÓGICA MODO RÁPIDO ---
        function procesarEscaneoRapido(termino) {
            let desc = "ETIQUETA RÁPIDA (Sin datos)";
            let eanDetectado = termino;

            if (inventario.hasOwnProperty(termino)) { 
                eanDetectado = termino; desc = inventario[termino].descripcion;
            } else if (/^\d+$/.test(termino)) {
                let termLimpio = termino.replace(/^0+/, '');
                if (inventario.hasOwnProperty(termLimpio)) { eanDetectado = termLimpio; desc = inventario[termLimpio].descripcion; }
                else if (inventario.hasOwnProperty(termLimpio.padStart(12, '0'))) { eanDetectado = termLimpio.padStart(12, '0'); desc = inventario[termLimpio.padStart(12, '0')].descripcion; }
            }

            listaTrabajo.push({
                ean: eanDetectado,
                descripcion: desc,
                cantidad: 1,
                fecha: new Date().toLocaleString('es-ES').replace(', ', ' ')
            });
            localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));

            resultadoDiv.innerHTML = `
                <p style="margin:0; font-size:14px; color:#666;">Añadido a tu lista:</p>
                <h3 style="margin:2px 0; color:#28a745;">${eanDetectado}</h3>
                <p style="margin:0; font-weight:bold;">${desc}</p>
                <div style="margin-top:8px; font-size:20px;">📦 x1</div>
            `;
            inputCodigo.value = "";
            if (ultimoModo === 'camara') setTimeout(iniciarEscanerSegunOS, 800);
            else inputCodigo.focus();
        }

        // --- DRIVE Y BÚSQUEDA ---
        async function enviarADrive() {
            if (listaTrabajo.length === 0) { alert("La lista está vacía."); return; }
            if (URL_GOOGLE_APPS_SCRIPT === "PEGA_TU_URL_AQUÍ") { alert("Falta URL."); return; }
            if (!usuarioGuardado) { alert("Pon tu nombre en la casilla de arriba primero."); return; }

            const btnDrive = document.getElementById('btn-drive');
            btnDrive.classList.add('loading');
            btnDrive.innerText = "⏳ Enviando...";

            const datosAEnviar = listaTrabajo.map(item => {
                return { ean: item.ean, cantidad: item.cantidad, descripcion: item.descripcion, fecha: item.fecha, usuario: usuarioGuardado };
            });

            try {
                const response = await fetch(URL_GOOGLE_APPS_SCRIPT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(datosAEnviar)
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    alert("¡Sincronizado correctamente!");
                    if(confirm("¿Quieres vaciar la lista de trabajo?")) {
                        listaTrabajo = [];
                        localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                        renderizarLista();
                    }
                } else alert("Error Drive: " + result.message);
            } catch (error) { alert("Error conexión: " + error); } 
            finally { btnDrive.classList.remove('loading'); btnDrive.innerText = "☁️ A Drive"; }
        }

        function procesarBusqueda(terminoBusqueda) {
            let termino = terminoBusqueda.trim().toUpperCase();
            if (!termino) return;

            // Derivador de modos
            if (modoActivo === 'rapido') { procesarEscaneoRapido(termino); return; }
            if (modoActivo === 'chequeo') { procesarEscaneoChequeo(termino); return; }

            // Modo Normal
            let eanDetectado = null;
            if (inventario.hasOwnProperty(termino)) { eanDetectado = termino; } 
            else if (/^\d+$/.test(termino)) {
                let termLimpio = termino.replace(/^0+/, '');
                if (inventario.hasOwnProperty(termLimpio)) eanDetectado = termLimpio; 
                else if (inventario.hasOwnProperty(termLimpio.padStart(12, '0'))) eanDetectado = termLimpio.padStart(12, '0'); 
            }

            if (eanDetectado) mostrarArticuloCompleto(eanDetectado);
            else mostrarArticuloDesconocido(termino);
            
            setTimeout(() => inputCodigo.blur(), 100);
        }

        function mostrarArticuloCompleto(ean) {
            let art = inventario[ean];
            resultadoDiv.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 2px;">
                    <p class="titulo-encontrado">¡Artículo encontrado!</p>
                    <p class="texto-ean">EAN: ${ean}</p>
                    <div class="descripcion-producto">${art.descripcion}</div>
                </div>
                <div class="caja-stock">
                    <p class="etiqueta-stock">STOCK DISPONIBLE</p>
                    <p class="numero-stock">${art.stock}</p>
                </div>
                <div id="panel-botones-accion" class="panel-acciones">
                    <button class="btn-accion-unica" onclick="mostrarInputCantidad('${ean}', false)">+ Añadir Cantidad</button>
                </div>
                <div id="panel-cantidad-accion" class="panel-cantidad">
                    <input type="text" id="input-cant-accion" class="input-cantidad" placeholder="Uds..." readonly onclick="abrirTecladoCantidad()">
                    <button class="btn-confirmar" onclick="guardarEnLista('${ean}', false)">OK</button>
                </div>
            `;
            inputCodigo.value = ""; 
        }

        function mostrarArticuloDesconocido(termino) {
            resultadoDiv.innerHTML = `
                <h3 style="color: #dc3545; margin: 0 0 4px 0;">No encontrado</h3>
                <p style="font-size: 15px;">Lectura: <strong>${termino}</strong></p>
                <div id="panel-botones-accion" class="panel-acciones">
                    <button class="btn-accion-unica" style="background-color: #6c757d;" onclick="mostrarInputCantidad('${termino}', true)">Forzar Añadir</button>
                </div>
                <div id="panel-cantidad-accion" class="panel-cantidad">
                    <input type="text" id="input-cant-accion" class="input-cantidad" placeholder="Uds..." readonly onclick="abrirTecladoCantidad()">
                    <button class="btn-confirmar" onclick="guardarEnLista('${termino}', true)">OK</button>
                </div>
            `;
            inputCodigo.value = ""; 
        }

        function mostrarInputCantidad(identificador, esDesconocido) {
            itemActual = { ean: identificador, esDesconocido: esDesconocido };
            document.getElementById('panel-botones-accion').style.display = 'none';
            const panelCant = document.getElementById('panel-cantidad-accion');
            panelCant.style.display = 'flex';
            document.getElementById('input-cant-accion').value = ""; 
            abrirTecladoCantidad();
        }

        function guardarEnLista(identificador, esDesconocido) {
            const cantidad = parseFloat(document.getElementById('input-cant-accion').value) || 0;
            if (cantidad > 0) {
                let desc = esDesconocido ? "DESCONOCIDO/FUERA SURTIDO" : inventario[identificador].descripcion;
                listaTrabajo.push({ ean: identificador, descripcion: desc, cantidad: cantidad, fecha: new Date().toLocaleString('es-ES').replace(', ', ' ') });
                localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                resultadoDiv.innerHTML = "Esperando código...";
            }
            tecladoVirtual.style.display = 'none';
            document.body.classList.remove('modo-teclado');
            inputCodigo.value = "";
            if (ultimoModo === 'camara') iniciarEscanerSegunOS();
            else inputCodigo.focus();
        }

        // --- SISTEMA CÁMARAS Y TECLADO ---
        function toggleTecladoVirtual() {
            if (tecladoVirtual.style.display === 'grid' && inputActivoId === 'inputCodigo') {
                tecladoVirtual.style.display = 'none'; document.body.classList.remove('modo-teclado');
            } else {
                cerrarCamara(); inputActivoId = 'inputCodigo'; document.getElementById('btn-teclado-ok').innerText = 'BUSCAR';
                inputCodigo.blur(); tecladoVirtual.style.display = 'grid'; document.body.classList.add('modo-teclado');
            }
        }

        function abrirTecladoCantidad() {
            inputActivoId = 'input-cant-accion'; document.getElementById('btn-teclado-ok').innerText = 'AÑADIR';
            tecladoVirtual.style.display = 'grid'; document.body.classList.add('modo-teclado');
        }

        function pulsarTecla(valor) {
            const inputDestino = document.getElementById(inputActivoId);
            if (valor === 'DEL') inputDestino.value = inputDestino.value.slice(0, -1);
            else if (valor === 'ENTER') {
                if (inputActivoId === 'inputCodigo') { ultimoModo = 'teclado'; procesarBusqueda(inputDestino.value.trim()); tecladoVirtual.style.display = 'none'; document.body.classList.remove('modo-teclado'); } 
                else if (inputActivoId === 'input-cant-accion') guardarEnLista(itemActual.ean, itemActual.esDesconocido);
            } else inputDestino.value += valor;
        }

        inputCodigo.addEventListener('focus', () => { document.body.classList.add('modo-teclado'); tecladoVirtual.style.display = 'none'; cerrarCamara(); });
        inputCodigo.addEventListener('blur', () => { if (tecladoVirtual.style.display !== 'grid') document.body.classList.remove('modo-teclado'); });
        inputCodigo.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); ultimoModo = 'teclado'; procesarBusqueda(inputCodigo.value.trim()); } });

        function procesarResultadoZXing(result) { if (result) { ultimoModo = 'camara'; procesarBusqueda(result.text.trim()); cerrarCamara(); } }
        function iniciarEscanerSegunOS() { ultimoModo = 'camara'; iniciarCamaraVideo(); }

        async function iniciarCamaraVideo() {
            const container = document.getElementById('video-container');
            container.style.display = 'block'; tecladoVirtual.style.display = 'none';
            if (!codeReader) codeReader = new ZXing.BrowserBarcodeReader(new Map().set(ZXing.DecodeHintType.TRY_HARDER, true));
            try {
                const devices = await codeReader.listVideoInputDevices();
                let selected = camaraManualId || (devices.length > 0 ? devices[devices.length - 1].deviceId : null);
                if (selected) codeReader.decodeFromVideoDevice(selected, 'video-preview', (result) => { if (result) procesarResultadoZXing(result); });
            } catch (err) { alert("Error cámara: " + err.message); container.style.display = 'none'; }
        }

        function cambiarCamaraManual() { camaraManualId = document.getElementById('selector-camara').value; localStorage.setItem('camaraPreferida', camaraManualId); cerrarCamara(); setTimeout(iniciarEscanerSegunOS, 300); }
        function cerrarCamara() { if (codeReader) codeReader.reset(); document.getElementById('video-container').style.display = 'none'; }

        // --- CARGA DATOS Y LISTAS ---
        function cargarInventario() {
            estadoDiv.innerHTML = "Sincronizando..."; estadoDiv.style.color = "blue";
            fetch('TIENDA.csv?' + new Date().getTime()).then(r => r.text()).then(texto => {
                Papa.parse(texto, { header: false, delimiter: ";", skipEmptyLines: true, complete: function(results) {
                    inventario = {}; let contador = 0;
                    results.data.forEach(fila => {
                        if(fila.length >= 3) {
                            let ean = fila[0]?fila[0].trim():"";
                            if(ean) { inventario[ean] = { descripcion: fila[1]?fila[1].trim():"", stock: fila[2]?fila[2].trim():"" }; contador++; }
                        }
                    });
                    estadoDiv.innerHTML = `Base actualizada: ${contador} items`; estadoDiv.style.color = "#28a745";
                }});
            }).catch(err => { estadoDiv.innerText = "Error cargando CSV."; estadoDiv.style.color = "red"; });
        }

        function verListas() { document.getElementById('modalListas').style.display = 'flex'; renderizarLista(); }
        function cerrarModalListas() { document.getElementById('modalListas').style.display = 'none'; if (ultimoModo === 'teclado') inputCodigo.focus(); }

        function renderizarLista() {
            const contenedor = document.getElementById('modal-body-listas');
            if (listaTrabajo.length === 0) { contenedor.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Lista vacía</div>'; return; }
            let html = '';
            [...listaTrabajo].reverse().forEach((item, idx) => {
                html += `<div class="item-lista-guardada"><div class="item-lista-info"><span class="item-desc-modal">${item.descripcion}</span><span class="item-detalle-modal">EAN: ${item.ean}</span></div><div style="display:flex; align-items:center;"><span class="item-cant-modal">x${item.cantidad}</span><button class="btn-borrar-item" onclick="eliminarItemLista(${listaTrabajo.length - 1 - idx})">✕</button></div></div>`;
            });
            contenedor.innerHTML = html;
        }

        function eliminarItemLista(index) { listaTrabajo.splice(index, 1); localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); }
        function borrarListaActual() { if(confirm('¿VACIAR toda la lista?')) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } }
        
        function exportarListaCSV() {
            if(listaTrabajo.length === 0) return;
            let csv = "\ufeffEAN;Cantidad;Descripcion\n";
            listaTrabajo.forEach(i => csv += `${i.ean};${i.cantidad};${i.descripcion}\n`);
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.setAttribute("download", `Trabajo.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.onload = () => cargarInventario();
    </script>
</body>
</html>

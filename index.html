<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita desplazamientos innecesarios */
        }

        body { 
            font-family: Arial, sans-serif; 
            padding: 6px; 
            text-align: center; 
            background-color: #f4f6f8; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Encabezado superior */
        .cabecera-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 2px;
        }

        h1 { 
            margin: 0; 
            font-size: 18px; 
        }

        .btn-actualizar { 
            padding: 5px 10px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* Barra de estado superior estilo compacto */
        #estado { 
            font-weight: bold; 
            font-size: 12px; 
            color: #28a745;
            margin-bottom: 4px;
        }

        .texto-fecha { 
            font-size: 11px; 
            color: #555555; 
            font-weight: normal; 
            display: block;
        }

        /* Tarjeta de resultados (Réplica del diseño de la imagen) */
        .resultado { 
            margin: 2px 0; 
            padding: 10px; 
            border: 2px solid #222222; 
            border-radius: 14px; 
            background-color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            flex: 1; /* Ocupa todo el espacio vertical disponible */
        }

        .titulo-encontrado {
            color: #28a745; 
            margin: 0; 
            font-size: 16px;
            font-weight: bold;
        }

        .texto-ean {
            font-size: 12px; 
            color: #666; 
            margin: 2px 0 4px 0;
        }

        /* Nombre / Descripción del producto */
        .descripcion-producto {
            font-size: 17px; 
            font-weight: 800; 
            line-height: 1.25; 
            color: #000000;
            margin: 4px 0;
            text-transform: uppercase;
        }

        /* Tabla de PVP, Recep., Ventas */
        .panel-secundario {
            display: flex;
            justify-content: space-around;
            gap: 4px;
            margin: 6px 0;
            background-color: #f8f9fa;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .item-secundario { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            flex: 1; 
        }

        .etiqueta-secundaria { 
            font-size: 10px; 
            text-transform: uppercase; 
            color: #6c757d; 
            font-weight: bold; 
        }

        .valor-secundario { 
            font-size: 15px; 
            font-weight: 800; 
            color: #111111; 
        }

        /* Bloque verde de Stock */
        .caja-stock { 
            margin-top: 4px; 
            padding: 8px 4px; 
            background-color: #28a745; 
            color: #ffffff; 
            border-radius: 10px; 
        }

        .etiqueta-stock { 
            font-size: 11px; 
            text-transform: uppercase; 
            margin: 0 0 2px 0; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            opacity: 0.95; 
        }

        .numero-stock { 
            font-size: 48px; 
            font-weight: 900; 
            margin: 0; 
            line-height: 1; 
        }

        /* Visor para la cámara iOS */
        #lectorCamara {
            width: 100%;
            max-width: 320px;
            margin: 4px auto;
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }

        /* Interfaz inferior */
        .caja-interfaz { 
            margin-top: auto; 
            padding: 6px; 
            background-color: #ffffff; 
            border-top: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        #inputCodigo { 
            padding: 8px; 
            font-size: 16px; 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
            border: 2px solid #007bff; 
            border-radius: 6px; 
            outline: none; 
            box-sizing: border-box;
            font-weight: bold;
        }

        .btn-camara {
            padding: 8px 12px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            display: block;
        }

        .texto-instruccion {
            font-weight: bold; 
            font-size: 11px; 
            margin: 0; 
            color: #495057;
        }

        p { margin: 2px 0; }

        /* Al desplegar el teclado se oculta la cabecera para maximizar el área de resultado */
        body.modo-teclado .cabecera-top {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Cabecera superior -->
    <div class="cabecera-top">
        <h1>Inventario</h1>
        <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sincronizar</button>
    </div>

    <div id="estado">Conectando...</div>

    <!-- Módulo de Resultados estilo tarjeta -->
    <div id="resultado" class="resultado">
        Esperando código...
    </div>

    <!-- Visor de cámara -->
    <div id="lectorCamara"></div>

    <!-- Entrada de datos inferior -->
    <div class="caja-interfaz">
        <button class="btn-camara" onclick="alternarCamaraiOS()">📷 Escanear con Cámara (iPhone)</button>
        <p class="texto-instruccion">o usa tu teclado escáner / lectura manual:</p>
        <input type="text" id="inputCodigo" placeholder="Escanea el código aquí..." autocomplete="off">
    </div>

    <script>
        let inventario = {};
        let html5QrCode = null;
        let camaraEncendida = false;

        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');

        inputCodigo.addEventListener('focus', () => {
            document.body.classList.add('modo-teclado');
        });

        inputCodigo.addEventListener('blur', () => {
            document.body.classList.remove('modo-teclado');
        });

        function formatearFechaHora(objetoFecha) {
            const opcionesFecha = { day: 'numeric', month: 'long' };
            const fechaTexto = objetoFecha.toLocaleDateString('es-ES', opcionesFecha);
            const horas = String(objetoFecha.getHours()).padStart(2, '0');
            const minutos = String(objetoFecha.getMinutes()).padStart(2, '0');
            
            return `${fechaTexto} a las ${horas}:${minutos} h`;
        }

        function cargarInventario() {
            estadoDiv.innerHTML = "Sincronizando...";
            estadoDiv.style.color = "blue";

            const url = 'TIENDA.csv?' + new Date().getTime();

            fetch(url)
                .then(response => {
                    const lastModifiedHeader = response.headers.get('Last-Modified');
                    const fechaRealArchivo = lastModifiedHeader ? new Date(lastModifiedHeader) : new Date();
                    return response.text().then(textoCsv => ({ textoCsv, fechaRealArchivo }));
                })
                .then(({ textoCsv, fechaRealArchivo }) => {
                    Papa.parse(textoCsv, {
                        header: false,
                        delimiter: ";",
                        skipEmptyLines: true,
                        complete: function(results) {
                            inventario = {};
                            let contador = 0;
                            
                            results.data.forEach(fila => {
                                if(fila.length >= 3) {
                                    let ean = fila[0] ? fila[0].trim() : "";
                                    let desc = fila[1] ? fila[1].trim() : "";
                                    let stock = fila[2] ? fila[2].trim() : "";
                                    let precio = fila[3] ? fila[3].trim() : "-";
                                    let fecha = fila[4] ? fila[4].trim() : "-";
                                    let ventas = fila[5] ? fila[5].trim() : "0";
                                    
                                    if(ean) {
                                        inventario[ean] = { 
                                            descripcion: desc, 
                                            stock: stock,
                                            precio: precio,
                                            fecha: fecha,
                                            ventas: ventas
                                        };
                                        contador++;
                                    }
                                }
                            });
                            
                            const fechaFormateada = formatearFechaHora(fechaRealArchivo);
                            estadoDiv.innerHTML = `
                                ¡Base de datos lista: ${contador} artículos!
                                <span class="texto-fecha">Actualizado el ${fechaFormateada}</span>
                            `;
                            estadoDiv.style.color = "#28a745";
                        }
                    });
                })
                .catch(err => {
                    estadoDiv.innerText = "Error al cargar datos.";
                    estadoDiv.style.color = "red";
                });
        }

        function buscarCodigo(codigoEscaneado) {
            if (!codigoEscaneado) return;

            if (inventario.hasOwnProperty(codigoEscaneado)) {
                let articulo = inventario[codigoEscaneado];
                resultadoDiv.innerHTML = `
                    <div>
                        <p class="titulo-encontrado">¡Artículo encontrado!</p>
                        <p class="texto-ean"><strong>EAN:</strong> ${codigoEscaneado}</p>
                        <div class="descripcion-producto">${articulo.descripcion}</div>
                    </div>

                    <div class="panel-secundario">
                        <div class="item-secundario">
                            <span class="etiqueta-secundaria">P.V.P.</span>
                            <span class="valor-secundario">${articulo.precio}</span>
                        </div>
                        <div class="item-secundario">
                            <span class="etiqueta-secundaria">Últ. Recep.</span>
                            <span class="valor-secundario">${articulo.fecha}</span>
                        </div>
                        <div class="item-secundario">
                            <span class="etiqueta-secundaria">Ventas Recep.</span>
                            <span class="valor-secundario">${articulo.ventas} u.</span>
                        </div>
                    </div>

                    <div class="caja-stock">
                        <p class="etiqueta-stock">STOCK DISPONIBLE</p>
                        <p class="numero-stock">${articulo.stock}</p>
                    </div>
                `;
            } else {
                resultadoDiv.innerHTML = `
                    <h3 style="color: #dc3545; margin: 0 0 4px 0; font-size: 18px;">No encontrado</h3>
                    <p style="font-size: 15px;">El código <strong>${codigoEscaneado}</strong> no está en la base de datos.</p>
                `;
            }

            inputCodigo.value = "";
        }

        async function alternarCamaraiOS() {
            const visorDiv = document.getElementById('lectorCamara');

            if (camaraEncendida) {
                if (html5QrCode) {
                    await html5QrCode.stop();
                }
                visorDiv.style.display = "none";
                camaraEncendida = false;
            } else {
                visorDiv.style.display = "block";
                html5QrCode = new Html5Qrcode("lectorCamara");

                const configuracion = { 
                    fps: 15, 
                    qrbox: { width: 220, height: 130 },
                    aspectRatio: 1.0
                };

                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        configuracion,
                        (codigoTexto) => {
                            buscarCodigo(codigoTexto.trim());
                            html5QrCode.stop().then(() => {
                                visorDiv.style.display = "none";
                                camaraEncendida = false;
                            });
                        },
                        (mensajeError) => {}
                    );
                    camaraEncendida = true;
                } catch (err) {
                    alert("Error al encender la cámara en iOS.");
                    visorDiv.style.display = "none";
                    camaraEncendida = false;
                }
            }
        }

        inputCodigo.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarCodigo(inputCodigo.value.trim());
            }
        });

        window.onload = cargarInventario;
    </script>
</body>
</html>

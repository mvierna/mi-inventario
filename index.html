<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Inventario en la Nube</title>
    
    <!-- Librerías necesarias para leer el CSV y usar la cámara -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        #lector { width: 100%; max-width: 400px; margin: 0 auto; }
        .resultado { margin-top: 20px; padding: 15px; border: 2px solid #333; border-radius: 8px; background-color: #f4f4f4; }
        /* Nuevo estilo para mostrar si el CSV se cargó bien desde la nube */
        #estado { color: blue; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Buscador de Artículos</h1>
    
    <!-- Mensaje automático que indicará si el archivo se conectó correctamente -->
    <div id="estado">Conectando con la nube...</div>

    <div>
        <h3>Escanea el código EAN</h3>
        <div id="lector"></div>
    </div>

    <div id="resultado" class="resultado">
        Esperando a que escanees un código...
    </div>

    <script>
        let inventario = [];

        // --- PARTE 1: DESCARGA AUTOMÁTICA DEL CSV DESDE LA NUBE ---
        // Al usar 'download: true', PapaParse buscará un archivo llamado 'inventario.csv' 
        // en la misma carpeta del servidor donde esté alojado este index.html
        Papa.parse("inventario.csv", {
            download: true,
            header: false,
            complete: function(resultados) {
                inventario = resultados.data;
                document.getElementById('estado').innerText = "¡Inventario cargado exitosamente!";
                document.getElementById('estado').style.color = "green";
            },
            error: function(error) {
                document.getElementById('estado').innerText = "Error: No se encontró el archivo inventario.csv en el servidor.";
                document.getElementById('estado').style.color = "red";
            }
        });

        // --- PARTE 2: BUSCAR EL EAN ---
        function buscarEnInventario(eanEscaneado) {
            const divResultado = document.getElementById('resultado');

            // Verificamos si la descarga desde la nube aún no termina o falló
            if (inventario.length === 0) {
                divResultado.innerHTML = "<p style='color: red;'>El inventario aún no está listo.</p>";
                return;
            }

            for (let i = 1; i < inventario.length; i++) {
                let fila = inventario[i];
                
                if (fila.length >= 3) {
                    let ean = fila[0].trim();
                    let descripcion = fila[1].trim();
                    let stock = fila[2].trim();

                    if (ean === eanEscaneado) {
                        divResultado.innerHTML = `
                            <h3 style="color: green;">¡Artículo encontrado!</h3>
                            <p><b>EAN Escaneado:</b> ${eanEscaneado}</p>
                            <p><b>Descriptivo:</b> ${descripcion}</p>
                            <p><b>Stock:</b> ${stock}</p>
                        `;
                        return;
                    }
                }
            }

            divResultado.innerHTML = `
                <h3 style="color: red;">No encontrado</h3>
                <p>El código <b>${eanEscaneado}</b> no está en la lista.</p>
            `;
        }

        // --- PARTE 3: CONFIGURAR LA CÁMARA ---
        function alEscanearExito(textoDecodificado) {
            buscarEnInventario(textoDecodificado);
        }

        function alEscanearError(mensajeError) {
            // Ignoramos los errores mientras la cámara enfoca
        }

        let escaner = new Html5QrcodeScanner(
            "lector",
            { fps: 10, qrbox: {width: 250, height: 100} },
            false
        );
        escaner.render(alEscanearExito, alEscanearError);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Hipermercado</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">

    <!-- LIBRERÍAS (CSV, Escáner y EXCEL) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 6px; text-align: center; 
            background-color: #f4f6f8; display: flex; flex-direction: column; 
            min-height: 100dvh; overflow-y: auto; 
        }
        
        #aviso-rotacion {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            background: #f4f6f8; color: #111; z-index: 9999; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        #aviso-rotacion h2 { color: #dc3545; font-size: 22px; margin-bottom: 8px; }
        
        @media screen and (orientation: landscape) {
            body > *:not(#aviso-rotacion) { display: none !important; }
            #aviso-rotacion { display: flex; }
        }

        .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
        h1 { margin: 0; font-size: 18px; font-weight: 900; color: #111; }
        .btn-actualizar { padding: 8px 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        #estado { font-weight: bold; font-size: 11px; color: #28a745; margin-bottom: 6px; }
        .texto-fecha { font-size: 11px; color: #444444; font-weight: bold; display: block; margin-top: 1px; text-transform: uppercase; }
        
        .resultado { 
            display: none; 
            margin-top: auto; margin-bottom: 6px; padding: 8px; border: 2px solid #222222; 
            border-radius: 12px; background-color: #ffffff; flex-direction: column; gap: 4px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: auto; 
        }
        .titulo-encontrado { color: #28a745; margin: 0; font-size: 15px; font-weight: bold; }
        .texto-ean { font-size: 13px; color: #555; margin: 0; }
        .descripcion-producto { font-size: 17px; font-weight: 800; line-height: 1.2; color: #000000; margin: 2px 0; text-transform: uppercase; }
        
        .panel-secundario { display: flex; justify-content: space-around; gap: 4px; margin: 2px 0; background-color: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .item-secundario { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; }
        .etiqueta-secundaria { font-size: 10px; text-transform: uppercase; color: #555; font-weight: bold; }
        .valor-secundario { font-size: 15px; font-weight: 800; color: #111111; }

        .caja-stock { margin-top: 2px; padding: 6px; background-color: #28a745; color: #ffffff; border-radius: 8px; border: none; }
        .etiqueta-stock { font-size: 12px; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 0.5px; opacity: 0.95; }
        .numero-stock { font-size: 42px; font-weight: 900; margin: 0; line-height: 1; color: #ffffff; }

        .panel-acciones { margin-top: 6px; }
        .btn-accion-unica { 
            width: 100%; padding: 12px; background-color: #ff9800; color: white; border: none; 
            border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 0 #e65100; transition: transform 0.1s;
        }
        .btn-accion-unica:active { transform: translateY(4px); box-shadow: none; }
        
        .panel-cantidad { display: none; flex-direction: row; gap: 8px; margin-top: 6px; }
        .input-cantidad { 
            flex: 1; padding: 10px; border: 3px solid #ff9800; border-radius: 8px; 
            font-size: 20px; text-align: center; font-weight: bold; outline: none; background-color: white; color: #111;
        }

        .lista-resultados { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; text-align: left; border: 1px solid #dee2e6; border-radius: 6px; }
        .item-resultado { padding: 10px; border-bottom: 1px solid #dee2e6; cursor: pointer; background-color: #fff; }
        .item-resultado:last-child { border-bottom: none; }
        .item-resultado:active { background-color: #e9ecef; }
        .item-desc { font-weight: bold; font-size: 14px; display: block; color: #111; margin-bottom: 2px; }
        .item-ean { font-size: 12px; color: #6c757d; font-weight: bold; }

        #video-container { width: 100%; max-width: 320px; max-height: 250px; background: #000; margin: 4px auto; border-radius: 6px; overflow: hidden; position: relative; display: none; }
        #controles-video { padding: 6px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; }
        #selector-camara { width: 100%; max-width: 200px; padding: 6px; border-radius: 4px; font-size: 12px; background: white; color: black; border: 1px solid #ccc; }
        video { width: 100%; height: auto; display: block; object-fit: cover; }

        .caja-interfaz { padding: 6px; background-color: #ffffff; border-top: 1px solid #dee2e6; width: 100%; padding-bottom: max(6px, env(safe-area-inset-bottom)); margin-top: auto; }
        
        .contenedor-modos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .btn-modo {
            padding: 12px 4px; color: white; border: none; border-radius: 6px; 
            font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-modo:active { transform: translateY(3px); box-shadow: none !important; }
        
        #btn-modo-rapido { background-color: #6c757d; }
        #btn-modo-rapido.activo { background-color: #ffc107; color: #000; box-shadow: 0 3px 0 #d39e00; }
        
        #btn-modo-pedidos { background-color: #6c757d; }
        #btn-modo-pedidos.activo { background-color: #17a2b8; color: #fff; box-shadow: 0 3px 0 #117a8b; }

        #btn-modo-chequeo { background-color: #6c757d; }
        #btn-modo-chequeo.activo { background-color: #9c27b0; color: #fff; box-shadow: 0 3px 0 #6a1b9a; }
        
        #btn-modo-lista { background-color: #007bff; }

        .grupo-input-camara { display: flex; gap: 6px; width: 100%; justify-content: space-between; align-items: center; }
        .btn-teclado { flex: 0 0 50px; height: 50px; background-color: #6c757d; color: white; border: none; border-radius: 6px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #inputCodigo { flex: 1; min-width: 0; height: 50px; padding: 8px; font-size: 16px; text-align: center; border: 2px solid #007bff; border-radius: 6px; outline: none; font-weight: bold; }
        #inputCodigo:disabled { background-color: #e9ecef; border-color: #ced4da; opacity: 0.7; }
        .btn-camara-cuadrado { flex: 0 0 90px; height: 50px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }

        #teclado-virtual { display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; background: #f8f9fa; padding: 6px; border-radius: 8px; border: 1px solid #dee2e6; }
        .tecla-v { height: 50px; font-size: 22px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #ccc; color: #111; flex-direction: column; line-height: 1; }
        .tecla-v:active { transform: translateY(2px); box-shadow: none; background: #e9ecef; }
        
        .tecla-accion { background: #dc3545; color: white; border-color: #b02a37; box-shadow: 0 2px 0 #b02a37; font-size: 17px; grid-column: 4; grid-row: 1; height: 100%; }
        .tecla-accion:active { background: #c82333; }
        
        .tecla-ok { background: #28a745; color: white; border-color: #198754; box-shadow: 0 2px 0 #198754; font-size: 15px; font-weight: 900; grid-column: 4; grid-row: 2 / span 3; height: 100%; letter-spacing: 1px; }
        .tecla-ok:active { background: #218838; }

        body.modo-teclado .cabecera-top, body.modo-teclado #estado { display: none !important; }

        /* REGLAS DE COMPRESIÓN PARA PANTALLAS PEQUEÑAS (Como las de 6.2" o menos) */
        @media (max-height: 720px) {
            .tecla-v { height: 44px; font-size: 20px; }
            .tecla-accion { font-size: 15px; }
            .tecla-ok { font-size: 14px; }
            .btn-modo { padding: 8px 4px; font-size: 12px; }
            .grupo-input-camara .btn-teclado, .grupo-input-camara #inputCodigo, .grupo-input-camara .btn-camara-cuadrado { height: 42px; }
            .resultado { padding: 6px; margin-bottom: 4px; gap: 2px; }
            .descripcion-producto { font-size: 15px; }
            .numero-stock { font-size: 34px; }
            .input-cantidad { padding: 8px; font-size: 18px; }
            .panel-secundario { padding: 4px; margin: 0; }
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #f4f6f8; width: 92%; max-height: 85dvh; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111; }
        .btn-cerrar-modal { background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .input-email-config { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 6px; margin-bottom: 8px; font-size: 16px; font-weight: bold; outline: none; text-align: center; }
        .input-competencia { border-color: #9c27b0; color: #9c27b0; margin-bottom: 12px; }
        
        .modal-body { overflow-y: auto; flex: 1; background: white; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 10px; }
        .item-lista-guardada { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #dee2e6; align-items: center; }
        .item-lista-guardada:last-child { border-bottom: none; }
        .item-lista-info { display: flex; flex-direction: column; text-align: left; flex: 1;}
        .item-desc-modal { font-size: 15px; font-weight: bold; color: #111; }
        .item-detalle-modal { font-size: 13px; color: #666; margin-top: 2px; }
        
        .etiqueta-tipo-lista { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; color: white; margin-bottom: 4px; display: inline-block; text-transform: uppercase; }
        .bg-inventario { background-color: #6c757d; }
        .bg-competencia { background-color: #9c27b0; }
        .bg-pedido { background-color: #17a2b8; }

        .item-cant-modal { font-size: 20px; font-weight: 900; color: #111; margin-right: 8px; }
        .btn-editar-item { background: #ffc107; color: #000; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-right: 4px; }
        .btn-borrar-item { background: #dc3545; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 16px; cursor: pointer;}
        
        .modal-footer { display: flex; gap: 6px; justify-content: space-between; }
        .btn-footer { flex: 1; padding: 14px 6px; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; color: white; cursor: pointer; text-transform: uppercase; }
        
        .btn-sync-drive { background: #007bff; transition: background 0.3s; }
        .btn-sync-drive.loading { background: #6c757d; pointer-events: none; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="aviso-rotacion">
        <h2>⚠️ Gira el dispositivo</h2>
        <p>El escáner de códigos y la interfaz solo funcionan correctamente en modo vertical.</p>
    </div>

    <div class="cabecera-top">
        <h1>Inventario</h1>
        <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sincronizar BBDD</button>
    </div>

    <div id="estado">Iniciando BBDD Local...</div>

    <div id="video-container">
        <div id="controles-video">
            <select id="selector-camara" onchange="cambiarCamaraManual()">
                <option value="">Detectando cámaras...</option>
            </select>
            <button onclick="cerrarCamara()" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px;">✕ Cerrar</button>
        </div>
        <video id="video-preview" playsinline autoplay muted></video>
    </div>

    <div id="resultado" class="resultado"></div>

    <div class="caja-interfaz">
        <div class="contenedor-modos">
            <button id="btn-modo-rapido" class="btn-modo" onclick="activarModo('rapido')">⚡ MODO 1</button>
            <button id="btn-modo-pedidos" class="btn-modo" onclick="activarModo('pedidos')">🛒 PEDIDOS</button>
            <button id="btn-modo-chequeo" class="btn-modo" onclick="activarModo('chequeo')">🕵️ CHEQUEO</button>
            <button id="btn-modo-lista" class="btn-modo" onclick="verListas()">📋 LISTA</button>
        </div>
        
        <div class="grupo-input-camara">
            <button class="btn-teclado" onclick="toggleTecladoVirtual()">🔢</button>
            <input type="text" id="inputCodigo" placeholder="Escribe, escanea o EAN..." autocomplete="off">
            <button class="btn-camara-cuadrado" onclick="iniciarEscanerSegunOS()">📷 CÁMARA</button>
        </div>
        
        <div id="teclado-virtual">
            <button class="tecla-v" onclick="pulsarTecla('7')">7</button>
            <button class="tecla-v" onclick="pulsarTecla('8')">8</button>
            <button class="tecla-v" onclick="pulsarTecla('9')">9</button>
            <button class="tecla-v tecla-accion" onclick="pulsarTecla('DEL')">⌫<br>DEL</button>
            
            <button class="tecla-v" onclick="pulsarTecla('4')">4</button>
            <button class="tecla-v" onclick="pulsarTecla('5')">5</button>
            <button class="tecla-v" onclick="pulsarTecla('6')">6</button>

            <button class="tecla-v" onclick="pulsarTecla('1')">1</button>
            <button class="tecla-v" onclick="pulsarTecla('2')">2</button>
            <button class="tecla-v" onclick="pulsarTecla('3')">3</button>

            <button class="tecla-v" style="grid-column: 1 / span 2;" onclick="pulsarTecla('0')">0</button>
            <button class="tecla-v" onclick="pulsarTecla('.')">.</button>
            
            <button id="btn-teclado-ok" class="tecla-v tecla-ok" onclick="pulsarTecla('ENTER')">GUARDAR</button>
        </div>
    </div>

    <div id="modalListas" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajustes y Lista</h2>
                <button class="btn-cerrar-modal" onclick="cerrarModalListas()">✕</button>
            </div>
            
            <input type="text" id="nombre-usuario-input" class="input-email-config" placeholder="👤 Tu nombre o Nº Terminal..." onchange="guardarConfiguracion()">
            <input type="text" id="nombre-competencia-input" class="input-email-config input-competencia" placeholder="🏪 Nombre Competencia (Ej: Mercadona)..." onchange="guardarConfiguracion()">
            
            <div id="modal-body-listas" class="modal-body"></div>
            
            <div class="modal-footer">
                <button class="btn-footer" style="background: #dc3545; flex: 0.3;" onclick="borrarListaActual()">🗑</button>
                <button id="btn-drive" class="btn-footer btn-sync-drive" onclick="enviarADrive()">☁️ A Drive</button>
                <button class="btn-footer" style="background: #28a745; flex: 0.8;" onclick="exportarListaExcel()">📥 EXCEL</button>
            </div>
        </div>
    </div>

    <script>
        const URL_GOOGLE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyDUMAiEws8GCAHOXiPGn73p7PwmAx5ZpzB--SWloa3MalE2ozGCxNjwDg6MPD9_MT2/exec";

        // ==========================================
        // SISTEMA DE BASE DE DATOS LOCAL (IndexedDB)
        // ==========================================
        let dbLocal;
        function initDB() {
            return new Promise((resolve) => {
                let req = indexedDB.open("HiperDB_Files", 1);
                req.onupgradeneeded = e => {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains("archivos")) db.createObjectStore("archivos", { keyPath: "id" });
                };
                req.onsuccess = e => { dbLocal = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        }
        
        async function guardarArchivoLocal(id, data) {
            if (!dbLocal) return;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readwrite");
                tx.objectStore("archivos").put({ id: id, data: data });
                tx.oncomplete = resolve;
            });
        }
        
        async function leerArchivoLocal(id) {
            if (!dbLocal) return null;
            return new Promise(resolve => {
                let tx = dbLocal.transaction("archivos", "readonly");
                let req = tx.objectStore("archivos").get(id);
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        }

        let inventario = {};
        let inventarioMaestro = {};
        let codeReader = null;
        let camaraManualId = localStorage.getItem('camaraPreferida') || null; 
        
        let ultimoModo = 'teclado'; 
        let modoActivo = 'normal';
        
        let listaTrabajo = JSON.parse(localStorage.getItem('inventarioListaTrabajo')) || [];
        let usuarioGuardado = localStorage.getItem('inventarioUsuario') || '';
        let competenciaGuardada = localStorage.getItem('inventarioCompetencia') || '';
        
        let inputActivoId = 'inputCodigo';
        let itemActual = { ean: null, desc: null, esDesconocido: false, rayon: null, stock: null, pvp_nuestro: null };

        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');
        const tecladoVirtual = document.getElementById('teclado-virtual');

        document.getElementById('nombre-usuario-input').value = usuarioGuardado;
        document.getElementById('nombre-competencia-input').value = competenciaGuardada;

        function guardarConfiguracion() {
            usuarioGuardado = document.getElementById('nombre-usuario-input').value.trim();
            competenciaGuardada = document.getElementById('nombre-competencia-input').value.trim();
            localStorage.setItem('inventarioUsuario', usuarioGuardado);
            localStorage.setItem('inventarioCompetencia', competenciaGuardada);
        }

        function activarModo(modo) {
            const btnRapido = document.getElementById('btn-modo-rapido');
            const btnChequeo = document.getElementById('btn-modo-chequeo');
            const btnPedidos = document.getElementById('btn-modo-pedidos');
            
            if (modoActivo === modo) {
                modoActivo = 'normal';
                btnRapido.classList.remove('activo');
                btnChequeo.classList.remove('activo');
                btnPedidos.classList.remove('activo');
                resultadoDiv.style.display = 'none'; 
                resultadoDiv.innerHTML = "";
            } else {
                if (!usuarioGuardado) {
                    alert("¡Atención! Para usar modos especiales debes ir a 📋 Lista y guardar tu Nombre/Terminal.");
                    return;
                }
                if (modo === 'chequeo' && !competenciaGuardada) {
                    alert("¡Atención! Para chequear precios debes ir a 📋 Lista y escribir el nombre de la Competencia (Ej: Mercadona).");
                    return;
                }

                modoActivo = modo;
                btnRapido.classList.remove('activo');
                btnChequeo.classList.remove('activo');
                btnPedidos.classList.remove('activo');
                resultadoDiv.style.display = 'flex';
                
                if (modo === 'rapido') {
                    btnRapido.classList.add('activo');
                    resultadoDiv.innerHTML = "<h3 style='color:#ffc107; margin:0;'>⚡ MODO 1 ACTIVO</h3><p style='font-size:14px; margin-top:4px;'>Se guardarán a tu Lista con cantidad 1 automáticamente.</p>";
                } else if (modo === 'chequeo') {
                    btnChequeo.classList.add('activo');
                    resultadoDiv.innerHTML = `<h3 style='color:#9c27b0; margin:0;'>🕵️ CHEQUEANDO: ${competenciaGuardada}</h3><p style='font-size:14px; margin-top:4px;'>Escanea el producto para introducir su PVP manualmente.</p>`;
                } else if (modo === 'pedidos') {
                    btnPedidos.classList.add('activo');
                    resultadoDiv.innerHTML = `<h3 style='color:#17a2b8; margin:0;'>🛒 MODO PEDIDOS</h3><p style='font-size:14px; margin-top:4px;'>Escanea para ver Rayón/Stock y pedir.</p>`;
                }
            }
            inputCodigo.focus();
        }

        function forzarCierreTecladoNativo() {
            inputCodigo.disabled = true; 
            document.activeElement.blur();
            setTimeout(() => { inputCodigo.disabled = false; }, 300);
        }

        function buscarArticuloGlobal(termino) {
            let termLimpio = termino.replace(/^0+/, '');
            let ean12 = termLimpio.padStart(12, '0');
            
            if (inventario.hasOwnProperty(termino)) return { ean: termino, art: inventario[termino], esMaestro: false };
            if (inventario.hasOwnProperty(termLimpio)) return { ean: termLimpio, art: inventario[termLimpio], esMaestro: false };
            if (inventario.hasOwnProperty(ean12)) return { ean: ean12, art: inventario[ean12], esMaestro: false };
            
            if (inventarioMaestro.hasOwnProperty(termino)) return { ean: termino, art: inventarioMaestro[termino], esMaestro: true };
            if (inventarioMaestro.hasOwnProperty(termLimpio)) return { ean: termLimpio, art: inventarioMaestro[termLimpio], esMaestro: true };

        function procesarBusqueda(terminoBusqueda) {
            if (inputActivoId !== 'inputCodigo') {
                inputCodigo.value = ""; 
                return;
            }

            let termino = terminoBusqueda.trim().toUpperCase();
            inputCodigo.value = ""; 
            if (!termino) return;

            if (modoActivo === 'rapido') { procesarEscaneoRapido(termino); return; }
            if (modoActivo === 'chequeo') { procesarEscaneoChequeo(termino); return; }
            if (modoActivo === 'pedidos') { procesarEscaneoPedido(termino); return; }

            let result = buscarArticuloGlobal(termino);

            if (result) {
                mostrarArticuloCompleto(result.ean, result.esMaestro);
            } else {
                let palabras = termino.split(" ").filter(t => t.length > 0);
                let coincidencias = [];
                
                for (const [ean, articulo] of Object.entries(inventario)) {
                    if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) {
                        coincidencias.push({ ean: ean, articulo: articulo, esMaestro: false });
                    }
                }
                
                if (coincidencias.length < 50) {
                    for (const [ean, articulo] of Object.entries(inventarioMaestro)) {
                        if (palabras.every(palabra => articulo.descripcion.toUpperCase().includes(palabra))) {
                            coincidencias.push({ ean: ean, articulo: articulo, esMaestro: true });
                            if (coincidencias.length >= 50) break;
                        }
                    }
                }

                if (coincidencias.length === 0) {
                    mostrarArticuloDesconocido(termino);
                } else if (coincidencias.length === 1) {
                    mostrarArticuloCompleto(coincidencias[0].ean, coincidencias[0].esMaestro);
                } else {
                    let htmlLista = `<h3 style="margin: 0 0 8px 0; font-size: 14px; color: #007bff;">${coincidencias.length} encontrados:</h3><ul class="lista-resultados">`;
                    coincidencias.slice(0, 50).forEach(c => {
                        let etiquetaExtra = c.esMaestro ? `<span style="color:#ff9800; font-size:10px;">(MAESTRO)</span>` : "";
                        htmlLista += `<li class="item-resultado" onclick="mostrarArticuloCompleto('${c.ean}', ${c.esMaestro})">
                            <span class="item-desc">${c.articulo.descripcion}</span>
                            <span class="item-ean">EAN: ${c.ean} ${etiquetaExtra}</span></li>`;
                    });
                    if (coincidencias.length >= 50) {
                        htmlLista += `<li class="item-resultado" style="text-align:center; color:#666; font-size:12px;">...limitado a 50. Añade más palabras para filtrar.</li>`;
                    }
                    htmlLista += `</ul>`;
                    
                    resultadoDiv.style.display = 'flex';
                    resultadoDiv.style.borderColor = "#007bff";
                    resultadoDiv.innerHTML = htmlLista;
                }
            }
            
            setTimeout(() => inputCodigo.blur(), 100);
        }

        async function cargarInventario() {
            estadoDiv.innerHTML = "Iniciando BBDD Local..."; estadoDiv.style.color = "blue";
            await initDB();
            
            let contadorTienda = 0;
            let fechaFmt = "-";
            
            try {
                estadoDiv.innerHTML = "Sincronizando Tienda (1/2)...";
                let urlTienda = 'TIENDA.csv?' + new Date().getTime();
                let response = await fetch(urlTienda);
                if (!response.ok) {
                    urlTienda = 'tienda.csv?' + new Date().getTime(); 
                    response = await fetch(urlTienda);
                }
                
                if (response.ok) {
                    const lastModifiedHeader = response.headers.get('Last-Modified');
                    const d = lastModifiedHeader ? new Date(lastModifiedHeader) : new Date();
                    fechaFmt = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    
                    let textoTienda = await response.text();
                    let results = await parsearCSV(textoTienda, { header: false, delimiter: ";", skipEmptyLines: true });
                    
                    inventario = {};
                    results.data.forEach(fila => {
                        if(fila.length >= 3) {
                            let ean = fila[0] ? fila[0].trim() : "";
                            let desc = fila[1] ? fila[1].trim() : "";
                            let stock = fila[2] ? fila[2].trim() : "0";
                            let val3 = fila[3] ? fila[3].trim() : "-";
                            let val4 = fila[4] ? fila[4].trim() : "-";
                            let precio = "-", rayon = "-";
                            if (/[a-zA-Z]/.test(val3) || val3.includes(" ")) { rayon = val3; precio = val4; } 
                            else { precio = val3; rayon = val4; }
                            
                            let fecha = fila[5] ? fila[5].trim() : "-";
                            let ventas = (fila.length > 6 && fila[6]) ? fila[6].trim() : "0";
                            
                            if(ean) { inventario[ean] = { descripcion: desc, stock, precio, rayon, fecha, ventas }; contadorTienda++; }
                        }
                    });
                }
            } catch (error) { console.error("Error cargando TIENDA.csv:", error); }

            try {
                estadoDiv.innerHTML = "Sincronizando Maestro (2/2)...";
                let urlMaestro = 'MAESTRO_FILTRADO.csv?' + new Date().getTime();
                let responseM = await fetch(urlMaestro);
                
                if (responseM.ok) {
                    let textoMaestro = await responseM.text();
                    await guardarArchivoLocal('maestro_csv', textoMaestro);
                    await procesarTextoMaestro(textoMaestro);
                } else {
                    throw new Error("No red");
                }
            } catch (e) {
                let textoLocal = await leerArchivoLocal('maestro_csv');
                if (textoLocal) {
                    await procesarTextoMaestro(textoLocal);
                }
            }
            
            estadoDiv.innerHTML = `Stock: ${contadorTienda} | Maestro: ${Object.keys(inventarioMaestro).length} <span class="texto-fecha">Últ. Sinc: ${fechaFmt}</span>`; 
            estadoDiv.style.color = "#28a745";
        }

        async function procesarTextoMaestro(texto) {
            let results = await parsearCSV(texto, { header: true, delimiter: ";", skipEmptyLines: true });
            inventarioMaestro = {};
            results.data.forEach(fila => {
                let ean = fila['EAN'] ? fila['EAN'].trim() : "";
                if (ean) {
                    inventarioMaestro[ean] = {
                        descripcion: fila['DESCRIPCION'] || "",
                        precio: fila['PVP_MAESTRO'] || "-",
                        fecha: fila['ULTIMA_VENTA'] || "-",
                        stock: "0",
                        rayon: "-"
                    };
                }
            });
        }

        function verListas() { document.getElementById('modalListas').style.display = 'flex'; renderizarLista(); }
        function cerrarModalListas() { document.getElementById('modalListas').style.display = 'none'; if (ultimoModo === 'teclado') inputCodigo.focus(); }

        function renderizarLista() {
            const contenedor = document.getElementById('modal-body-listas');
            if (listaTrabajo.length === 0) { contenedor.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Lista vacía</div>'; return; }
            let html = '';
            [...listaTrabajo].reverse().forEach((item, idx) => {
                let badge = "";
                let detalleEx = "";
                if (item.tipo === 'competencia') {
                    badge = `<span class="etiqueta-tipo-lista bg-competencia">Chequeo</span>`;
                    detalleEx = `<br><span style="color:#9c27b0; font-weight:bold;">${item.competencia}: ${item.pvp_competencia}€ (Dif: ${item.opus})</span>`;
                } else if (item.tipo === 'pedido') {
                    badge = `<span class="etiqueta-tipo-lista bg-pedido">Pedido</span>`;
                    detalleEx = `<br><span style="color:#17a2b8; font-weight:bold;">Stock actual: ${item.stock}</span>`;
                } else {
                    badge = `<span class="etiqueta-tipo-lista bg-inventario">Inventario</span>`;
                }

                html += `<div class="item-lista-guardada">
                            <div class="item-lista-info">
                                ${badge}
                                <span class="item-desc-modal">${item.descripcion}</span>
                                <span class="item-detalle-modal">EAN: ${item.ean}${detalleEx}</span>
                            </div>
                            <div style="display:flex; align-items:center;">
                                <span class="item-cant-modal">x${item.cantidad}</span>
                                <button class="btn-editar-item" onclick="editarItemLista(${listaTrabajo.length - 1 - idx})">✏️</button>
                                <button class="btn-borrar-item" onclick="eliminarItemLista(${listaTrabajo.length - 1 - idx})">✕</button>
                            </div>
                         </div>`;
            });
            contenedor.innerHTML = html;
        }

        function editarItemLista(index) {
            let item = listaTrabajo[index];
            if (item.tipo === 'competencia') {
                let nuevo = prompt(`Editar precio de la competencia para:\n${item.descripcion}`, item.pvp_competencia);
                if (nuevo !== null && nuevo.trim() !== "") {
                    let precioCompStr = nuevo.trim().replace(/,/g, '.');
                    item.pvp_competencia = precioCompStr;
                    
                    let opusFinal = "FALTA PVP";
                    let pvpCompNum = parseFloat(precioCompStr);
                    let pvpNuestroStr = item.pvp_nuestro;
                    if (pvpNuestroStr !== "-" && pvpNuestroStr !== "") {
                        let pvpNuesNum = parseFloat(pvpNuestroStr.replace(',', '.'));
                        if (!isNaN(pvpNuesNum) && !isNaN(pvpCompNum) && pvpCompNum > 0) {
                            let diff = ((pvpNuesNum - pvpCompNum) / pvpCompNum) * 100;
                            let sign = diff > 0 ? "+" : "";
                            opusFinal = sign + diff.toFixed(2) + "%";
                        }
                    }
                    item.opus = opusFinal;
                    localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                    renderizarLista();
                }
            } else {
                let nuevo = prompt(`Editar cantidad para:\n${item.descripcion}`, item.cantidad);
                if (nuevo !== null && nuevo.trim() !== "") {
                    let cantNum = parseFloat(nuevo.trim().replace(',', '.'));
                    if (!isNaN(cantNum) && cantNum > 0) {
                        item.cantidad = cantNum;
                        localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo));
                        renderizarLista();
                    }
                }
            }
        }

        function eliminarItemLista(index) { listaTrabajo.splice(index, 1); localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); }
        function borrarListaActual() { if(confirm('¿VACIAR toda la lista?')) { listaTrabajo = []; localStorage.setItem('inventarioListaTrabajo', JSON.stringify(listaTrabajo)); renderizarLista(); } }
        
        async function exportarListaExcel() {
            if(listaTrabajo.length === 0) return;
            
            let listaInvertida = [...listaTrabajo].reverse();
            
            let dataInventario = [];
            let dataCompetencia = [];
            let dataPedidos = [];

            listaInvertida.forEach(item => {
                let descLimpia = item.descripcion || "";
                let eanLimpio = item.ean ? String(item.ean) : ""; 

                if (item.tipo === 'competencia') {
                    dataCompetencia.push({
                        "RAYON": item.rayon || "",
                        "EAN": eanLimpio,
                        "PVP COMPETENCIA": item.pvp_competencia || "",
                        "PVP LECLERC": item.pvp_nuestro || "",
                        "OPUS": item.opus || "",
                        "DESCRIPCION": descLimpia,
                        "COMPETENCIA": item.competencia || "",
                        "USUARIO / TERMINAL": usuarioGuardado
                    });
                } else if (item.tipo === 'pedido') {
                    dataPedidos.push({
                        "RAYON": item.rayon || "",
                        "EAN": eanLimpio,
                        "STOCK": item.stock || "",
                        "CANTIDAD": item.cantidad || "",
                        "DESCRIPCION": descLimpia,
                        "FECHA": item.fecha || "",
                        "USUARIO / TERMINAL": usuarioGuardado
                    });
                } else {
                    dataInventario.push({
                        "EAN": eanLimpio,
                        "CANTIDAD": item.cantidad || "",
                        "DESCRIPCION": descLimpia,
                        "FECHA": item.fecha || "",
                        "USUARIO / TERMINAL": usuarioGuardado
                    });
                }
            });

            if(dataInventario.length === 0) dataInventario.push({"EAN":"-", "CANTIDAD":"-", "DESCRIPCION":"Sin datos", "FECHA":"-", "USUARIO / TERMINAL":"-"});
            if(dataCompetencia.length === 0) dataCompetencia.push({"RAYON":"-", "EAN":"-", "PVP COMPETENCIA":"-", "PVP LECLERC":"-", "OPUS":"-", "DESCRIPCION":"Sin datos", "COMPETENCIA":"-", "USUARIO / TERMINAL":"-"});
            if(dataPedidos.length === 0) dataPedidos.push({"RAYON":"-", "EAN":"-", "STOCK":"-", "CANTIDAD":"-", "DESCRIPCION":"Sin datos", "FECHA":"-", "USUARIO / TERMINAL":"-"});

            var wb = XLSX.utils.book_new();
            var wsInventario = XLSX.utils.json_to_sheet(dataInventario);
            var wsCompetencia = XLSX.utils.json_to_sheet(dataCompetencia);
            var wsPedidos = XLSX.utils.json_to_sheet(dataPedidos);

            XLSX.utils.book_append_sheet(wb, wsInventario, "LISTADO");
            XLSX.utils.book_append_sheet(wb, wsCompetencia, "SEGUIMIENTO PRECIOS");
            XLSX.utils.book_append_sheet(wb, wsPedidos, "PEDIDOS");

            var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
            var blob = new Blob([wbout], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
            var file = new File([blob], 'Trabajo.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: 'Exportación de Inventario', files: [file] });
                    return; 
                } catch (err) {
                    console.log('Compartir cancelado o no disponible.', err);
                }
            }
            
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Trabajo.xlsx`); 
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.onload = () => cargarInventario();
    </script>
</body>

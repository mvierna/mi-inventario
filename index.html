<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Inventario</title>
    
    <!-- Mantenemos solo la librería para leer el archivo CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .resultado { margin-top: 20px; padding: 15px; border: 2px solid #333; border-radius: 8px; background-color: #f4f4f4; }
        #estado { color: blue; font-weight: bold; margin-bottom: 20px; }
        
        /* Caja de texto ampliada y optimizada para teclados virtuales y lectores láser */
        .caja-escaneo { margin: 20px 0; padding: 20px; background-color: #e9ecef; border-radius: 8px; }
        #inputCodigo { 
            padding: 15px; 
            font-size: 22px; /* Letra más grande */
            width: 90%; 
            max-width: 350px; 
            text-align: center; 
            border: 3px solid #007bff; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>
    <h1>Buscador de Artículos</h1>
    
    <div id="estado">Conectando con la nube...</div>

    <div class="caja-escaneo">
        <h3>Toca la caja para escanear</h3>
        <p style="font-size: 14px; margin-top: 0;">Usa tu teclado especial o el lector láser.</p>
        <!-- inputmode="numeric" ayuda a que algunos teclados abran directamente en formato de números -->
        <input type="text" id="inputCodigo" inputmode="numeric" placeholder="Escanea el código aquí..." autofocus>
    </div>

    <div id="resultado" class="resultado">
        Esperando a que escanees un código...
    </div>

    <script>
        let inventario = [];
        let ultimoEscan = ""; 

        // --- SISTEMA DE AUDIO (BEEP) ---
        function reproducirBeep(frecuencia = 800, duracion = 0.1) {
            const contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
            const oscilador = contextoAudio.createOscillator();
            oscilador.type = 'sine';
            oscilador.frequency.setValueAtTime(frecuencia, contextoAudio.currentTime);
            oscilador.connect(contextoAudio.destination);
            oscilador.start();
            oscilador.stop(contextoAudio.currentTime + duracion);
        }

        // --- CARGA DEL INVENTARIO DESDE LA NUBE ---
        Papa.parse("TIENDA.csv", {
            download: true,
            header: false,
            complete: function(resultados) {
                inventario = resultados.data;
                document.getElementById('estado').innerText = "¡Inventario cargado exitosamente!";
                document.getElementById('estado').style.color = "green";
            },
            error: function() {
                document.getElementById('estado').innerText = "Error: No se encontró TIENDA.csv.";
                document.getElementById('estado').style.color = "red";
            }
        });

        // --- LÓGICA DE BÚSQUEDA ---
        function buscarEnInventario(eanEscaneado) {
            const divResultado = document.getElementById('resultado');

            if (inventario.length === 0) {
                divResultado.innerHTML = "<p style='color: red;'>El inventario aún no está listo.</p>";
                return;
            }

            if (eanEscaneado === ultimoEscan) return;
            ultimoEscan = eanEscaneado;

            for (let i = 1; i < inventario.length; i++) {
                let fila = inventario[i];
                
                if (fila.length >= 3) {
                    let ean = fila[0].trim();
                    let descripcion = fila[1].trim();
                    let stock = fila[2].trim();

                    if (ean === eanEscaneado) {
                        reproducirBeep(800, 0.15); 
                        divResultado.innerHTML = `
                            <h3 style="color: green;">¡Artículo encontrado!</h3>
                            <p><b>EAN:</b> ${eanEscaneado}</p>
                            <p><b>Descriptivo:</b> ${descripcion}</p>
                            <p><b>Stock:</b> ${stock}</p>
                        `;
                        setTimeout(() => { ultimoEscan = ""; }, 2000);
                        return;
                    }
                }
            }

            reproducirBeep(300, 0.3);
            divResultado.innerHTML = `
                <h3 style="color: red;">No encontrado</h3>
                <p>El código <b>${eanEscaneado}</b> no está en la lista.</p>
            `;
            setTimeout(() => { ultimoEscan = ""; }, 2000);
        }

        // --- CONFIGURACIÓN DEL TECLADO/LÁSER ---
        const inputCodigo = document.getElementById('inputCodigo');
        
        inputCodigo.addEventListener('keypress', function(evento) {
            // Detecta la pulsación de la tecla 'Enter'
            if (evento.key === 'Enter') {
                let codigoLeido = inputCodigo.value.trim(); 
                if (codigoLeido !== "") {
                    buscarEnInventario(codigoLeido); // Busca el artículo
                    inputCodigo.value = ""; // Vacía la caja
                    inputCodigo.focus(); // Mantiene el cursor en la caja para seguir escaneando sin volver a tocar
                }
            }
        });
    </script>
</body>
</html>

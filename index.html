<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Hipermercado</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; }
        #estado { color: blue; font-weight: bold; margin-bottom: 20px; }
        .resultado { margin-bottom: 20px; padding: 15px; border: 2px solid #333; border-radius: 8px; background-color: #f4f4f4; font-size: 18px; }
        
        .caja-interfaz { margin: 15px 0; padding: 15px; background-color: #e9ecef; border-radius: 8px; }
        #inputCodigo { padding: 15px; font-size: 22px; width: 85%; max-width: 350px; text-align: center; border: 3px solid #007bff; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Inventario Hipermercado</h1>
    
    <!-- Aquí mostraremos el recuento de los 50.000 artículos -->
    <div id="estado">Conectando con la base de datos...</div>

    <div id="resultado" class="resultado">
        Esperando a que escanees un código...
    </div>

    <div class="caja-interfaz">
        <h3 style="margin-top: 0;">Toca la caja para escanear</h3>
        <input type="text" id="inputCodigo" inputmode="numeric" placeholder="Escanea el código aquí...">
    </div>

    <script>
        let inventario = [];
        let ultimoEscan = ""; 

        // Emite el sonido de éxito o error
        function reproducirBeep(frecuencia = 800, duracion = 0.1) {
            const contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
            const oscilador = contextoAudio.createOscillator();
            oscilador.type = 'sine';
            oscilador.frequency.setValueAtTime(frecuencia, contextoAudio.currentTime);
            oscilador.connect(contextoAudio.destination);
            oscilador.start();
            oscilador.stop(contextoAudio.currentTime + duracion);
        }

        // Descarga automáticamente TIENDA.csv al abrir la página
        Papa.parse("TIENDA.csv", {
            download: true,
            header: false,
            skipEmptyLines: true, // Ignora filas vacías al final del Excel
            complete: function(resultados) {
                inventario = resultados.data;
                // Muestra la cantidad exacta de artículos cargados
                document.getElementById('estado').innerText = "¡Base de datos lista: " + inventario.length + " artículos!";
                document.getElementById('estado').style.color = "green";
            },
            error: function() {
                document.getElementById('estado').innerText = "Error: No se encontró TIENDA.csv";
                document.getElementById('estado').style.color = "red";
            }
        });

        // Lógica de búsqueda con limpieza de datos
        function buscarEnInventario(eanEscaneado) {
            const divResultado = document.getElementById('resultado');

            if (inventario.length === 0) {
                divResultado.innerHTML = "<p style='color: red;'>El inventario aún no está listo.</p>";
                return;
            }

            // Elimina cualquier símbolo o letra extra del escáner
            let escaneadoLimpio = String(eanEscaneado).replace(/[^0-9]/g, '');

            if (escaneadoLimpio === ultimoEscan) return;
            ultimoEscan = escaneadoLimpio;

            for (let i = 0; i < inventario.length; i++) {
                let fila = inventario[i];
                
                if (fila.length > 0) {
                    // Elimina cualquier símbolo o letra extra de la base de datos
                    let eanCSV = String(fila[0]).replace(/[^0-9]/g, '');
                    let descripcion = fila[1] ? fila[1].trim() : "Sin descripción";
                    let stock = fila[2] ? fila[2].trim() : "0";

                    if (eanCSV === escaneadoLimpio && escaneadoLimpio !== "") {
                        reproducirBeep(800, 0.15); 
                        divResultado.innerHTML = `
                            <h3 style="color: green; margin-top: 0;">¡Artículo encontrado!</h3>
                            <p><b>EAN:</b> ${escaneadoLimpio}</p>
                            <p><b>Descriptivo:</b> ${descripcion}</p>
                            <p><b>Stock:</b> ${stock}</p>
                        `;
                        setTimeout(() => { ultimoEscan = ""; }, 2000);
                        return;
                    }
                }
            }

            // Muestra en pantalla exactamente qué número buscó para facilitar el diagnóstico
            reproducirBeep(300, 0.3);
            divResultado.innerHTML = `
                <h3 style="color: red; margin-top: 0;">No encontrado</h3>
                <p>El código <b>${escaneadoLimpio}</b> no está en el hipermercado.</p>
            `;
            setTimeout(() => { ultimoEscan = ""; }, 2000);
        }

        // Detecta la tecla Enter del teclado virtual o láser
        const inputCodigo = document.getElementById('inputCodigo');
        
        inputCodigo.addEventListener('keypress', function(evento) {
            if (evento.key === 'Enter') {
                let codigoLeido = inputCodigo.value; 
                if (codigoLeido !== "") {
                    buscarEnInventario(codigoLeido);
                    inputCodigo.value = ""; 
                    inputCodigo.blur(); 
                }
            }
        });
    </script>
</body>
</html>

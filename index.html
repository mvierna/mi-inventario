<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Hipermercado</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario">
    <link rel="apple-touch-icon" href="icono.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background-color: #ffffff; margin: 0; }
        h1 { margin-top: 10px; font-size: 28px; }
        #estado { font-weight: bold; margin-bottom: 15px; font-size: 16px; }
        .resultado { margin-bottom: 20px; padding: 15px; border: 2px solid #333; border-radius: 8px; background-color: #f8f9fa; font-size: 18px; min-height: 80px; display: flex; flex-direction: column; justify-content: center;}
        .caja-interfaz { margin: 15px 0; padding: 20px; background-color: #e9ecef; border-radius: 8px; }
        #inputCodigo { padding: 15px; font-size: 22px; width: 85%; max-width: 350px; text-align: center; border: 3px solid #007bff; border-radius: 8px; outline: none; }
        #inputCodigo:focus { border-color: #0056b3; }

        /* Botón de sincronización */
        .btn-actualizar { padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; width: 85%; max-width: 350px; margin-bottom: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-actualizar:active { background-color: #218838; transform: translateY(2px); }

        /* Panel secundario para precio, fecha y ventas (más pequeños y ordenados arriba) */
        .panel-secundario {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin: 15px 0 10px 0;
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .item-secundario {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .etiqueta-secundaria {
            font-size: 11px;
            text-transform: uppercase;
            color: #6c757d;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .valor-secundario {
            font-size: 15px;
            font-weight: bold;
            color: #212529;
        }

        /* Caja principal del Stock destacada en grande abajo */
        .caja-stock {
            margin-top: 10px;
            padding: 14px;
            background-color: #28a745;
            color: #ffffff;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .etiqueta-stock {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            opacity: 0.95;
        }
        .numero-stock {
            font-size: 46px;
            font-weight: bold;
            margin: 4px 0 0 0;
            line-height: 1;
        }

        p { margin: 6px 0; }
    </style>
</head>
<body>
    <h1>Inventario<br>Hipermercado</h1>

    <button class="btn-actualizar" onclick="cargarInventario()">🔄 Sincronizar Datos Ahora</button>

    <div id="estado" style="color: blue;">Conectando con la base de datos...</div>

    <div id="resultado" class="resultado">
        Esperando a que escanees un código...
    </div>

    <div class="caja-interfaz">
        <p style="font-weight: bold; font-size: 18px; margin-bottom: 15px;">Toca la caja para escanear</p>
        <input type="text" id="inputCodigo" placeholder="Escanea el código aquí..." autocomplete="off">
    </div>

    <script>
        let inventario = {};
        const inputCodigo = document.getElementById('inputCodigo');
        const resultadoDiv = document.getElementById('resultado');
        const estadoDiv = document.getElementById('estado');

        // Función para leer el CSV y cargar los datos en memoria
        function cargarInventario() {
            estadoDiv.innerText = "Sincronizando con la base de datos...";
            estadoDiv.style.color = "blue";
            resultadoDiv.innerHTML = "Esperando a que escanees un código...";

            const url = 'TIENDA.csv?' + new Date().getTime();

            Papa.parse(url, {
                download: true,
                header: false,
                delimiter: ";",
                skipEmptyLines: true,
                complete: function(results) {
                    inventario = {};
                    let contador = 0;
                    
                    results.data.forEach(fila => {
                        // Verificamos que la fila tenga al menos los datos básicos
                        if(fila.length >= 3) {
                            let ean = fila[0] ? fila[0].trim() : "";
                            let desc = fila[1] ? fila[1].trim() : "";
                            let stock = fila[2] ? fila[2].trim() : "";
                            let precio = fila[3] ? fila[3].trim() : "-";
                            let fecha = fila[4] ? fila[4].trim() : "-";
                            let ventas = fila[5] ? fila[5].trim() : "0";
                            
                            if(ean) {
                                inventario[ean] = { 
                                    descripcion: desc, 
                                    stock: stock,
                                    precio: precio,
                                    fecha: fecha,
                                    ventas: ventas
                                };
                                contador++;
                            }
                        }
                    });
                    
                    estadoDiv.innerText = "¡Base de datos lista: " + contador + " artículos!";
                    estadoDiv.style.color = "green";
                    
                    inputCodigo.focus();
                },
                error: function(err) {
                    estadoDiv.innerText = "Error al cargar la base de datos.";
                    estadoDiv.style.color = "red";
                    console.error("Fallo al leer el CSV:", err);
                }
            });
        }

        // Lógica de escaneo con la tecla "Enter"
        inputCodigo.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let codigoEscaneado = inputCodigo.value.trim();
                
                if (codigoEscaneado === "") return;

                // Buscar el artículo en el inventario cargado
                if (inventario.hasOwnProperty(codigoEscaneado)) {
                    let articulo = inventario[codigoEscaneado];
                    
                    resultadoDiv.innerHTML = `
                        <h3 style="color: green; margin-top: 0; margin-bottom: 8px; font-size: 20px;">¡Artículo encontrado!</h3>
                        <p style="font-size: 15px; color: #555;"><strong>EAN:</strong> ${codigoEscaneado}</p>
                        <p style="font-size: 17px; font-weight: bold;">${articulo.descripcion}</p>

                        <!-- Panel secundario con Precio, Última Recepción y Ventas -->
                        <div class="panel-secundario">
                            <div class="item-secundario">
                                <span class="etiqueta-secundaria">P.V.P.</span>
                                <span class="valor-secundario">${articulo.precio}</span>
                            </div>
                            <div class="item-secundario">
                                <span class="etiqueta-secundaria">Últ. Recep.</span>
                                <span class="valor-secundario">${articulo.fecha}</span>
                            </div>
                            <div class="item-secundario">
                                <span class="etiqueta-secundaria">Ventas Recep.</span>
                                <span class="valor-secundario">${articulo.ventas} u.</span>
                            </div>
                        </div>

                        <!-- Bloque de Stock destacado en grande -->
                        <div class="caja-stock">
                            <p class="etiqueta-stock">Stock Disponible</p>
                            <p class="numero-stock">${articulo.stock}</p>
                        </div>
                    `;
                } else {
                    resultadoDiv.innerHTML = `
                        <h3 style="color: red; margin-top: 0; margin-bottom: 15px; font-size: 22px;">No encontrado</h3>
                        <p style="font-size: 18px;">El código <strong>${codigoEscaneado}</strong> no está en el hipermercado.</p>
                    `;
                }
                
                inputCodigo.value = "";
                inputCodigo.focus();
            }
        });

        window.onload = cargarInventario;
    </script>
</body>
</html>
